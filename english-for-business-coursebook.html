o hard skills (Excel, English) and one soft skill (teamwork). Your application should answer all three.\",\"vocab\": [\"hard skill\",\"soft skill\",\"transferable skill\",\"teamwork\",\"time management\",\"adaptability\",\"attention to detail\",\"certify\"]},{\"name\": \"Talking about your skills\",\"icon\": \"\",\"sub\": \"\",\"num\": 3,\"full\": false,\"img\": null,\"description\": \"“I am a good communicator” tells an employer nothing, because every applicant writes it. A skill becomes believable when you attach it to something you actually did and say what the result was. This works in a cover letter, in an interview, and at a business fair.\",\"points\": [\"Name the skill, give one example, say the result — in that order\",\"Use the past tense for what you did, and be clear about your own part in a team\",\"Numbers make it real: how many people, how long, how much\",\"Avoid empty adjectives on their own: hard-working, motivated, dynamic\",\"With little work experience, use your studies, a hobby, sport, or voluntary work\",\"Prepare three examples before an interview — most questions can be answered from them\"],\"when\": null,\"questions\": null,\"phrases\": null,\"example\": \"Weak: “I have good organisational skills.”  Strong: “I organised the schedule for six volunteers at a two-day event. Everyone knew where to be, and we did not need to change the plan once.”\",\"vocab\": [\"demonstrate\",\"achievement\",\"concrete\",\"gain experience\",\"develop\",\"reliable\",\"handle\",\"outcome\"]},{\"name\": \"Job interviews\",\"icon\": \"\",\"sub\": \"\",\"num\": 4,\"full\": false,\"img\": null,\"description\": \"An interview is a conversation with a purpose. The employer wants to know what you can do and what you are like to work with. You want to know whether the job suits you. Preparation matters more than perfect English.\",\"points\": [\"Before: read the job advertisement and the company website, and prepare three examples of your own work\",\"Structure your answers: say the situation, what you did, and what the result was\",\"Say “I” when you describe your own part of a team result — this is not boasting, it answers the question\",\"It is fine to take two seconds to think, or to ask for a question to be repeated\",\"Prepare two questions to ask them: about the team, the tasks, or the first months in the job\",\"After: send a short thank-you email within a day\"],\"when\": null,\"questions\": null,\"phrases\": null,\"example\": \"“In my summer job I was responsible for the till at busy times. One Saturday the card system stopped working. I called the supplier, and I wrote the prices down by hand so we could keep serving. We lost about ten minutes instead of closing for the afternoon.”\",\"vocab\": [\"job advertisement\",\"requirement\",\"strength\",\"weakness\",\"be responsible for\",\"hands-on experience\",\"notice period\",\"get back to someone\"]},{\"name\": \"Business fairs and networking\",\"icon\": \"\",\"sub\": \"\",\"num\": 5,\"full\": false,\"img\": null,\"description\": \"At a fair you meet many people for a few minutes each. The goal is not to sell immediately. The goal is to make a connection that continues afterwards, by email or at a later meeting.\",\"points\": [\"Prepare a short introduction: who you are, what you study or do, and why you are here\",\"Approach a stand with a question, not with a speech — “Could you tell me what you do?” works everywhere\",\"Listen first: it is easier to say something useful once you know what they need\",\"Exchange contacts before the conversation ends, not after\",\"Leave politely: “It was good to meet you — I will send you that link.”\",\"Follow up within two days, and mention something you actually talked about\"],\"when\": null,\"questions\": null,\"phrases\": null,\"example\": \"“Hi, I am Aino, I study International Business at LAB. Could you tell me what your company does? … That is interesting, we studied something similar last term. Could I take your card, and send you a short question by email?”\",\"vocab\": [\"trade fair\",\"stand\",\"network\",\"elevator pitch\",\"lead\",\"exchange contacts\",\"strike up a conversation\",\"keep in touch\"]},{\"name\": \"Giving and receiving feedback\",\"icon\": \"\",\"sub\": \"\",\"num\": 6,\"full\": false,\"img\": null,\"description\": \"Feedback is information about work, not a judgement about a person. Good feedback says what worked, what to change, and why. Receiving it well is a skill you can practise, and it is a skill employers notice.\",\"points\": [\"Comment on the work, not the person: “this section is unclear”, not “you are unclear”\",\"Be specific: say which part, and what would make it better\",\"Balance is useful, but do not hide the main point in the middle of compliments\",\"Written feedback has no tone of voice, so be more explicit than you would be in speech\",\"When receiving: listen fully, then ask a question before you explain or defend\",\"“Which of these matters most?” is often the most useful question you can ask\"],\"when\": null,\"questions\": null,\"phrases\": null,\"example\": \"“The opening paragraph is strong — I knew immediately what the report was about. Section 3 was harder to follow, because the two arguments are mixed together. If you split them into two paragraphs, the second one becomes much easier to read.”\",\"vocab\": [\"feedback\",\"constructive\",\"point out\",\"room for improvement\",\"take on board\",\"take it personally\",\"praise\",\"clarify\"]}]}],\"exercise\": {\"kind\": \"register\",\"title\": \"Say It Better\",\"intro\": \"Read the weak or blunt version. Then choose the wording that would actually work in an application, an interview, at a fair, or in feedback.\",\"lead\": \"The blunt version:\",\"ask\": \"Which version works better?\",\"items\": [{\"casual\": \"I am hard-working and motivated.\",\"options\": [\"Last summer I worked four evenings a week while studying full time, and I did not miss a shift.\",\"I am a very hard-working person.\",\"I am motivated and always do my best.\"],\"answer\": \"Last summer I worked four evenings a week while studying full time, and I did not miss a shift.\",\"rationale\": \"Every applicant writes “hard-working”. Only one of these gives the employer something they can believe, because it says what you actually did.\"},{\"casual\": \"I am good with people.\",\"options\": [\"In my summer job I handled about eighty customers a day, including complaints.\",\"I am a people person.\",\"I like working with people a lot.\"],\"answer\": \"In my summer job I handled about eighty customers a day, including complaints.\",\"rationale\": \"“Good with people” is a claim. The number, and the mention of complaints, turn it into evidence.\"},{\"casual\": \"I do not have any real experience.\",\"options\": [\"I have not worked in this field yet, but I organised the schedule for six volunteers at a two-day event.\",\"I have no experience, sorry.\",\"I have only studied, I have never worked.\"],\"answer\": \"I have not worked in this field yet, but I organised the schedule for six volunteers at a two-day event.\",\"rationale\": \"Honest about the gap, then straight to a transferable skill with a concrete example. Studies, hobbies and voluntary work all count.\"},{\"casual\": \"Your report is confusing.\",\"options\": [\"Section 3 was harder to follow — could the two arguments be separated?\",\"I could not understand your report.\",\"This does not make sense.\"],\"answer\": \"Section 3 was harder to follow — could the two arguments be separated?\",\"rationale\": \"It names the exact place, describes the effect on the reader, and suggests a change. The other two judge the whole text and give the writer nothing to do.\"},{\"casual\": \"I need this job, please hire me.\",\"options\": [\"I am very interested in this role, and I think my summer job experience would be useful to your team.\",\"I really need a job at the moment.\",\"Please give me a chance, I will work hard.\"],\"answer\": \"I am very interested in this role, and I think my summer job experience would be useful to your team.\",\"rationale\": \"An interview answer should say what you can offer, not what you need. The other two ask the employer to solve your problem.\"},{\"casual\": \"I don't know.\",\"options\": [\"That is not something I have done yet, but I learned something similar when…\",\"No idea, sorry.\",\"I have never done that.\"],\"answer\": \"That is not something I have done yet, but I learned something similar when…\",\"rationale\": \"Honest about the gap, then moves to what you can do. In an interview, “not yet” plus a related example is far stronger than a flat no.\"},{\"casual\": \"Can I have your email?\",\"options\": [\"Would it be alright if I sent you a short email about this?\",\"Give me your email.\",\"What is your email?\"],\"answer\": \"Would it be alright if I sent you a short email about this?\",\"rationale\": \"It asks permission and says what the email will be about, so the other person knows what they are agreeing to.\"},{\"casual\": \"I have to go now.\",\"options\": [\"It was good to meet you — I will send you that link this week.\",\"OK, bye.\",\"I need to go to the next stand.\"],\"answer\": \"It was good to meet you — I will send you that link this week.\",\"rationale\": \"It closes the conversation warmly and makes a small promise, which is what turns a two-minute chat into a contact.\"},{\"casual\": \"You're wrong about the numbers.\",\"options\": [\"Could we check the figures on page three? I got a different total.\",\"The numbers are wrong.\",\"You made a mistake.\"],\"answer\": \"Could we check the figures on page three? I got a different total.\",\"rationale\": \"It points at the page, states your own result, and invites a check. Nobody has to lose face before the facts are known.\"}]},\"quiz\": [{\"q\": \"What is the difference between a CV and a cover letter?\",\"options\": [\"There is none — they are two words for the same document\",\"The CV lists what you have done; the cover letter explains why it fits this job\",\"The CV is for students; the cover letter is for professionals\",\"The cover letter lists your education and the CV explains your motivation\"],\"answer\": \"The CV lists what you have done; the cover letter explains why it fits this job\",\"rationale\": \"The CV is a record. The cover letter is an argument: it connects that record to one particular advertisement.\"},{\"q\": \"Which of these is a hard skill?\",\"options\": [\"Fluent Swedish\",\"Customer service\",\"Leadership\",\"Working under pressure\"],\"answer\": \"Fluent Swedish\",\"rationale\": \"A hard skill can be measured or certified. A language can be tested and given a level. The other three describe how you work, and need an example before anyone believes them.\"},{\"q\": \"Which of these is a soft skill?\",\"options\": [\"A driving licence\",\"Time management\",\"Excel\",\"An accounting certificate\"],\"answer\": \"Time management\",\"rationale\": \"Soft skills describe how you work with people and situations. They are harder to prove, which is why they need examples.\"},{\"q\": \"What does “transferable skill” mean?\",\"options\": [\"A skill you can teach to someone else\",\"A skill you learned in one situation that is useful in another\",\"A skill listed on a certificate\",\"A skill you are still learning\"],\"answer\": \"A skill you learned in one situation that is useful in another\",\"rationale\": \"It is why a café job belongs on an office application: the customer service and the time management move across.\"},{\"q\": \"Which sentence describes a skill most convincingly?\",\"options\": [\"“I have excellent organisational skills.”\",\"“I am very organised and hard-working.”\",\"“I organised the schedule for six volunteers at a two-day event.”\",\"“Organisation is one of my main strengths.”\"],\"answer\": \"“I organised the schedule for six volunteers at a two-day event.”\",\"rationale\": \"It is the only one with a concrete example and a number. The other three are claims that every applicant makes.\"},{\"q\": \"You have almost no work experience. What should you do in an application?\",\"options\": [\"Leave the experience section empty\",\"Use examples from studies, hobbies, sport or voluntary work\",\"Say that you are willing to learn, and nothing more\",\"Describe experience you do not really have\"],\"answer\": \"Use examples from studies, hobbies, sport or voluntary work\",\"rationale\": \"Employers accept these as evidence, as long as you say what you did and what the result was.\"},{\"q\": \"What should you do before writing a cover letter?\",\"options\": [\"Write one letter and send it to every employer\",\"Read the advertisement and note the words it uses for the skills it wants\",\"Make the letter as long as possible\",\"Copy sentences from the company website\"],\"answer\": \"Read the advertisement and note the words it uses for the skills it wants\",\"rationale\": \"Tailoring the letter to the advertisement is what makes it easy to read and easy to match. A general letter fits nothing.\"},{\"q\": \"In an interview, how should you describe your part in a team project?\",\"options\": [\"Always say “we”, so you do not sound arrogant\",\"Say what you personally did inside the team result\",\"Do not mention team projects\",\"Say you did all the work\"],\"answer\": \"Say what you personally did inside the team result\",\"rationale\": \"The interviewer needs to know what you can do. Naming your own contribution is not boasting — it is answering the question.\"},{\"q\": \"What is an “elevator pitch”?\",\"options\": [\"A sales presentation of about 20 minutes\",\"A very short spoken introduction, about 30 seconds\",\"A written business plan\",\"A question you ask the interviewer\"],\"answer\": \"A very short spoken introduction, about 30 seconds\",\"rationale\": \"The name comes from the idea of a short lift journey: you have half a minute to say who you are and what you offer.\"},{\"q\": \"At a trade fair, what is the best way to approach a stand?\",\"options\": [\"Start with your full sales pitch\",\"Wait until someone speaks to you\",\"Ask a question about what they do\",\"Take a brochure and leave\"],\"answer\": \"Ask a question about what they do\",\"rationale\": \"A question starts a conversation and tells you what they need, so anything you say afterwards can actually be relevant.\"},{\"q\": \"Which is the most useful piece of feedback?\",\"options\": [\"“This is bad.”\",\"“This is great, well done!”\",\"“Section 3 mixes two arguments — splitting them would make it clearer.”\",\"“I did not really like it.”\"],\"answer\": \"“Section 3 mixes two arguments — splitting them would make it clearer.”\",\"rationale\": \"It is specific about the place, the problem and the fix. The others are opinions the writer cannot act on.\"},{\"q\": \"You receive written feedback that feels harsh. What is the best first step?\",\"options\": [\"Read it again the next day, then ask which point matters most\",\"Reply the same day, explaining why you made the choices you did\",\"Ask the person to explain in detail what each comment refers to\",\"Rewrite the whole text first, then send it back for a second look\"],\"answer\": \"Read it again the next day, then ask which point matters most\",\"rationale\": \"All four are reasonable-sounding. Replying the same day usually means defending rather than listening. Asking about every comment turns feedback into work for the other person. Rewriting everything assumes all points matter equally — usually one or two do.\"},{\"q\": \"When should you send a thank-you email after an interview?\",\"options\": [\"Within about a day, while the conversation is fresh\",\"Within a week, so that you do not seem too eager\",\"Only once they have contacted you with a decision\",\"On the date they said they would let you know\"],\"answer\": \"Within about a day, while the conversation is fresh\",\"rationale\": \"All four are plausible-sounding timings. A day keeps you in mind while they are still comparing candidates. A week is usually after the decision, and the other two mean you never send one.\"},{\"q\": \"What does “to take feedback on board” mean?\",\"options\": [\"To write it down\",\"To listen to it and accept it\",\"To disagree with it politely\",\"To pass it to someone else\"],\"answer\": \"To listen to it and accept it\",\"rationale\": \"Taking something on board means you have really accepted the advice, not only heard it.\"},{\"q\": \"What is a “lead” at a business fair?\",\"options\": [\"The person in charge of the stand\",\"A person or company that might become a customer\",\"The first speaker at an event\",\"A free product sample\"],\"answer\": \"A person or company that might become a customer\",\"rationale\": \"Companies measure the success of a fair partly by how many leads they collect and follow up afterwards.\"},{\"q\": \"A job advertisement asks for “excellent Excel skills and the ability to prioritise”. How should you answer it?\",\"options\": [\"State the Excel; give an example for prioritising\",\"Give measurable proof for both, since both can be tested\",\"Simply state that you have both of these qualities\",\"List every Excel function that you know how to use\"],\"answer\": \"State the Excel; give an example for prioritising\",\"rationale\": \"The advertisement mixes a hard skill and a soft one, and they need different evidence. A hard skill can be stated or certified; a soft skill needs a situation and a result.\"},{\"q\": \"Which sentence gives the weakest evidence of a skill?\",\"options\": [\"I am experienced in customer service and enjoy it.\",\"I served about eighty customers a day for two summers.\",\"I handled complaints alone when the manager was away.\",\"I trained two new staff members during my second summer.\"],\"answer\": \"I am experienced in customer service and enjoy it.\",\"rationale\": \"It is the only one with no situation, no number and no result. The other three are all concrete, and any of them would support the same claim.\"},{\"q\": \"A classmate gives you feedback: “The introduction is good but the rest needs work.” Why is this hard to use?\",\"options\": [\"It names no part, and no change\",\"It is too negative to be useful on a first draft\",\"It should have opened with the criticism instead\",\"It comments on the work rather than on the writer\"],\"answer\": \"It names no part, and no change\",\"rationale\": \"Commenting on the work rather than the writer is correct practice, so that is not the fault. The problem is that “the rest needs work” gives the writer nothing they can act on.\"}]}],\"VOCAB\": {\"colleague\": {\"term\": \"colleague\",\"def\": \"A person you work with.\",\"example\": \"I sent the report to my colleagues this morning.\",\"fi\": \"työkaveri, kollega\",\"mods\": [\"basics\"]},\"client\": {\"term\": \"client\",\"def\": \"A person or company that pays for your services.\",\"example\": \"We have a video call with a client from Germany tomorrow.\",\"fi\": \"asiakas\",\"mods\": [\"basics\"]},\"small talk\": {\"term\": \"small talk\",\"def\": \"Light, friendly conversation about everyday topics.\",\"example\": \"Before the meeting started, we made small talk about the weather.\",\"fi\": \"kevyt keskustelu, small talk\",\"mods\": [\"basics\"]},\"job application\": {\"term\": \"job application\",\"def\": \"A letter or form you send when you want a job.\",\"example\": \"She wrote her job application in English.\",\"fi\": \"työhakemus\",\"mods\": [\"basics\"]},\"report\": {\"term\": \"report\",\"def\": \"A written document that gives information about a topic.\",\"example\": \"The sales report is due on Friday.\",\"fi\": \"raportti\",\"mods\": [\"basics\"]},\"minutes\": {\"term\": \"minutes\",\"def\": \"The written record of a meeting: who was there, what was decided, and who will do what.\",\"example\": \"The minutes will be sent out tomorrow.\",\"fi\": \"pöytäkirja, muistio\",\"mods\": [\"basics\",\"meetings\"]},\"conference call\": {\"term\": \"conference call\",\"def\": \"A phone or video call with several people in different places.\",\"example\": \"We have a conference call with the Berlin office at 10.\",\"fi\": \"puhelinneuvottelu, etäkokous\",\"mods\": [\"basics\"]},\"memo\": {\"term\": \"memo\",\"def\": \"A short written message sent inside a company.\",\"example\": \"HR sent a memo about the new holiday policy.\",\"fi\": \"muistio\",\"mods\": [\"basics\"]},\"correspondence\": {\"term\": \"correspondence\",\"def\": \"Letters, emails, and other written communication.\",\"example\": \"Please keep all correspondence with the client in one folder.\",\"fi\": \"kirjeenvaihto\",\"mods\": [\"basics\"]},\"formal\": {\"term\": \"formal\",\"def\": \"Serious and polite in style; used in official situations.\",\"example\": \"A job application needs formal language.\",\"fi\": \"muodollinen, virallinen\",\"mods\": [\"basics\"]},\"informal\": {\"term\": \"informal\",\"def\": \"Relaxed and friendly in style; used with friends.\",\"example\": \"Text messages to friends are usually informal.\",\"fi\": \"epämuodollinen, epävirallinen\",\"mods\": [\"basics\"]},\"polite\": {\"term\": \"polite\",\"def\": \"Showing respect and good manners.\",\"example\": \"It is polite to say 'please' when you ask for something.\",\"fi\": \"kohtelias\",\"mods\": [\"basics\"]},\"request\": {\"term\": \"to request\",\"def\": \"To politely ask for something formally.\",\"example\": \"\\\"I would like to request a reference letter for my job application.\\\"\",\"fi\": \"pyytää (virallisesti)\",\"mods\": [\"basics\",\"emails\"]},\"tone\": {\"term\": \"tone\",\"def\": \"The overall feeling or attitude in a piece of writing — can be formal, polite, friendly, or firm.\",\"example\": \"\\\"Even in a complaint email, maintain a professional and polite tone.\\\"\",\"fi\": \"sävy\",\"mods\": [\"basics\",\"emails\"]},\"register\": {\"term\": \"register\",\"def\": \"The level of formality in your language.\",\"example\": \"An email to a new client needs a more formal register than a chat message.\",\"fi\": \"rekisteri, kielimuoto\",\"mods\": [\"basics\"]},\"hedge\": {\"term\": \"hedge\",\"def\": \"To soften your words so they sound less direct.\",\"example\": \"She hedged her criticism by saying 'perhaps we could consider another option'.\",\"fi\": \"pehmentää (ilmaisua), varaus\",\"mods\": [\"basics\"]},\"diplomatic\": {\"term\": \"diplomatic\",\"def\": \"Careful not to upset people; tactful.\",\"example\": \"He gave a diplomatic answer to a difficult question.\",\"fi\": \"diplomaattinen\",\"mods\": [\"basics\"]},\"straightforward\": {\"term\": \"straightforward\",\"def\": \"Direct, clear, and honest.\",\"example\": \"Her instructions were straightforward and easy to follow.\",\"fi\": \"suora, mutkaton\",\"mods\": [\"basics\"]},\"invoice\": {\"term\": \"invoice\",\"def\": \"A document asking for payment.\",\"example\": \"Please send the invoice to our finance department.\",\"fi\": \"lasku\",\"mods\": [\"basics\"]},\"deadline\": {\"term\": \"deadline\",\"def\": \"The date or time by which something must be finished.\",\"example\": \"The deadline for the report is 10 May.\",\"fi\": \"määräaika, takaraja\",\"mods\": [\"basics\",\"meetings\"]},\"agenda\": {\"term\": \"agenda\",\"def\": \"The list of topics for a meeting, in the order they will be discussed.\",\"example\": \"The agenda has four items, so the meeting should take about an hour.\",\"fi\": \"esityslista, asialista\",\"mods\": [\"basics\",\"meetings\"]},\"stakeholder\": {\"term\": \"stakeholder\",\"def\": \"A person or group with an interest in a project.\",\"example\": \"We need to inform all stakeholders about the change.\",\"fi\": \"sidosryhmä\",\"mods\": [\"basics\"]},\"follow up\": {\"term\": \"follow up\",\"def\": \"To check later that something has been done, or to contact someone again about it.\",\"example\": \"I'll follow up with the supplier next week.\",\"fi\": \"ottaa uudelleen yhteyttä, tehdä jatkoyhteydenotto\",\"mods\": [\"basics\",\"emails\",\"meetings\",\"pitch\"]},\"quotation\": {\"term\": \"quotation\",\"def\": \"A document stating the price for a product or service.\",\"example\": \"We asked three suppliers for a quotation before deciding.\",\"fi\": \"tarjous, hintatarjous\",\"mods\": [\"basics\"]},\"procurement\": {\"term\": \"procurement\",\"def\": \"The process of buying goods and services for a company.\",\"example\": \"All large orders go through the procurement department.\",\"fi\": \"hankinta\",\"mods\": [\"basics\"]},\"turnover\": {\"term\": \"turnover\",\"def\": \"The total amount of money a company receives in a period.\",\"example\": \"The company's annual turnover grew by 12 per cent.\",\"fi\": \"liikevaihto\",\"mods\": [\"basics\"]},\"negotiate\": {\"term\": \"negotiate\",\"def\": \"To discuss something in order to reach an agreement.\",\"example\": \"We need to negotiate a better price with the supplier.\",\"fi\": \"neuvotella\",\"mods\": [\"basics\"]},\"culture\": {\"term\": \"culture\",\"def\": \"The customs and ways of behaving of a group or country.\",\"example\": \"Business culture in Japan is different from business culture in Finland.\",\"fi\": \"kulttuuri\",\"mods\": [\"basics\"]},\"i'm afraid…\": {\"term\": \"I'm afraid…\",\"def\": \"A polite phrase used before bad news or a refusal.\",\"example\": \"I'm afraid the meeting is cancelled.\",\"fi\": \"valitettavasti…\",\"mods\": [\"basics\"]},\"apologise\": {\"term\": \"apologise\",\"def\": \"To say sorry.\",\"example\": \"We apologise for the late delivery.\",\"fi\": \"pyytää anteeksi\",\"mods\": [\"basics\"]},\"appreciate\": {\"term\": \"appreciate\",\"def\": \"To be thankful for something.\",\"example\": \"I really appreciate your help with this.\",\"fi\": \"arvostaa\",\"mods\": [\"basics\"]},\"make it\": {\"term\": \"make it\",\"def\": \"To be able to attend or arrive.\",\"example\": \"Can you make it to the 3 p.m. call?\",\"fi\": \"ehtiä, päästä paikalle\",\"mods\": [\"basics\"]},\"courtesy\": {\"term\": \"courtesy\",\"def\": \"Polite behaviour that shows respect.\",\"example\": \"As a courtesy, we informed the client about the delay before they asked.\",\"fi\": \"kohteliaisuus\",\"mods\": [\"basics\"]},\"etiquette\": {\"term\": \"etiquette\",\"def\": \"The rules of polite behaviour in a situation.\",\"example\": \"Email etiquette is different in different countries.\",\"fi\": \"etiketti, käytöstavat\",\"mods\": [\"basics\"]},\"tactful\": {\"term\": \"tactful\",\"def\": \"Careful to say things in a way that does not upset people.\",\"example\": \"She found a tactful way to point out the mistake.\",\"fi\": \"hienotunteinen, tahdikas\",\"mods\": [\"basics\"]},\"reschedule\": {\"term\": \"reschedule\",\"def\": \"To change the time of a meeting or event.\",\"example\": \"Could we reschedule our call to Thursday?\",\"fi\": \"siirtää (ajankohtaa), sopia uusi aika\",\"mods\": [\"basics\"]},\"clarification\": {\"term\": \"clarification\",\"def\": \"An explanation that makes something clearer.\",\"example\": \"Could I ask for clarification on the second point?\",\"fi\": \"tarkennus, selvennys\",\"mods\": [\"basics\"]},\"summarise\": {\"term\": \"summarise\",\"def\": \"To give the main points in a short form.\",\"example\": \"Let me summarise what we decided today.\",\"fi\": \"tiivistää\",\"mods\": [\"basics\"]},\"subject line\": {\"term\": \"subject line\",\"def\": \"The title of an email that the reader sees before opening it.\",\"example\": \"\\\"Use a clear subject line such as: Application for Sales Assistant — Your Name.\\\"\",\"fi\": \"aiherivi, otsikkorivi\",\"mods\": [\"basics\",\"emails\"]},\"greeting\": {\"term\": \"greeting\",\"def\": \"The opening line of an email that addresses the reader, e.g. Dear Ms Korhonen.\",\"example\": \"\\\"Always begin a professional email with Dear followed by a name or title.\\\"\",\"fi\": \"tervehdys, aloitus\",\"mods\": [\"basics\",\"emails\"]},\"closing\": {\"term\": \"closing\",\"def\": \"The words you use to end an email.\",\"example\": \"“Best regards” is a common email closing.\",\"fi\": \"lopetus, lopputervehdys\",\"mods\": [\"basics\"]},\"paraphrase\": {\"term\": \"paraphrase\",\"def\": \"To say the same thing in different words.\",\"example\": \"If someone doesn't understand, try to paraphrase your point.\",\"fi\": \"sanoa toisin sanoin, muotoilla uudelleen\",\"mods\": [\"basics\"]},\"concise\": {\"term\": \"concise\",\"def\": \"Short and clear, with no unnecessary words.\",\"example\": \"Busy readers prefer concise emails.\",\"fi\": \"tiivis, ytimekäs\",\"mods\": [\"basics\"]},\"attachment\": {\"term\": \"attachment\",\"def\": \"A file sent together with an email.\",\"example\": \"Please find the report in the attachment.\",\"fi\": \"liite\",\"mods\": [\"basics\"]},\"proofread\": {\"term\": \"to proofread\",\"def\": \"To carefully read a text to find and correct errors before sending or submitting.\",\"example\": \"\\\"Always proofread your email before sending to avoid spelling and grammar mistakes.\\\"\",\"fi\": \"oikolukea\",\"mods\": [\"basics\",\"emails\"]},\"career\": {\"term\": \"career\",\"def\": \"Your working life and professional development over time.\",\"example\": \"Good English skills can help your career.\",\"fi\": \"ura\",\"mods\": [\"basics\"]},\"confidence\": {\"term\": \"confidence\",\"def\": \"The feeling that you can do something well.\",\"example\": \"Practice gives you confidence in meetings.\",\"fi\": \"itseluottamus, varmuus\",\"mods\": [\"basics\"]},\"job interview\": {\"term\": \"job interview\",\"def\": \"A meeting where an employer asks you questions about a job.\",\"example\": \"She prepared English answers for her job interview.\",\"fi\": \"työhaastattelu\",\"mods\": [\"basics\"]},\"international team\": {\"term\": \"international team\",\"def\": \"A work group with people from different countries.\",\"example\": \"He works in an international team with members in three countries.\",\"fi\": \"kansainvälinen tiimi\",\"mods\": [\"basics\"]},\"skill\": {\"term\": \"skill\",\"def\": \"The ability to do something well.\",\"example\": \"Presentation skills are important in many jobs.\",\"fi\": \"taito\",\"mods\": [\"basics\"]},\"asset\": {\"term\": \"asset\",\"def\": \"Something valuable that helps you or a company.\",\"example\": \"Strong English skills are a real asset in the job market.\",\"fi\": \"vahvuus, voimavara\",\"mods\": [\"basics\"]},\"proficiency\": {\"term\": \"proficiency\",\"def\": \"A high level of skill, especially in a language.\",\"example\": \"The job advert asks for proficiency in English.\",\"fi\": \"kielitaito, taitotaso\",\"mods\": [\"basics\"]},\"networking\": {\"term\": \"networking\",\"def\": \"Building professional contacts and relationships.\",\"example\": \"Conferences are good opportunities for networking.\",\"fi\": \"verkostoituminen\",\"mods\": [\"basics\"]},\"lingua franca\": {\"term\": \"lingua franca\",\"def\": \"A shared language used by people with different first languages.\",\"example\": \"English is the lingua franca of international business.\",\"fi\": \"yhteinen kieli, lingua franca\",\"mods\": [\"basics\"]},\"enquire about\": {\"term\": \"to enquire about\",\"def\": \"To ask formally for information about something.\",\"example\": \"\\\"I am writing to enquire about the internship positions available at your company.\\\"\",\"fi\": \"tiedustella (jotakin)\",\"mods\": [\"emails\"]},\"request information\": {\"term\": \"to request information\",\"def\": \"\",\"example\": \"\",\"fi\": \"\",\"mods\": [\"emails\"]},\"clarify\": {\"term\": \"to clarify\",\"def\": \"To explain something more clearly to remove confusion.\",\"example\": \"\\\"I am writing to clarify the requirements for the assignment.\\\"\",\"fi\": \"tarkentaa, selventää\",\"mods\": [\"emails\",\"meetings\",\"situations\"]},\"confirm\": {\"term\": \"confirm\",\"def\": \"To say that something is definitely true or that you will definitely come.\",\"example\": \"Could you confirm that you can attend on Thursday?\",\"fi\": \"vahvistaa\",\"mods\": [\"emails\",\"meetings\"]},\"availability\": {\"term\": \"availability\",\"def\": \"\",\"example\": \"\",\"fi\": \"\",\"mods\": [\"emails\"]},\"at your earliest convenience\": {\"term\": \"at your earliest convenience\",\"def\": \"A polite phrase meaning as soon as you are able to.\",\"example\": \"\\\"Could you please reply at your earliest convenience?\\\"\",\"fi\": \"mahdollisimman pian\",\"mods\": [\"emails\"]},\"apply for\": {\"term\": \"to apply for\",\"def\": \"To make a formal request for a job, course, or opportunity.\",\"example\": \"\\\"I would like to apply for the Sales Assistant position advertised on your website.\\\"\",\"fi\": \"hakea (työpaikkaa, opiskelupaikkaa)\",\"mods\": [\"emails\"]},\"position\": {\"term\": \"position\",\"def\": \"A job or role in a company.\",\"example\": \"\\\"I am writing to apply for the position of Customer Service Assistant.\\\"\",\"fi\": \"tehtävä, toimi\",\"mods\": [\"emails\"]},\"vacancy\": {\"term\": \"vacancy\",\"def\": \"An available job that a company wants to fill.\",\"example\": \"\\\"I saw your vacancy for a Marketing Trainee on your website.\\\"\",\"fi\": \"avoin työpaikka\",\"mods\": [\"emails\"]},\"relevant experience\": {\"term\": \"relevant experience\",\"def\": \"Past experience that is directly useful for the job or task in question.\",\"example\": \"\\\"I have relevant experience from my part-time job in customer service.\\\"\",\"fi\": \"tehtävään liittyvä kokemus\",\"mods\": [\"emails\"]},\"enclose\": {\"term\": \"to enclose\",\"def\": \"\",\"example\": \"\",\"fi\": \"\",\"mods\": [\"emails\"]},\"i look forward to hearing from you\": {\"term\": \"I look forward to hearing from you\",\"def\": \"A standard closing phrase that expresses expectation of a reply.\",\"example\": \"\\\"I look forward to hearing from you is a common and professional way to end an email.\\\"\",\"fi\": \"Odotan vastaustanne\",\"mods\": [\"emails\"]},\"at your convenience\": {\"term\": \"at your convenience\",\"def\": \"A polite phrase meaning when it is easy or suitable for you.\",\"example\": \"\\\"I am available for an interview at your convenience.\\\"\",\"fi\": \"teille sopivana ajankohtana\",\"mods\": [\"emails\"]},\"reiterate interest\": {\"term\": \"to reiterate interest\",\"def\": \"\",\"example\": \"\",\"fi\": \"\",\"mods\": [\"emails\"]},\"i wanted to check\": {\"term\": \"I wanted to check\",\"def\": \"\",\"example\": \"\",\"fi\": \"\",\"mods\": [\"emails\"]},\"as discussed\": {\"term\": \"as discussed\",\"def\": \"\",\"example\": \"\",\"fi\": \"\",\"mods\": [\"emails\"]},\"further to our conversation\": {\"term\": \"further to our conversation\",\"def\": \"\",\"example\": \"\",\"fi\": \"\",\"mods\": [\"emails\"]},\"i am writing to express my concern about\": {\"term\": \"I am writing to express my concern about\",\"def\": \"\",\"example\": \"\",\"fi\": \"\",\"mods\": [\"emails\"]},\"i would like to bring to your attention\": {\"term\": \"I would like to bring to your attention\",\"def\": \"\",\"example\": \"\",\"fi\": \"\",\"mods\": [\"emails\"]},\"resolve\": {\"term\": \"resolve\",\"def\": \"To settle a question or a problem, so that it is finished.\",\"example\": \"Three items were resolved, and two need more work.\",\"fi\": \"ratkaista, saada valmiiksi\",\"mods\": [\"emails\",\"meetings\"]},\"compensation\": {\"term\": \"compensation\",\"def\": \"\",\"example\": \"\",\"fi\": \"\",\"mods\": [\"emails\"]},\"i would appreciate\": {\"term\": \"I would appreciate\",\"def\": \"\",\"example\": \"\",\"fi\": \"\",\"mods\": [\"emails\"]},\"at the earliest opportunity\": {\"term\": \"at the earliest opportunity\",\"def\": \"\",\"example\": \"\",\"fi\": \"\",\"mods\": [\"emails\"]},\"express gratitude\": {\"term\": \"to express gratitude\",\"def\": \"\",\"example\": \"\",\"fi\": \"\",\"mods\": [\"emails\"]},\"i appreciate\": {\"term\": \"I appreciate\",\"def\": \"\",\"example\": \"\",\"fi\": \"\",\"mods\": [\"emails\"]},\"i am grateful for\": {\"term\": \"I am grateful for\",\"def\": \"\",\"example\": \"\",\"fi\": \"\",\"mods\": [\"emails\"]},\"valuable\": {\"term\": \"valuable\",\"def\": \"\",\"example\": \"\",\"fi\": \"\",\"mods\": [\"emails\"]},\"it was a pleasure\": {\"term\": \"it was a pleasure\",\"def\": \"\",\"example\": \"\",\"fi\": \"\",\"mods\": [\"emails\"]},\"i look forward to\": {\"term\": \"I look forward to\",\"def\": \"\",\"example\": \"\",\"fi\": \"\",\"mods\": [\"emails\"]},\"i would be grateful if\": {\"term\": \"I would be grateful if\",\"def\": \"A polite, formal way of making a request.\",\"example\": \"\\\"I would be grateful if you could send me the relevant documents by Friday.\\\"\",\"fi\": \"Olisin kiitollinen, jos\",\"mods\": [\"emails\"]},\"could you please\": {\"term\": \"could you please\",\"def\": \"\",\"example\": \"\",\"fi\": \"\",\"mods\": [\"emails\"]},\"by [date]\": {\"term\": \"by [date]\",\"def\": \"\",\"example\": \"\",\"fi\": \"\",\"mods\": [\"emails\"]},\"arrange\": {\"term\": \"to arrange\",\"def\": \"\",\"example\": \"\",\"fi\": \"\",\"mods\": [\"emails\"]},\"re:\": {\"term\": \"Re:\",\"def\": \"\",\"example\": \"\",\"fi\": \"\",\"mods\": [\"emails\"]},\"application for\": {\"term\": \"Application for\",\"def\": \"\",\"example\": \"\",\"fi\": \"\",\"mods\": [\"emails\"]},\"enquiry about\": {\"term\": \"Enquiry about\",\"def\": \"\",\"example\": \"\",\"fi\": \"\",\"mods\": [\"emails\"]},\"follow-up\": {\"term\": \"Follow-up\",\"def\": \"\",\"example\": \"\",\"fi\": \"\",\"mods\": [\"emails\"]},\"request for\": {\"term\": \"Request for\",\"def\": \"\",\"example\": \"\",\"fi\": \"\",\"mods\": [\"emails\"]},\"regarding\": {\"term\": \"Regarding\",\"def\": \"\",\"example\": \"\",\"fi\": \"\",\"mods\": [\"emails\"]},\"dear\": {\"term\": \"Dear\",\"def\": \"\",\"example\": \"\",\"fi\": \"\",\"mods\": [\"emails\"]},\"mr\": {\"term\": \"Mr\",\"def\": \"\",\"example\": \"\",\"fi\": \"\",\"mods\": [\"emails\"]},\"ms\": {\"term\": \"Ms\",\"def\": \"\",\"example\": \"\",\"fi\": \"\",\"mods\": [\"emails\"]},\"mx\": {\"term\": \"Mx\",\"def\": \"\",\"example\": \"\",\"fi\": \"\",\"mods\": [\"emails\"]},\"dr\": {\"term\": \"Dr\",\"def\": \"\",\"example\": \"\",\"fi\": \"\",\"mods\": [\"emails\"]},\"hiring manager\": {\"term\": \"Hiring Manager\",\"def\": \"\",\"example\": \"\",\"fi\": \"\",\"mods\": [\"emails\"]},\"hiring team\": {\"term\": \"Hiring Team\",\"def\": \"\",\"example\": \"\",\"fi\": \"\",\"mods\": [\"emails\"]},\"whom it may concern (avoid this)\": {\"term\": \"To Whom It May Concern (avoid this)\",\"def\": \"\",\"example\": \"\",\"fi\": \"\",\"mods\": [\"emails\"]},\"i am writing to\": {\"term\": \"I am writing to\",\"def\": \"The standard phrase used to begin a professional email and state its purpose.\",\"example\": \"\\\"I am writing to enquire about the internship programme at your company.\\\"\",\"fi\": \"Otan yhteyttä koskien\",\"mods\": [\"emails\"]},\"i would like to\": {\"term\": \"I would like to\",\"def\": \"A polite way to express a wish or intention in formal writing.\",\"example\": \"\\\"I would like to apply for the position advertised on your website.\\\"\",\"fi\": \"Haluaisin\",\"mods\": [\"emails\"]},\"i am contacting you regarding\": {\"term\": \"I am contacting you regarding\",\"def\": \"\",\"example\": \"\",\"fi\": \"\",\"mods\": [\"emails\"]},\"further to\": {\"term\": \"further to\",\"def\": \"A formal phrase that refers back to a previous email, meeting, or conversation.\",\"example\": \"\\\"Further to our telephone conversation on Monday, I am writing to confirm the details.\\\"\",\"fi\": \"viitaten (johonkin aiempaan)\",\"mods\": [\"emails\"]},\"i am writing in response to\": {\"term\": \"I am writing in response to\",\"def\": \"\",\"example\": \"\",\"fi\": \"\",\"mods\": [\"emails\"]},\"kind regards\": {\"term\": \"Kind regards\",\"def\": \"A semi-formal closing phrase, suitable for professional but less strictly formal emails.\",\"example\": \"\\\"Kind regards is appropriate when you already have a working relationship with the reader.\\\"\",\"fi\": \"Ystävällisin terveisin\",\"mods\": [\"emails\"]},\"best regards\": {\"term\": \"Best regards\",\"def\": \"\",\"example\": \"\",\"fi\": \"\",\"mods\": [\"emails\"]},\"yours sincerely\": {\"term\": \"Yours sincerely\",\"def\": \"A very formal closing phrase, traditionally used in letters when you know the person's name. Still correct but old-fashioned in modern business email — Kind regards is more common.\",\"example\": \"\\\"Yours sincerely\\\" is correct in formal letters but most professionals now use \\\"Kind regards\\\" in email.\",\"fi\": \"Ystävällisin terveisin (kun tiedät vastaanottajan nimen)\",\"mods\": [\"emails\"]},\"yours faithfully\": {\"term\": \"Yours faithfully\",\"def\": \"A very formal closing phrase, traditionally used in letters when you do not know the person's name. Rarely used in modern business email — Kind regards or Best regards is preferred.\",\"example\": \"\\\"Yours faithfully\\\" is old-fashioned in email. Use \\\"Kind regards\\\" or \\\"Best regards\\\" instead.\",\"fi\": \"Ystävällisin terveisin (kun et tiedä vastaanottajan nimeä)\",\"mods\": [\"emails\"]},\"please do not hesitate to contact me\": {\"term\": \"Please do not hesitate to contact me\",\"def\": \"A polite phrase inviting the reader to ask questions or get in touch.\",\"example\": \"\\\"Please do not hesitate to contact me if you require any further information.\\\"\",\"fi\": \"Otattehan rohkeasti yhteyttä\",\"mods\": [\"emails\"]},\"attach\": {\"term\": \"to attach\",\"def\": \"To add a file or document to an email.\",\"example\": \"\\\"Please find my CV attached to this email.\\\"\",\"fi\": \"liittää (liitteeksi)\",\"mods\": [\"emails\",\"meetings\"]},\"express interest\": {\"term\": \"to express interest\",\"def\": \"To show clearly that you want something or care about it.\",\"example\": \"\\\"I would like to express my interest in the trainee position at your company.\\\"\",\"fi\": \"ilmaista kiinnostuksensa\",\"mods\": [\"emails\"]},\"reiterate\": {\"term\": \"to reiterate\",\"def\": \"To say something again to make sure it is noticed or remembered.\",\"example\": \"\\\"I would like to reiterate my strong interest in this role.\\\"\",\"fi\": \"toistaa, kerrata\",\"mods\": [\"emails\"]},\"formal register\": {\"term\": \"formal register\",\"def\": \"A style of language that is professional, polite, and correct — used in business communication.\",\"example\": \"\\\"A formal register means using full words, no contractions, and professional vocabulary.\\\"\",\"fi\": \"muodollinen kielimuoto\",\"mods\": [\"emails\"]},\"contraction\": {\"term\": \"contraction\",\"def\": \"A shortened word form that combines two words with an apostrophe, e.g. I'm, can't.\",\"example\": \"\\\"Contractions like I'm and don't are not suitable for formal emails. Write I am and do not instead.\\\"\",\"fi\": \"lyhentymä (esim. I'm, don't)\",\"mods\": [\"emails\"]},\"sign-off\": {\"term\": \"sign-off\",\"def\": \"The closing phrase before your name. In modern professional email, Kind regards, Best regards, and Best wishes are all standard.\",\"example\": \"\\\"Kind regards\\\", \\\"Best regards\\\", and \\\"Best wishes\\\" are the most common sign-offs in business email today.\",\"fi\": \"lopputervehdys\",\"mods\": [\"emails\"]},\"cover letter\": {\"term\": \"cover letter\",\"def\": \"A letter or email that accompanies a job application and introduces the candidate.\",\"example\": \"\\\"A cover letter email should be 100–150 words and include your skills with examples.\\\"\",\"fi\": \"hakemuskirje, saatekirje\",\"mods\": [\"emails\"]},\"express concern\": {\"term\": \"to express concern\",\"def\": \"To communicate politely that something is a problem or has not met expectations.\",\"example\": \"\\\"I am writing to express my concern about the quality of the product I received.\\\"\",\"fi\": \"ilmaista huolensa\",\"mods\": [\"emails\"]},\"as per\": {\"term\": \"as per\",\"def\": \"A formal phrase meaning according to or as stated in.\",\"example\": \"\\\"As per your request, I have attached the completed form.\\\"\",\"fi\": \"mukaisesti\",\"mods\": [\"emails\"]},\"i remain\": {\"term\": \"I remain\",\"def\": \"A formal phrase used before a sign-off to maintain a professional tone.\",\"example\": \"\\\"I remain available for any further questions you may have.\\\"\",\"fi\": \"Jään odottamaan (hyvin muodollinen lopetus)\",\"mods\": [\"emails\"]},\"status update\": {\"term\": \"status update\",\"def\": \"A short report on how a project or a task is going.\",\"example\": \"Please give a two-minute status update on your part of the project.\",\"fi\": \"tilannekatsaus\",\"mods\": [\"meetings\"]},\"catch-up\": {\"term\": \"catch-up\",\"def\": \"A short, informal meeting to share news and see how things are going.\",\"example\": \"Let's have a quick catch-up on Friday before the client calls.\",\"fi\": \"lyhyt epämuodollinen palaveri\",\"mods\": [\"meetings\"]},\"share information\": {\"term\": \"share information\",\"def\": \"To tell other people something they need to know.\",\"example\": \"The purpose of this meeting is to share information about the new system.\",\"fi\": \"jakaa tietoa\",\"mods\": [\"meetings\"]},\"brainstorm\": {\"term\": \"brainstorm\",\"def\": \"To collect many ideas quickly from a group, without judging them at first.\",\"example\": \"Let's brainstorm for ten minutes and write every idea on the board.\",\"fi\": \"ideoida, aivoriihi\",\"mods\": [\"meetings\"]},\"debrief\": {\"term\": \"debrief\",\"def\": \"A meeting held after an event or a project to review what happened and what to learn from it.\",\"example\": \"We had a short debrief after the trade fair to see what worked.\",\"fi\": \"jälkipuinti, purkukeskustelu\",\"mods\": [\"meetings\"]},\"overcome\": {\"term\": \"overcome\",\"def\": \"To solve a problem or deal with a difficulty successfully.\",\"example\": \"The team found a way to overcome the delivery problem.\",\"fi\": \"ratkaista, selviytyä (ongelmasta)\",\"mods\": [\"meetings\"]},\"team building\": {\"term\": \"team building\",\"def\": \"Activities that help people in a team know and trust each other.\",\"example\": \"The team-building day was fun, and it made the group work better together.\",\"fi\": \"ryhmäytyminen\",\"mods\": [\"meetings\"]},\"host\": {\"term\": \"host\",\"def\": \"The person who organises and leads a meeting or an event.\",\"example\": \"The host will send the video link an hour before the meeting.\",\"fi\": \"isäntä, järjestäjä\",\"mods\": [\"meetings\"]},\"recurring\": {\"term\": \"recurring\",\"def\": \"Happening again and again at regular times.\",\"example\": \"The Monday meeting is a recurring event in everyone's calendar.\",\"fi\": \"toistuva\",\"mods\": [\"meetings\"]},\"accountable\": {\"term\": \"accountable\",\"def\": \"Responsible for something, and expected to explain it to others.\",\"example\": \"Sara is accountable for the budget, so she reports on it every month.\",\"fi\": \"vastuussa, tilivelvollinen\",\"mods\": [\"meetings\"]},\"facilitator\": {\"term\": \"facilitator\",\"def\": \"A person who helps a discussion work well, so that the group reaches a result.\",\"example\": \"As facilitator, Elina made sure everyone had a chance to speak.\",\"fi\": \"fasilitaattori, keskustelun ohjaaja\",\"mods\": [\"meetings\"]},\"timekeeper\": {\"term\": \"timekeeper\",\"def\": \"The person who watches the time and tells the group when an item is running over.\",\"example\": \"Jonas is the timekeeper, so he will warn us at five minutes.\",\"fi\": \"ajanottaja\",\"mods\": [\"meetings\"]},\"participant\": {\"term\": \"participant\",\"def\": \"A person who takes part in a meeting or an activity.\",\"example\": \"All participants should read the report before Tuesday.\",\"fi\": \"osallistuja\",\"mods\": [\"meetings\"]},\"delegate\": {\"term\": \"delegate\",\"def\": \"To give a task or a role to another person. As a noun, a person sent to represent a group.\",\"example\": \"The chair delegated the note taking to Mika.\",\"fi\": \"delegoida, siirtää tehtävä\",\"mods\": [\"meetings\"]},\"impartial\": {\"term\": \"impartial\",\"def\": \"Not supporting one side; fair to everyone.\",\"example\": \"A good facilitator stays impartial and does not argue for one option.\",\"fi\": \"puolueeton\",\"mods\": [\"meetings\"]},\"contribute\": {\"term\": \"contribute\",\"def\": \"To give something useful to a discussion, such as an idea or information.\",\"example\": \"Everyone is expected to contribute at least one idea.\",\"fi\": \"osallistua keskusteluun, tuoda oma panos\",\"mods\": [\"meetings\"]},\"keep track of\": {\"term\": \"keep track of\",\"def\": \"To follow something carefully so that you always know its current state.\",\"example\": \"The minute taker keeps track of every decision.\",\"fi\": \"pitää kirjaa, seurata\",\"mods\": [\"meetings\"]},\"stand in for\": {\"term\": \"stand in for\",\"def\": \"To do someone's job for a short time while they are away.\",\"example\": \"Sara will stand in for the chair next week.\",\"fi\": \"tuurata, toimia sijaisena\",\"mods\": [\"meetings\"]},\"item\": {\"term\": \"item\",\"def\": \"One topic on the agenda.\",\"example\": \"Item three is the new website.\",\"fi\": \"asiakohta, käsiteltävä asia\",\"mods\": [\"meetings\"]},\"invitation\": {\"term\": \"invitation\",\"def\": \"A message that asks someone to come to a meeting.\",\"example\": \"I got the invitation for Tuesday, but I have not replied yet.\",\"fi\": \"kutsu\",\"mods\": [\"meetings\"]},\"attend\": {\"term\": \"attend\",\"def\": \"To go to a meeting or an event.\",\"example\": \"Six people will attend the meeting, and two will join online.\",\"fi\": \"osallistua\",\"mods\": [\"meetings\"]},\"decline\": {\"term\": \"decline\",\"def\": \"To say politely that you will not come.\",\"example\": \"I have to decline the invitation because I am travelling that day.\",\"fi\": \"kieltäytyä\",\"mods\": [\"meetings\"]},\"in advance\": {\"term\": \"in advance\",\"def\": \"Before something happens; earlier.\",\"example\": \"Please read the report in advance, so we can go straight to the discussion.\",\"fi\": \"etukäteen\",\"mods\": [\"meetings\"]},\"brief\": {\"term\": \"brief\",\"def\": \"To give someone the information they need before a meeting or a task.\",\"example\": \"Can you brief me on the project before the meeting?\",\"fi\": \"ohjeistaa, perehdyttää\",\"mods\": [\"meetings\"]},\"allocate\": {\"term\": \"allocate\",\"def\": \"To give a share of time, money or work to something.\",\"example\": \"We have allocated fifteen minutes to each item.\",\"fi\": \"varata, jakaa (aikaa)\",\"mods\": [\"meetings\"]},\"template\": {\"term\": \"template\",\"def\": \"A ready-made form or document that you fill in.\",\"example\": \"Use the company template for the agenda.\",\"fi\": \"pohja, malli\",\"mods\": [\"meetings\"]},\"chair\": {\"term\": \"chair\",\"def\": \"The person who leads a meeting. Also a verb: to lead a meeting.\",\"example\": \"Anna will chair today's meeting.\",\"fi\": \"puheenjohtaja; toimia puheenjohtajana\",\"mods\": [\"meetings\"]},\"purpose\": {\"term\": \"purpose\",\"def\": \"The reason for doing something; what you want to achieve.\",\"example\": \"The purpose of this meeting is to choose a supplier.\",\"fi\": \"tarkoitus\",\"mods\": [\"meetings\"]},\"objective\": {\"term\": \"objective\",\"def\": \"A clear goal that you want to reach.\",\"example\": \"Our objective today is to agree the budget.\",\"fi\": \"tavoite\",\"mods\": [\"meetings\"]},\"minutes-taker\": {\"term\": \"minutes-taker\",\"def\": \"The person who writes down what happens in the meeting.\",\"example\": \"Mika is the minutes-taker today, so please speak clearly.\",\"fi\": \"sihteeri, pöytäkirjanpitäjä\",\"mods\": [\"meetings\"]},\"apologies\": {\"term\": \"apologies\",\"def\": \"In a meeting, the names of people who cannot come and have said so.\",\"example\": \"We have apologies from Sara, who is on a business trip.\",\"fi\": \"estyneet, poissaoloilmoitukset\",\"mods\": [\"meetings\"]},\"ground rules\": {\"term\": \"ground rules\",\"def\": \"Simple rules for how the meeting will work.\",\"example\": \"A few ground rules: one speaker at a time, and let's finish by four.\",\"fi\": \"pelisäännöt\",\"mods\": [\"meetings\"]},\"go through\": {\"term\": \"go through\",\"def\": \"To look at or discuss something from beginning to end.\",\"example\": \"Let's go through the agenda quickly before we start.\",\"fi\": \"käydä läpi\",\"mods\": [\"meetings\"]},\"kick off\": {\"term\": \"kick off\",\"def\": \"To start something. Informal but common at work.\",\"example\": \"Let's kick off with the first item.\",\"fi\": \"aloittaa\",\"mods\": [\"meetings\"]},\"on time\": {\"term\": \"on time\",\"def\": \"At the correct time; not late.\",\"example\": \"Thank you all for being on time.\",\"fi\": \"ajoissa\",\"mods\": [\"meetings\"]},\"point of view\": {\"term\": \"point of view\",\"def\": \"The way you see or think about something; your opinion.\",\"example\": \"From my point of view, the price is too high.\",\"fi\": \"näkökulma\",\"mods\": [\"meetings\"]},\"raise a point\": {\"term\": \"raise a point\",\"def\": \"To bring up a topic or an idea in a meeting.\",\"example\": \"I would like to raise a point about the deadline.\",\"fi\": \"ottaa asia esille\",\"mods\": [\"meetings\"]},\"interrupt\": {\"term\": \"interrupt\",\"def\": \"To start speaking while someone else is still speaking.\",\"example\": \"Sorry to interrupt, but we only have five minutes left.\",\"fi\": \"keskeyttää\",\"mods\": [\"meetings\"]},\"back up\": {\"term\": \"back up\",\"def\": \"To support an idea with facts or reasons.\",\"example\": \"Can you back that up with some numbers?\",\"fi\": \"tukea, perustella\",\"mods\": [\"meetings\"]},\"object to\": {\"term\": \"object to\",\"def\": \"To say that you are against something.\",\"example\": \"I object to the new schedule because it gives us no time to test.\",\"fi\": \"vastustaa\",\"mods\": [\"meetings\"]},\"suggestion\": {\"term\": \"suggestion\",\"def\": \"An idea that you offer for others to consider.\",\"example\": \"My suggestion is to start with a smaller test.\",\"fi\": \"ehdotus\",\"mods\": [\"meetings\"]},\"go along with\": {\"term\": \"go along with\",\"def\": \"To accept a plan or an idea, even if it is not your first choice.\",\"example\": \"I'm happy to go along with Jonas's plan.\",\"fi\": \"hyväksyä, mennä mukaan (johonkin)\",\"mods\": [\"meetings\"]},\"hesitate\": {\"term\": \"hesitate\",\"def\": \"To pause before doing or saying something, because you are not sure.\",\"example\": \"Please don't hesitate to ask if something is unclear.\",\"fi\": \"epäröidä\",\"mods\": [\"meetings\"]},\"keep to\": {\"term\": \"keep to\",\"def\": \"To stay with a plan, a topic or a time limit.\",\"example\": \"Let's keep to the agenda, please.\",\"fi\": \"pysyä (esityslistassa, aikataulussa)\",\"mods\": [\"meetings\"]},\"on track\": {\"term\": \"on track\",\"def\": \"Going as planned; not late and not off the topic.\",\"example\": \"We are on track to finish by three.\",\"fi\": \"aikataulussa, aiheessa\",\"mods\": [\"meetings\"]},\"move on\": {\"term\": \"move on\",\"def\": \"To go to the next topic.\",\"example\": \"OK, shall we move on to item three?\",\"fi\": \"siirtyä eteenpäin\",\"mods\": [\"meetings\"]},\"wrap up\": {\"term\": \"wrap up\",\"def\": \"To finish a discussion or a meeting.\",\"example\": \"Let's wrap up this item in the next two minutes.\",\"fi\": \"lopettaa, päättää\",\"mods\": [\"meetings\"]},\"park\": {\"term\": \"park\",\"def\": \"To stop discussing something now, and return to it later.\",\"example\": \"Good question. Let's park it and come back to it at the end.\",\"fi\": \"siirtää myöhemmäksi, jättää odottamaan\",\"mods\": [\"meetings\"]},\"sum up\": {\"term\": \"sum up\",\"def\": \"To give a short summary of the main points.\",\"example\": \"To sum up, we all agree on the date, but not on the budget.\",\"fi\": \"tehdä yhteenveto\",\"mods\": [\"meetings\"]},\"run over\": {\"term\": \"run over\",\"def\": \"To take more time than planned.\",\"example\": \"We are running over, so let's be quick with the last item.\",\"fi\": \"ylittää aika\",\"mods\": [\"meetings\"]},\"digress\": {\"term\": \"digress\",\"def\": \"To start talking about something that is not the topic.\",\"example\": \"Sorry, I'm digressing. Back to the schedule.\",\"fi\": \"poiketa aiheesta\",\"mods\": [\"meetings\"]},\"hand over to\": {\"term\": \"hand over to\",\"def\": \"To give the next turn to speak to another person.\",\"example\": \"I'll hand over to Sara, who has the sales figures.\",\"fi\": \"antaa puheenvuoro (jollekin)\",\"mods\": [\"meetings\"]},\"proposal\": {\"term\": \"proposal\",\"def\": \"A formal suggestion for a decision.\",\"example\": \"The proposal is to move the launch to May.\",\"fi\": \"ehdotus\",\"mods\": [\"meetings\"]},\"propose\": {\"term\": \"propose\",\"def\": \"To suggest a plan or a decision to a group.\",\"example\": \"I propose that we test the product with ten customers first.\",\"fi\": \"ehdottaa\",\"mods\": [\"meetings\"]},\"in favour\": {\"term\": \"in favour\",\"def\": \"Supporting an idea or a proposal.\",\"example\": \"All those in favour, please raise your hand.\",\"fi\": \"puolesta\",\"mods\": [\"meetings\"]},\"abstain\": {\"term\": \"abstain\",\"def\": \"To choose not to vote for or against something.\",\"example\": \"Two people voted in favour, one voted against, and one abstained.\",\"fi\": \"äänestää tyhjää\",\"mods\": [\"meetings\"]},\"consensus\": {\"term\": \"consensus\",\"def\": \"Agreement by everyone in the group.\",\"example\": \"We reached a consensus after a short discussion.\",\"fi\": \"yksimielisyys, konsensus\",\"mods\": [\"meetings\"]},\"action point\": {\"term\": \"action point\",\"def\": \"A task that someone must do after the meeting.\",\"example\": \"Action point: Sara contacts the printer by Friday.\",\"fi\": \"toimenpide, tehtävä\",\"mods\": [\"meetings\"]},\"assign\": {\"term\": \"assign\",\"def\": \"To give a task to a particular person.\",\"example\": \"Let's assign the website update to Jonas.\",\"fi\": \"antaa tehtäväksi, nimetä vastuuhenkilö\",\"mods\": [\"meetings\"]},\"postpone\": {\"term\": \"postpone\",\"def\": \"To move something to a later time.\",\"example\": \"Shall we postpone the decision until we have the figures?\",\"fi\": \"lykätä, siirtää\",\"mods\": [\"meetings\"]},\"any other business (aob)\": {\"term\": \"any other business (AOB)\",\"def\": \"The last agenda item, where people can raise small topics that are not on the agenda.\",\"example\": \"Before we close: any other business?\",\"fi\": \"muut asiat\",\"mods\": [\"meetings\"]},\"close\": {\"term\": \"close\",\"def\": \"To end a meeting formally.\",\"example\": \"If there is nothing else, I'll close the meeting here.\",\"fi\": \"päättää (kokous)\",\"mods\": [\"meetings\"]},\"adjourn\": {\"term\": \"adjourn\",\"def\": \"To stop a meeting and continue it later. A formal word.\",\"example\": \"We will adjourn now and continue at two o'clock.\",\"fi\": \"keskeyttää kokous, siirtää myöhempään ajankohtaan\",\"mods\": [\"meetings\"]},\"next steps\": {\"term\": \"next steps\",\"def\": \"The things that will happen after the meeting.\",\"example\": \"The next steps are clear: Sara calls the printer, and Jonas updates the site.\",\"fi\": \"seuraavat askeleet, jatkotoimet\",\"mods\": [\"meetings\"]},\"circulate\": {\"term\": \"circulate\",\"def\": \"To send a document to everyone in a group.\",\"example\": \"Mika will circulate the minutes by Friday.\",\"fi\": \"jakaa, lähettää kaikille\",\"mods\": [\"meetings\"]},\"recap\": {\"term\": \"recap\",\"def\": \"A short repeat of the main points.\",\"example\": \"Quick recap: three decisions, four action points.\",\"fi\": \"kertaus, lyhyt yhteenveto\",\"mods\": [\"meetings\"]},\"attendee\": {\"term\": \"attendee\",\"def\": \"A person who is at a meeting.\",\"example\": \"The minutes list all the attendees.\",\"fi\": \"osallistuja\",\"mods\": [\"meetings\"]},\"attendance sheet\": {\"term\": \"attendance sheet\",\"def\": \"A paper or form that people sign to show they were at a meeting.\",\"example\": \"Please sign the attendance sheet before you leave.\",\"fi\": \"osallistujalista, läsnäololista\",\"mods\": [\"meetings\"]},\"chart\": {\"term\": \"chart\",\"def\": \"A picture that shows numbers, so a pattern is easy to see.\",\"example\": \"The chart shows sales for each month of last year.\",\"fi\": \"kaavio, diagrammi\",\"mods\": [\"charts\"]},\"diagram\": {\"term\": \"diagram\",\"def\": \"A simple drawing that explains how something works or is organised.\",\"example\": \"The diagram shows how an order moves through the company.\",\"fi\": \"kaavio, kuvio\",\"mods\": [\"charts\"]},\"data\": {\"term\": \"data\",\"def\": \"Information collected about customers, markets, or operations that helps a business make decisions.\",\"example\": \"Their customer data helps them personalise recommendations.\",\"fi\": \"data, aineisto\",\"mods\": [\"charts\",\"canvas\"]},\"figure\": {\"term\": \"figure\",\"def\": \"A number in a set of results. Also the word for a numbered chart in a report.\",\"example\": \"The figures for the last quarter are in the appendix.\",\"fi\": \"luku; kuvio (raportissa)\",\"mods\": [\"charts\"]},\"at a glance\": {\"term\": \"at a glance\",\"def\": \"Immediately, with one quick look.\",\"example\": \"A good chart lets the reader see the pattern at a glance.\",\"fi\": \"yhdellä silmäyksellä\",\"mods\": [\"charts\"]},\"axis\": {\"term\": \"axis\",\"def\": \"One of the two lines at the side and bottom of a chart. The plural is axes.\",\"example\": \"The vertical axis shows revenue in thousands of euros.\",\"fi\": \"akseli (mon. akselit)\",\"mods\": [\"charts\"]},\"label\": {\"term\": \"label\",\"def\": \"A short piece of text that names a part of a chart.\",\"example\": \"Every bar needs a label, or the reader has to guess.\",\"fi\": \"merkintä, nimiö\",\"mods\": [\"charts\"]},\"source\": {\"term\": \"source\",\"def\": \"Where the information came from.\",\"example\": \"Always give the source under the chart.\",\"fi\": \"lähde\",\"mods\": [\"charts\"]},\"bar chart\": {\"term\": \"bar chart\",\"def\": \"A chart that compares categories using rectangular bars.\",\"example\": \"The bar chart compares sales in five countries.\",\"fi\": \"pylväsdiagrammi\",\"mods\": [\"charts\"]},\"category\": {\"term\": \"category\",\"def\": \"One of the separate groups being compared.\",\"example\": \"Each bar represents one product category.\",\"fi\": \"kategoria, luokka\",\"mods\": [\"charts\"]},\"vertical\": {\"term\": \"vertical\",\"def\": \"Going up and down.\",\"example\": \"The vertical bars make the tallest one easy to spot.\",\"fi\": \"pystysuora\",\"mods\": [\"charts\"]},\"horizontal\": {\"term\": \"horizontal\",\"def\": \"Going from side to side.\",\"example\": \"Horizontal bars work better when the labels are long.\",\"fi\": \"vaakasuora\",\"mods\": [\"charts\"]},\"compare\": {\"term\": \"to compare\",\"def\": \"To look at two or more things to see how they differ.\",\"example\": \"The chart compares last year's figures with this year's.\",\"fi\": \"verrata\",\"mods\": [\"charts\"]},\"the highest / the lowest\": {\"term\": \"the highest / the lowest\",\"def\": \"The largest and smallest values in the set.\",\"example\": \"Germany had the highest sales; Portugal had the lowest.\",\"fi\": \"korkein / matalin\",\"mods\": [\"charts\"]},\"line graph\": {\"term\": \"line graph\",\"def\": \"A chart that shows change over time, using points joined by a line.\",\"example\": \"The line graph shows visitor numbers month by month.\",\"fi\": \"viivadiagrammi\",\"mods\": [\"charts\"]},\"trend\": {\"term\": \"trend\",\"def\": \"The general direction in which something is changing.\",\"example\": \"The overall trend is upward, despite a dip in July.\",\"fi\": \"kehityssuunta, trendi\",\"mods\": [\"charts\"]},\"plot\": {\"term\": \"to plot\",\"def\": \"To mark data points on a graph.\",\"example\": \"We plotted the results for each week.\",\"fi\": \"merkitä (pisteet kuvaajaan)\",\"mods\": [\"charts\"]},\"over time\": {\"term\": \"over time\",\"def\": \"During a period, showing change from one point to another.\",\"example\": \"The graph shows how prices changed over time.\",\"fi\": \"ajan myötä, ajan kuluessa\",\"mods\": [\"charts\"]},\"fluctuate\": {\"term\": \"to fluctuate\",\"def\": \"To go up and down irregularly.\",\"example\": \"Sales fluctuated during the summer months.\",\"fi\": \"vaihdella\",\"mods\": [\"charts\"]},\"period\": {\"term\": \"period\",\"def\": \"A length of time.\",\"example\": \"Over the whole period, numbers grew by 40 per cent.\",\"fi\": \"ajanjakso\",\"mods\": [\"charts\"]},\"pie chart\": {\"term\": \"pie chart\",\"def\": \"A circular chart divided into slices, each showing a part of the whole.\",\"example\": \"The pie chart shows where the budget goes.\",\"fi\": \"ympyrädiagrammi\",\"mods\": [\"charts\"]},\"slice\": {\"term\": \"slice\",\"def\": \"One section of a pie chart. Also called a segment.\",\"example\": \"The largest slice is staff costs.\",\"fi\": \"sektori, lohko\",\"mods\": [\"charts\"]},\"proportion\": {\"term\": \"proportion\",\"def\": \"The size of one part compared with the whole.\",\"example\": \"A large proportion of the budget goes on salaries.\",\"fi\": \"osuus, suhde\",\"mods\": [\"charts\"]},\"account for\": {\"term\": \"to account for\",\"def\": \"To form a particular part of a total.\",\"example\": \"Marketing accounts for 12 per cent of costs.\",\"fi\": \"muodostaa (osuus jostakin)\",\"mods\": [\"charts\"]},\"the majority\": {\"term\": \"the majority\",\"def\": \"More than half of the total.\",\"example\": \"The majority of customers are under thirty.\",\"fi\": \"enemmistö, suurin osa\",\"mods\": [\"charts\"]},\"breakdown\": {\"term\": \"breakdown\",\"def\": \"A division of a total into its separate parts.\",\"example\": \"Here is a breakdown of the costs by department.\",\"fi\": \"erittely, jakauma\",\"mods\": [\"charts\"]},\"histogram\": {\"term\": \"histogram\",\"def\": \"A chart showing how measured data is spread across a continuous scale.\",\"example\": \"The histogram shows the ages of our customers.\",\"fi\": \"histogrammi\",\"mods\": [\"charts\"]},\"range\": {\"term\": \"range\",\"def\": \"The distance between the lowest and the highest value in a group.\",\"example\": \"Each bar covers a ten-year range.\",\"fi\": \"vaihteluväli\",\"mods\": [\"charts\"]},\"distribution\": {\"term\": \"distribution\",\"def\": \"The way values are spread across a scale.\",\"example\": \"The distribution shows most customers are between 25 and 40.\",\"fi\": \"jakauma\",\"mods\": [\"charts\"]},\"frequency\": {\"term\": \"frequency\",\"def\": \"How many times something occurs.\",\"example\": \"The vertical axis shows the frequency of each age group.\",\"fi\": \"frekvenssi, esiintymistiheys\",\"mods\": [\"charts\"]},\"fall into\": {\"term\": \"to fall into\",\"def\": \"To belong to a particular group or range.\",\"example\": \"Most orders fall into the 40–80 euro range.\",\"fi\": \"kuulua (johonkin ryhmään)\",\"mods\": [\"charts\"]},\"continuous\": {\"term\": \"continuous\",\"def\": \"Without gaps; able to take any value on a scale.\",\"example\": \"Age is continuous data, so a histogram fits it.\",\"fi\": \"jatkuva\",\"mods\": [\"charts\"]},\"scatter plot\": {\"term\": \"scatter plot\",\"def\": \"A chart using dots to show the relationship between two sets of data.\",\"example\": \"The scatter plot compares hours studied and exam results.\",\"fi\": \"hajontakuvio, sirontakuvio\",\"mods\": [\"charts\"]},\"variable\": {\"term\": \"variable\",\"def\": \"Something being measured that can change, such as price, age or time.\",\"example\": \"The two variables here are price and number of sales.\",\"fi\": \"muuttuja\",\"mods\": [\"charts\"]},\"correlation\": {\"term\": \"correlation\",\"def\": \"A connection between two things, where they change together.\",\"example\": \"There is a clear correlation between price and demand.\",\"fi\": \"korrelaatio, riippuvuus\",\"mods\": [\"charts\"]},\"relationship\": {\"term\": \"relationship\",\"def\": \"A connection between two sets of data.\",\"example\": \"The dots show a weak relationship between the two.\",\"fi\": \"yhteys, suhde\",\"mods\": [\"charts\"]},\"outlier\": {\"term\": \"outlier\",\"def\": \"A value that is very different from all the others.\",\"example\": \"One outlier sold far more than every other shop.\",\"fi\": \"poikkeava havainto\",\"mods\": [\"charts\"]},\"cluster\": {\"term\": \"to cluster\",\"def\": \"To group closely together.\",\"example\": \"Most of the dots cluster in the lower left corner.\",\"fi\": \"ryömittyä yhteen, keskittyä\",\"mods\": [\"charts\"]},\"venn diagram\": {\"term\": \"Venn diagram\",\"def\": \"A diagram of overlapping circles showing how groups relate.\",\"example\": \"The Venn diagram shows which skills the two jobs share.\",\"fi\": \"Venn-diagrammi\",\"mods\": [\"charts\"]},\"set\": {\"term\": \"set\",\"def\": \"A group of things considered together.\",\"example\": \"The left set is students; the right set is part-time workers.\",\"fi\": \"joukko\",\"mods\": [\"charts\"]},\"overlap\": {\"term\": \"to overlap\",\"def\": \"To cover part of the same area; to share something.\",\"example\": \"The two roles overlap in the skills they need.\",\"fi\": \"mennä päällekkäin, olla yhteistä\",\"mods\": [\"charts\"]},\"have in common\": {\"term\": \"to have in common\",\"def\": \"To share a feature or a quality.\",\"example\": \"What the two groups have in common is customer contact.\",\"fi\": \"olla yhteistä\",\"mods\": [\"charts\"]},\"belong to\": {\"term\": \"to belong to\",\"def\": \"To be a member of a group.\",\"example\": \"These students belong to both sets.\",\"fi\": \"kuulua (johonkin)\",\"mods\": [\"charts\"]},\"distinguish\": {\"term\": \"to distinguish\",\"def\": \"To see or show the difference between things.\",\"example\": \"The diagram distinguishes the two roles clearly.\",\"fi\": \"erottaa (toisistaan)\",\"mods\": [\"charts\"]},\"flow chart\": {\"term\": \"flow chart\",\"def\": \"A diagram showing the steps of a process in order.\",\"example\": \"The flow chart shows what happens when an order arrives.\",\"fi\": \"vuokaavio\",\"mods\": [\"charts\"]},\"process\": {\"term\": \"process\",\"def\": \"A series of steps that produce a result.\",\"example\": \"The whole process takes about three days.\",\"fi\": \"prosessi\",\"mods\": [\"charts\"]},\"step\": {\"term\": \"step\",\"def\": \"One action in a series.\",\"example\": \"The next step is to check the customer's details.\",\"fi\": \"vaihe\",\"mods\": [\"charts\"]},\"decision point\": {\"term\": \"decision point\",\"def\": \"A place in a process where a choice changes what happens next.\",\"example\": \"The first decision point asks whether the item is in stock.\",\"fi\": \"päätöskohta\",\"mods\": [\"charts\"]},\"sequence\": {\"term\": \"sequence\",\"def\": \"The order in which things happen.\",\"example\": \"The sequence matters: payment comes before dispatch.\",\"fi\": \"järjestys, kulku\",\"mods\": [\"charts\"]},\"lead to\": {\"term\": \"to lead to\",\"def\": \"To have something as a result, or to go on to a next step.\",\"example\": \"A “no” answer leads to the returns process.\",\"fi\": \"johtaa (johonkin)\",\"mods\": [\"charts\"]},\"appropriate\": {\"term\": \"appropriate\",\"def\": \"Right for the situation or purpose.\",\"example\": \"A pie chart is not appropriate for data over time.\",\"fi\": \"sopiva, tarkoituksenmukainen\",\"mods\": [\"charts\"]},\"misleading\": {\"term\": \"misleading\",\"def\": \"Giving a wrong impression, even if the facts are correct.\",\"example\": \"Starting the axis at 50 makes the difference look misleading.\",\"fi\": \"harhaanjohtava\",\"mods\": [\"charts\"]},\"distort\": {\"term\": \"to distort\",\"def\": \"To change the shape of something so it gives a false impression.\",\"example\": \"Cutting the axis distorts the comparison.\",\"fi\": \"vääristää\",\"mods\": [\"charts\"]},\"scale\": {\"term\": \"scale\",\"def\": \"The set of numbers marked along an axis.\",\"example\": \"Check the scale before you believe the shape of the graph.\",\"fi\": \"asteikko\",\"mods\": [\"charts\"]},\"legend\": {\"term\": \"legend\",\"def\": \"The small box explaining what each colour or line means. Also called a key.\",\"example\": \"The legend shows which line is which product.\",\"fi\": \"selite\",\"mods\": [\"charts\"]},\"caption\": {\"term\": \"caption\",\"def\": \"The text under a chart explaining what it shows.\",\"example\": \"Every figure needs a caption and a source.\",\"fi\": \"kuvateksti\",\"mods\": [\"charts\"]},\"illustrate\": {\"term\": \"to illustrate\",\"def\": \"To make something clearer by showing an example or a picture.\",\"example\": \"The graph illustrates the effect of the price change.\",\"fi\": \"havainnollistaa\",\"mods\": [\"charts\"]},\"be worth\": {\"term\": \"to be worth\",\"def\": \"To be useful or valuable enough to do.\",\"example\": \"With only three numbers, a chart is not worth the space.\",\"fi\": \"olla vaivan arvoinen\",\"mods\": [\"charts\"]},\"rise\": {\"term\": \"to rise\",\"def\": \"To go up. The past form is rose.\",\"example\": \"Sales rose steadily between March and June.\",\"fi\": \"nousta\",\"mods\": [\"charts\"]},\"fall\": {\"term\": \"to fall\",\"def\": \"To go down. The past form is fell.\",\"example\": \"Numbers fell sharply after the price change.\",\"fi\": \"laskea\",\"mods\": [\"charts\"]},\"peak\": {\"term\": \"to peak\",\"def\": \"To reach the highest point before going down again.\",\"example\": \"Traffic peaked in August at 12,000 visitors.\",\"fi\": \"saavuttaa huippunsa\",\"mods\": [\"charts\"]},\"level off\": {\"term\": \"to level off\",\"def\": \"To stop rising or falling and stay at about the same level.\",\"example\": \"Growth levelled off in the final quarter.\",\"fi\": \"tasaantua\",\"mods\": [\"charts\"]},\"remain stable\": {\"term\": \"to remain stable\",\"def\": \"To stay at the same level.\",\"example\": \"Prices remained stable for most of the year.\",\"fi\": \"pysyä vakaana\",\"mods\": [\"charts\"]},\"sharply\": {\"term\": \"sharply\",\"def\": \"Quickly and by a large amount.\",\"example\": \"Costs rose sharply in the winter.\",\"fi\": \"jyrkästi, voimakkaasti\",\"mods\": [\"charts\"]},\"steadily\": {\"term\": \"steadily\",\"def\": \"At a regular, even rate.\",\"example\": \"The figure grew steadily over five years.\",\"fi\": \"tasaisesti\",\"mods\": [\"charts\"]},\"slightly\": {\"term\": \"slightly\",\"def\": \"By a small amount.\",\"example\": \"Numbers dipped slightly in February.\",\"fi\": \"hieman, vähän\",\"mods\": [\"charts\"]},\"roughly\": {\"term\": \"roughly\",\"def\": \"Approximately; not exactly.\",\"example\": \"Roughly a third of customers order twice a year.\",\"fi\": \"suunnilleen, karkeasti\",\"mods\": [\"charts\"]},\"suggest\": {\"term\": \"to suggest\",\"def\": \"To show that something is probably true, without proving it.\",\"example\": \"This suggests that the campaign worked.\",\"fi\": \"viitata (johonkin), antaa ymmärtää\",\"mods\": [\"charts\"]},\"deliver value\": {\"term\": \"to deliver value\",\"def\": \"To give customers something useful or beneficial.\",\"example\": \"Our app delivers value by helping users manage their time more efficiently.\",\"fi\": \"tuottaa arvoa\",\"mods\": [\"canvas\"]},\"satisfy a need\": {\"term\": \"to satisfy a need\",\"def\": \"To meet what a customer wants or requires.\",\"example\": \"The new feature satisfies a need that many users had reported.\",\"fi\": \"tyydyttää tarve\",\"mods\": [\"canvas\"]},\"solve a problem\": {\"term\": \"to solve a problem\",\"def\": \"To find an answer to a difficulty a customer faces.\",\"example\": \"Our service solves the problem of slow delivery times.\",\"fi\": \"ratkaista ongelma\",\"mods\": [\"canvas\"]},\"bundle of services\": {\"term\": \"bundle of services\",\"def\": \"A group of related services sold together as one package.\",\"example\": \"The company offers a bundle of services including cloud storage, email, and support.\",\"fi\": \"palvelukokonaisuus, palvelupaketti\",\"mods\": [\"canvas\"]},\"customization\": {\"term\": \"customization\",\"def\": \"Changing a product to fit one specific customer's needs.\",\"example\": \"We offer customization so each client can choose the features they need.\",\"fi\": \"räätälöinti\",\"mods\": [\"canvas\"]},\"unique selling point (usp)\": {\"term\": \"unique selling point (USP)\",\"def\": \"The one specific thing that makes your product different from all others.\",\"example\": \"Their unique selling point is a battery that lasts three times longer than competitors.\",\"fi\": \"ainutlaatuinen myyntivaltti\",\"mods\": [\"canvas\",\"pitch\"]},\"competitive advantage\": {\"term\": \"competitive advantage\",\"def\": \"Something that puts a company ahead of its rivals.\",\"example\": \"Their competitive advantage is speed — orders arrive the next day.\",\"fi\": \"kilpailuetu\",\"mods\": [\"canvas\"]},\"pain point\": {\"term\": \"pain point\",\"def\": \"A specific problem or frustration that a customer experiences.\",\"example\": \"Slow checkout was a major pain point, so they introduced one-click payment.\",\"fi\": \"kipupiste\",\"mods\": [\"canvas\",\"pitch\"]},\"differentiate\": {\"term\": \"to differentiate\",\"def\": \"To make your product clearly different from others on the market.\",\"example\": \"They differentiated their product by offering a lifetime warranty.\",\"fi\": \"erottautua (kilpailijoista)\",\"mods\": [\"canvas\"]},\"brand image\": {\"term\": \"brand image\",\"def\": \"The impression customers have of a company and its products.\",\"example\": \"Apple has built a strong brand image around simplicity and quality.\",\"fi\": \"brändikuva, brändimielikuva\",\"mods\": [\"canvas\"]},\"mass market\": {\"term\": \"mass market\",\"def\": \"A very large group of customers who all have similar needs.\",\"example\": \"Supermarkets target the mass market — almost everyone needs food.\",\"fi\": \"massamarkkinat\",\"mods\": [\"canvas\"]},\"niche market\": {\"term\": \"niche market\",\"def\": \"A small, specific group of customers with very particular needs.\",\"example\": \"The company targets a niche market of professional rock climbers.\",\"fi\": \"kapea markkinasegmentti, niche-markkinat\",\"mods\": [\"canvas\"]},\"demographics\": {\"term\": \"demographics\",\"def\": \"Basic facts about a group of people, such as age, gender, or income.\",\"example\": \"Their demographics show that most customers are women aged 25-40.\",\"fi\": \"demografiset tekijät, väestötiedot\",\"mods\": [\"canvas\"]},\"target audience\": {\"term\": \"target audience\",\"def\": \"The specific group of people a product or service is designed for.\",\"example\": \"Their target audience is small business owners who need simple accounting software.\",\"fi\": \"kohdeyleisö, kohderyhmä\",\"mods\": [\"canvas\"]},\"multi-sided platform\": {\"term\": \"multi-sided platform\",\"def\": \"A business that connects two or more separate groups who need each other, e.g. buyers and sellers.\",\"example\": \"eBay is a multi-sided platform connecting buyers and sellers.\",\"fi\": \"monen osapuolen alusta\",\"mods\": [\"canvas\"]},\"customer profile\": {\"term\": \"customer profile\",\"def\": \"A description of a typical customer, including their habits and needs.\",\"example\": \"We built a customer profile to better understand what our users want.\",\"fi\": \"asiakasprofiili\",\"mods\": [\"canvas\"]},\"market segmentation\": {\"term\": \"market segmentation\",\"def\": \"Dividing a large market into smaller groups based on shared characteristics.\",\"example\": \"Market segmentation helped them focus their advertising on the right people.\",\"fi\": \"markkinoiden segmentointi\",\"mods\": [\"canvas\"]},\"b2b (business-to-business)\": {\"term\": \"B2B (busine
