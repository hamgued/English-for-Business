ss-to-business)\",\"def\": \"A company that sells products or services to other businesses, not to individual consumers.\",\"example\": \"Their software is B2B — it is sold to companies, not private customers.\",\"fi\": \"yritysten välinen kauppa (B2B)\",\"mods\": [\"canvas\"]},\"b2c (business-to-consumer)\": {\"term\": \"B2C (business-to-consumer)\",\"def\": \"A company that sells directly to individual customers.\",\"example\": \"Most online shops are B2C — anyone can visit and buy.\",\"fi\": \"kuluttajakauppa (B2C)\",\"mods\": [\"canvas\"]},\"early adopters\": {\"term\": \"early adopters\",\"def\": \"Customers who are among the first to try a new product or service.\",\"example\": \"Early adopters gave useful feedback that helped improve the product before its full launch.\",\"fi\": \"varhaiset omaksujat\",\"mods\": [\"canvas\"]},\"distribution channel\": {\"term\": \"distribution channel\",\"def\": \"The route a product takes to get from the company to the customer.\",\"example\": \"Their main distribution channel is their website, but they also sell in supermarkets.\",\"fi\": \"jakelukanava\",\"mods\": [\"canvas\"]},\"awareness\": {\"term\": \"awareness\",\"def\": \"The stage when customers first learn that your product exists.\",\"example\": \"We use social media advertising to build awareness of our brand.\",\"fi\": \"tietoisuus, tunnettuus\",\"mods\": [\"canvas\"]},\"post-purchase support\": {\"term\": \"post-purchase support\",\"def\": \"Help given to customers after they have already bought the product.\",\"example\": \"Good post-purchase support, like a helpline, encourages customers to buy again.\",\"fi\": \"oston jälkeinen tuki\",\"mods\": [\"canvas\"]},\"point of sale\": {\"term\": \"point of sale\",\"def\": \"The place where a customer pays for a product or service.\",\"example\": \"They added a digital display at the point of sale to promote new products.\",\"fi\": \"myyntipiste\",\"mods\": [\"canvas\"]},\"evaluation\": {\"term\": \"evaluation\",\"def\": \"The stage when a customer is deciding whether your offer is right for them.\",\"example\": \"Free trials help customers during the evaluation stage.\",\"fi\": \"arviointi\",\"mods\": [\"canvas\"]},\"brick and mortar\": {\"term\": \"brick and mortar\",\"def\": \"A physical shop or building, as opposed to an online store.\",\"example\": \"Despite growing online sales, they kept their brick and mortar stores open.\",\"fi\": \"kivijalkakauppa\",\"mods\": [\"canvas\"]},\"direct channel\": {\"term\": \"direct channel\",\"def\": \"Selling straight to the customer without any middlemen.\",\"example\": \"Selling through their own website is a direct channel.\",\"fi\": \"suora kanava\",\"mods\": [\"canvas\"]},\"indirect channel\": {\"term\": \"indirect channel\",\"def\": \"Selling through a third party, such as a retailer or agent.\",\"example\": \"Using a supermarket to sell their product is an indirect channel.\",\"fi\": \"epäsuora kanava\",\"mods\": [\"canvas\"]},\"e-commerce\": {\"term\": \"e-commerce\",\"def\": \"Buying and selling products or services over the internet.\",\"example\": \"Their e-commerce sales grew by 40% last year.\",\"fi\": \"verkkokauppa\",\"mods\": [\"canvas\"]},\"customer journey\": {\"term\": \"customer journey\",\"def\": \"All the steps a customer goes through from first hearing about a product to buying it.\",\"example\": \"They mapped the customer journey to find out where people were dropping off.\",\"fi\": \"asiakaspolku\",\"mods\": [\"canvas\"]},\"personal assistance\": {\"term\": \"personal assistance\",\"def\": \"A real person helps the customer directly, for example by phone or in a meeting.\",\"example\": \"High-value clients receive personal assistance from a dedicated account manager.\",\"fi\": \"henkilökohtainen palvelu\",\"mods\": [\"canvas\"]},\"self-service\": {\"term\": \"self-service\",\"def\": \"The customer finds what they need on their own, without staff involvement.\",\"example\": \"The website uses a self-service model — customers can order and track deliveries themselves.\",\"fi\": \"itsepalvelu\",\"mods\": [\"canvas\"]},\"co-creation\": {\"term\": \"co-creation\",\"def\": \"Customers help create value, for example by writing reviews or suggesting features.\",\"example\": \"The app improves through co-creation — users vote on which new features to build next.\",\"fi\": \"yhteiskehittäminen\",\"mods\": [\"canvas\"]},\"customer retention\": {\"term\": \"customer retention\",\"def\": \"Keeping your existing customers so they continue to buy from you.\",\"example\": \"A loyalty card scheme is a common customer retention strategy.\",\"fi\": \"asiakaspysyvyys\",\"mods\": [\"canvas\"]},\"automated service\": {\"term\": \"automated service\",\"def\": \"Technology such as a chatbot that serves customers without human staff.\",\"example\": \"Their automated service sends order updates to customers by SMS.\",\"fi\": \"automatisoitu palvelu\",\"mods\": [\"canvas\"]},\"dedicated support\": {\"term\": \"dedicated support\",\"def\": \"One specific employee is assigned to look after one important client.\",\"example\": \"Enterprise clients receive dedicated support from a named contact.\",\"fi\": \"nimetty tukihenkilö, oma tukipalvelu\",\"mods\": [\"canvas\"]},\"loyalty programme\": {\"term\": \"loyalty programme\",\"def\": \"A scheme that rewards customers for buying regularly, e.g. with points or discounts.\",\"example\": \"Their loyalty programme gives customers one point for every euro they spend.\",\"fi\": \"kanta-asiakasohjelma\",\"mods\": [\"canvas\"]},\"churn rate\": {\"term\": \"churn rate\",\"def\": \"The percentage of customers who stop using a product or service over a given period.\",\"example\": \"A high churn rate means many customers are leaving — a sign something needs to improve.\",\"fi\": \"asiakaspoistuma\",\"mods\": [\"canvas\"]},\"customer satisfaction\": {\"term\": \"customer satisfaction\",\"def\": \"How happy customers are with a product or service.\",\"example\": \"They send a short survey after each purchase to measure customer satisfaction.\",\"fi\": \"asiakastyytyväisyys\",\"mods\": [\"canvas\"]},\"after-sales service\": {\"term\": \"after-sales service\",\"def\": \"Support and care provided to a customer after they have made a purchase.\",\"example\": \"Their after-sales service includes free repairs for one year.\",\"fi\": \"myynnin jälkeinen palvelu, jälkimarkkinointi\",\"mods\": [\"canvas\"]},\"subscription fee\": {\"term\": \"subscription fee\",\"def\": \"A regular payment, monthly or yearly, to access a service.\",\"example\": \"Users pay a monthly subscription fee of 9.99 to use the platform.\",\"fi\": \"tilausmaksu\",\"mods\": [\"canvas\"]},\"asset sale\": {\"term\": \"asset sale\",\"def\": \"Earning money by selling ownership of a physical product.\",\"example\": \"Their main revenue comes from asset sale — customers buy the device outright.\",\"fi\": \"tuotteen myynti, omaisuuden myynti\",\"mods\": [\"canvas\"]},\"licensing\": {\"term\": \"licensing\",\"def\": \"Charging others for the right to use your technology, brand, or idea.\",\"example\": \"The company earns revenue through licensing its software to hospitals.\",\"fi\": \"lisensointi\",\"mods\": [\"canvas\"]},\"fixed pricing\": {\"term\": \"fixed pricing\",\"def\": \"A set price that does not change, regardless of when or how much you buy.\",\"example\": \"They use fixed pricing — every customer pays the same amount.\",\"fi\": \"kiinteä hinnoittelu\",\"mods\": [\"canvas\"]},\"dynamic pricing\": {\"term\": \"dynamic pricing\",\"def\": \"Prices that change depending on demand, time, or the customer.\",\"example\": \"Airlines use dynamic pricing — tickets are cheaper if you book months in advance.\",\"fi\": \"dynaaminen hinnoittelu\",\"mods\": [\"canvas\"]},\"usage fee\": {\"term\": \"usage fee\",\"def\": \"A charge based on how much of a service a customer uses.\",\"example\": \"The cloud provider charges a usage fee based on how much storage you use.\",\"fi\": \"käyttömaksu\",\"mods\": [\"canvas\"]},\"freemium model\": {\"term\": \"freemium model\",\"def\": \"A basic version is free; users pay to unlock extra features.\",\"example\": \"Spotify uses a freemium model — free with ads, or paid for no ads and offline listening.\",\"fi\": \"freemium-malli\",\"mods\": [\"canvas\"]},\"brokerage fee\": {\"term\": \"brokerage fee\",\"def\": \"A charge paid to a middleman who arranges a deal between two parties.\",\"example\": \"The estate agent charged a brokerage fee of 2% on the sale price.\",\"fi\": \"välityspalkkio\",\"mods\": [\"canvas\"]},\"advertising revenue\": {\"term\": \"advertising revenue\",\"def\": \"Money earned by allowing other companies to advertise on your platform.\",\"example\": \"Google earns most of its advertising revenue through search ads.\",\"fi\": \"mainostulot\",\"mods\": [\"canvas\"]},\"margin\": {\"term\": \"margin\",\"def\": \"The difference between the price charged and the cost of producing something.\",\"example\": \"They increased their margin by reducing production costs.\",\"fi\": \"kate, marginaali\",\"mods\": [\"canvas\"]},\"intellectual property\": {\"term\": \"intellectual property\",\"def\": \"Something a company has created and owns legally, such as a brand name, invention, or software.\",\"example\": \"Their most valuable intellectual property is the algorithm behind their search engine.\",\"fi\": \"immateriaalioikeudet, aineeton omaisuus\",\"mods\": [\"canvas\"]},\"human resources\": {\"term\": \"human resources\",\"def\": \"The employees and staff that a business needs.\",\"example\": \"Their human resources include a team of 50 engineers and 20 customer service agents.\",\"fi\": \"henkilöstöresurssit, henkilöstö\",\"mods\": [\"canvas\"]},\"financial assets\": {\"term\": \"financial assets\",\"def\": \"Money, credit, and other financial tools a company uses to operate.\",\"example\": \"The startup used its financial assets to hire staff and rent office space.\",\"fi\": \"rahoitusvarat\",\"mods\": [\"canvas\"]},\"physical equipment\": {\"term\": \"physical equipment\",\"def\": \"Machines, buildings, vehicles, and other objects the business needs.\",\"example\": \"The factory invested in new physical equipment to increase production.\",\"fi\": \"laitteet, fyysiset resurssit\",\"mods\": [\"canvas\"]},\"patent\": {\"term\": \"patent\",\"def\": \"An official legal document giving a company the exclusive right to make or sell an invention.\",\"example\": \"The patent protects their product design for the next 20 years.\",\"fi\": \"patentti\",\"mods\": [\"canvas\"]},\"credit\": {\"term\": \"credit\",\"def\": \"The ability to borrow money from a bank or lender to pay for things now and repay later.\",\"example\": \"They used credit to buy new machinery before their busy season.\",\"fi\": \"luotto\",\"mods\": [\"canvas\"]},\"trademark\": {\"term\": \"trademark\",\"def\": \"A legally protected symbol, name, or logo that identifies a company's products.\",\"example\": \"The golden arches are one of the most recognised trademarks in the world.\",\"fi\": \"tavaramerkki\",\"mods\": [\"canvas\"]},\"know-how\": {\"term\": \"know-how\",\"def\": \"Practical knowledge and expertise needed to do something well.\",\"example\": \"Their competitive strength comes from years of know-how in battery technology.\",\"fi\": \"osaaminen, tietotaito\",\"mods\": [\"canvas\"]},\"infrastructure\": {\"term\": \"infrastructure\",\"def\": \"The basic physical and digital systems a business needs to operate, such as servers, offices, or networks.\",\"example\": \"They invested heavily in digital infrastructure to support remote working.\",\"fi\": \"infrastruktuuri\",\"mods\": [\"canvas\"]},\"production\": {\"term\": \"production\",\"def\": \"Designing, making, and delivering a physical product.\",\"example\": \"Production is the company's key activity — they manufacture 10,000 units per day.\",\"fi\": \"tuotanto\",\"mods\": [\"canvas\"]},\"problem solving\": {\"term\": \"problem solving\",\"def\": \"Finding new solutions to customer difficulties, common in consulting or service businesses.\",\"example\": \"Problem solving is central to what lawyers and accountants do for their clients.\",\"fi\": \"ongelmanratkaisu\",\"mods\": [\"canvas\"]},\"platform management\": {\"term\": \"platform management\",\"def\": \"Running and maintaining an online network, marketplace, or app.\",\"example\": \"Platform management includes fixing technical issues and ensuring the site is secure.\",\"fi\": \"alustan hallinta\",\"mods\": [\"canvas\"]},\"manufacture\": {\"term\": \"to manufacture\",\"def\": \"To make products in large quantities, usually in a factory.\",\"example\": \"They manufacture all their products in Finland before shipping overseas.\",\"fi\": \"valmistaa\",\"mods\": [\"canvas\"]},\"supply chain management\": {\"term\": \"supply chain management\",\"def\": \"Controlling the whole process of getting materials, making products, and delivering them.\",\"example\": \"Good supply chain management means products arrive on time and at the right cost.\",\"fi\": \"toimitusketjun hallinta\",\"mods\": [\"canvas\"]},\"consulting\": {\"term\": \"consulting\",\"def\": \"Providing expert advice to other businesses or clients.\",\"example\": \"The firm earns most of its income through consulting for large corporations.\",\"fi\": \"konsultointi\",\"mods\": [\"canvas\"]},\"research and development (r&d)\": {\"term\": \"research and development (R&D)\",\"def\": \"Work done to create new products or improve existing ones.\",\"example\": \"They invest 15% of their profits in research and development each year.\",\"fi\": \"tutkimus ja kehitys (T&K)\",\"mods\": [\"canvas\"]},\"quality control\": {\"term\": \"quality control\",\"def\": \"The process of checking that products meet the required standard before they reach customers.\",\"example\": \"Strict quality control means fewer returns and higher customer satisfaction.\",\"fi\": \"laadunvalvonta\",\"mods\": [\"canvas\"]},\"marketing\": {\"term\": \"marketing\",\"def\": \"Activities that promote a product or service and attract customers.\",\"example\": \"Their marketing strategy focuses on social media and influencer partnerships.\",\"fi\": \"markkinointi\",\"mods\": [\"canvas\"]},\"logistics\": {\"term\": \"logistics\",\"def\": \"Planning and managing how goods are stored, transported, and delivered.\",\"example\": \"Efficient logistics allow them to deliver orders within 24 hours.\",\"fi\": \"logistiikka\",\"mods\": [\"canvas\"]},\"strategic partnership\": {\"term\": \"strategic partnership\",\"def\": \"A long-term working agreement between two companies that helps both of them.\",\"example\": \"The two companies formed a strategic partnership to share research costs.\",\"fi\": \"strateginen kumppanuus\",\"mods\": [\"canvas\"]},\"joint venture\": {\"term\": \"joint venture\",\"def\": \"Two or more companies creating a new, shared business project together.\",\"example\": \"Sony and Ericsson started a joint venture to produce mobile phones.\",\"fi\": \"yhteisyritys\",\"mods\": [\"canvas\"]},\"supplier\": {\"term\": \"supplier\",\"def\": \"A company that provides raw materials or components that you need.\",\"example\": \"Their main supplier delivers the packaging materials every two weeks.\",\"fi\": \"toimittaja, tavarantoimittaja\",\"mods\": [\"canvas\"]},\"strategic alliance\": {\"term\": \"strategic alliance\",\"def\": \"A partnership between companies that are not competitors, to benefit both sides.\",\"example\": \"The airline formed a strategic alliance with a hotel chain to offer package deals.\",\"fi\": \"strateginen liittouma\",\"mods\": [\"canvas\"]},\"outsourcing\": {\"term\": \"outsourcing\",\"def\": \"Paying another company to carry out a task in order to save money or time.\",\"example\": \"They cut costs by outsourcing their IT support to a specialist company.\",\"fi\": \"ulkoistaminen\",\"mods\": [\"canvas\"]},\"resource acquisition\": {\"term\": \"resource acquisition\",\"def\": \"Getting the materials, skills, or tools you need from an outside source.\",\"example\": \"Resource acquisition through partnerships helped them enter the Asian market quickly.\",\"fi\": \"resurssien hankinta\",\"mods\": [\"canvas\"]},\"subcontractor\": {\"term\": \"subcontractor\",\"def\": \"A person or company hired by a main contractor to do part of a larger job.\",\"example\": \"The construction firm used a subcontractor to handle the electrical work.\",\"fi\": \"alihankkija\",\"mods\": [\"canvas\"]},\"franchise\": {\"term\": \"franchise\",\"def\": \"A business arrangement where one company allows another to use its brand and system in exchange for a fee.\",\"example\": \"McDonald's operates through a franchise model — most restaurants are run by independent owners.\",\"fi\": \"franchising-toiminta\",\"mods\": [\"canvas\"]},\"memorandum of understanding (mou)\": {\"term\": \"memorandum of understanding (MOU)\",\"def\": \"A written agreement between two organisations that describes their planned cooperation.\",\"example\": \"The two universities signed a memorandum of understanding to share research facilities.\",\"fi\": \"aiesopimus\",\"mods\": [\"canvas\"]},\"due diligence\": {\"term\": \"due diligence\",\"def\": \"The process of carefully checking a potential partner or deal before signing an agreement.\",\"example\": \"Before signing, they carried out full due diligence on the supplier's financial records.\",\"fi\": \"due diligence -tarkastus, ennakkotarkastus\",\"mods\": [\"canvas\"]},\"fixed costs\": {\"term\": \"fixed costs\",\"def\": \"Costs that stay the same every month, regardless of how much you produce or sell.\",\"example\": \"Rent and salaries are fixed costs — the company pays them whether sales are high or low.\",\"fi\": \"kiinteät kustannukset\",\"mods\": [\"canvas\"]},\"variable costs\": {\"term\": \"variable costs\",\"def\": \"Costs that go up or down depending on how much you produce.\",\"example\": \"Raw materials are a variable cost — the more units they make, the more materials they need.\",\"fi\": \"muuttuvat kustannukset\",\"mods\": [\"canvas\"]},\"economies of scale\": {\"term\": \"economies of scale\",\"def\": \"When producing more units makes the cost per unit cheaper.\",\"example\": \"By ordering in bulk, they benefit from economies of scale and pay less per item.\",\"fi\": \"mittakaavaedut\",\"mods\": [\"canvas\"]},\"cost-driven\": {\"term\": \"cost-driven\",\"def\": \"A business approach that tries to keep all costs as low as possible.\",\"example\": \"Budget airlines are cost-driven — they cut every expense to offer cheap tickets.\",\"fi\": \"kustannusvetoinen\",\"mods\": [\"canvas\"]},\"value-driven\": {\"term\": \"value-driven\",\"def\": \"A business approach that focuses on quality or experience rather than low cost.\",\"example\": \"Luxury hotels are value-driven — customers expect high quality and are willing to pay for it.\",\"fi\": \"arvovetoinen\",\"mods\": [\"canvas\"]},\"overhead\": {\"term\": \"overhead\",\"def\": \"Regular costs of running a business that are not directly linked to production, such as rent and utilities.\",\"example\": \"They moved to a smaller office to reduce their monthly overhead.\",\"fi\": \"yleiskustannukset\",\"mods\": [\"canvas\"]},\"break-even point\": {\"term\": \"break-even point\",\"def\": \"The level of sales at which a business covers all its costs and starts to make a profit.\",\"example\": \"They calculated they need to sell 500 units a month to reach the break-even point.\",\"fi\": \"kannattavuusraja, kriittinen piste\",\"mods\": [\"canvas\"]},\"cash flow\": {\"term\": \"cash flow\",\"def\": \"The movement of money into and out of a business over a period of time.\",\"example\": \"Poor cash flow meant they could not pay their suppliers on time.\",\"fi\": \"kassavirta\",\"mods\": [\"canvas\"]},\"depreciation\": {\"term\": \"depreciation\",\"def\": \"The reduction in value of an asset over time due to wear and use.\",\"example\": \"The depreciation on their delivery vans is calculated over five years.\",\"fi\": \"poistot, arvonalentuminen\",\"mods\": [\"canvas\"]},\"statement\": {\"term\": \"statement\",\"def\": \"A short, clear sentence that says what something is or does.\",\"example\": \"Our opening statement should tell the audience what Snowbox does in ten seconds.\",\"fi\": \"lausuma, ydinlause\",\"mods\": [\"pitch\"]},\"memorable\": {\"term\": \"memorable\",\"def\": \"Easy to remember.\",\"example\": \"A memorable statement uses simple words and a strong idea.\",\"fi\": \"mieleenpainuva\",\"mods\": [\"pitch\"]},\"mission\": {\"term\": \"mission\",\"def\": \"The main purpose of a company: what it wants to achieve.\",\"example\": \"Snowbox's mission is to make Finnish winter easy for international students.\",\"fi\": \"missio, toiminta-ajatus\",\"mods\": [\"pitch\"]},\"impact\": {\"term\": \"impact\",\"def\": \"The effect or change that something makes.\",\"example\": \"We want to describe the impact of our service, not the technical details.\",\"fi\": \"vaikutus\",\"mods\": [\"pitch\"]},\"in a nutshell\": {\"term\": \"in a nutshell\",\"def\": \"Said in a very short and simple way.\",\"example\": \"In a nutshell, we rent winter gear to students who only stay for one semester.\",\"fi\": \"pähkinänkuoressa, lyhyesti sanottuna\",\"mods\": [\"pitch\"]},\"target customer\": {\"term\": \"target customer\",\"def\": \"The type of person or company you want to sell to.\",\"example\": \"Our target customers are exchange students who arrive in autumn.\",\"fi\": \"kohdeasiakas\",\"mods\": [\"pitch\"]},\"market size\": {\"term\": \"market size\",\"def\": \"The total number of possible customers, or the total money they could spend.\",\"example\": \"The market size is about 12,000 international students in Finland every year.\",\"fi\": \"markkinoiden koko\",\"mods\": [\"pitch\"]},\"validate\": {\"term\": \"validate\",\"def\": \"To check that something is true, for example that customers really want your product.\",\"example\": \"We validated the idea by asking 80 students if they would pay for the service.\",\"fi\": \"varmistaa, validoida\",\"mods\": [\"pitch\"]},\"relate to\": {\"term\": \"relate to\",\"def\": \"To understand a problem because you have felt it yourself.\",\"example\": \"Everyone in the room can relate to being cold in January.\",\"fi\": \"samaistua (johonkin)\",\"mods\": [\"pitch\"]},\"feature\": {\"term\": \"feature\",\"def\": \"A part or function of a product.\",\"example\": \"One feature of the app is a size guide with photos.\",\"fi\": \"ominaisuus\",\"mods\": [\"pitch\"]},\"benefit\": {\"term\": \"benefit\",\"def\": \"The good result that a customer gets from a product.\",\"example\": \"The benefit is simple: warm clothes on your first day, with no big cost.\",\"fi\": \"hyöty\",\"mods\": [\"pitch\"]},\"solution\": {\"term\": \"solution\",\"def\": \"The way a problem is solved. In business, a company often calls its product 'the solution'.\",\"example\": \"Our solution is a rental package that students order online before they arrive.\",\"fi\": \"ratkaisu\",\"mods\": [\"pitch\"]},\"user\": {\"term\": \"user\",\"def\": \"A person who uses a product or service.\",\"example\": \"A user picks a package, chooses sizes, and collects the box at the campus.\",\"fi\": \"käyttäjä\",\"mods\": [\"pitch\"]},\"step by step\": {\"term\": \"step by step\",\"def\": \"One stage at a time, in order.\",\"example\": \"Let me explain the service step by step.\",\"fi\": \"vaihe vaiheelta\",\"mods\": [\"pitch\"]},\"demo (demonstration)\": {\"term\": \"demo (demonstration)\",\"def\": \"Showing how a product works, in front of an audience.\",\"example\": \"The demo shows a student ordering a package in 40 seconds.\",\"fi\": \"demo, esittely\",\"mods\": [\"pitch\"]},\"prototype\": {\"term\": \"prototype\",\"def\": \"An early version of a product, made to test the idea.\",\"example\": \"We built a prototype of the app in two weeks.\",\"fi\": \"prototyyppi\",\"mods\": [\"pitch\"]},\"mock-up\": {\"term\": \"mock-up\",\"def\": \"A picture or model of a product that shows what it will look like, but does not work yet.\",\"example\": \"This is only a mock-up, so the buttons do not work.\",\"fi\": \"mallinnos\",\"mods\": [\"pitch\"]},\"screenshot\": {\"term\": \"screenshot\",\"def\": \"A picture of what is on a computer or phone screen.\",\"example\": \"Here are three screenshots of the ordering page.\",\"fi\": \"kuvakaappaus\",\"mods\": [\"pitch\"]},\"live\": {\"term\": \"live\",\"def\": \"Happening now, in real time, in front of people.\",\"example\": \"We will do a live demo, but we have a video ready if the wifi fails.\",\"fi\": \"livenä, reaaliaikaisesti\",\"mods\": [\"pitch\"]},\"competitor\": {\"term\": \"competitor\",\"def\": \"Another company that sells a similar product to the same customers.\",\"example\": \"Our main competitors are second-hand shops and online marketplaces.\",\"fi\": \"kilpailija\",\"mods\": [\"pitch\"]},\"competition\": {\"term\": \"competition\",\"def\": \"All the other companies and options that customers could choose.\",\"example\": \"We know the competition well: we compared prices in six shops.\",\"fi\": \"kilpailu, kilpailijat\",\"mods\": [\"pitch\"]},\"alternative\": {\"term\": \"alternative\",\"def\": \"Another way to solve the same problem.\",\"example\": \"The main alternative is buying cheap clothes and throwing them away.\",\"fi\": \"vaihtoehto\",\"mods\": [\"pitch\"]},\"partnership\": {\"term\": \"partnership\",\"def\": \"A formal agreement between two companies to work together.\",\"example\": \"Our partnership with a local laundry keeps our costs low.\",\"fi\": \"kumppanuus\",\"mods\": [\"pitch\"]},\"traction\": {\"term\": \"traction\",\"def\": \"Signs that a business is growing and customers are interested.\",\"example\": \"We have real traction: 120 paying customers by December, from a pilot of 20.\",\"fi\": \"pito-/vetovoima\",\"mods\": [\"pitch\"]},\"pilot customer\": {\"term\": \"pilot customer\",\"def\": \"One of the first customers, who tests the product before the full launch.\",\"example\": \"Our pilot customers were 20 students in the autumn of 2025.\",\"fi\": \"pilottiasiakas\",\"mods\": [\"pitch\"]},\"user base\": {\"term\": \"user base\",\"def\": \"All the people who use a product.\",\"example\": \"Our user base grew from 20 to 120 in one semester.\",\"fi\": \"käyttäjäkunta\",\"mods\": [\"pitch\"]},\"growth\": {\"term\": \"growth\",\"def\": \"An increase in size, number or value.\",\"example\": \"The growth was faster than we expected.\",\"fi\": \"kasvu\",\"mods\": [\"pitch\"]},\"evidence\": {\"term\": \"evidence\",\"def\": \"Facts or information that show something is true.\",\"example\": \"The evidence is clear: 90 percent of customers would order again.\",\"fi\": \"näyttö, todiste\",\"mods\": [\"pitch\"]},\"revenue\": {\"term\": \"revenue\",\"def\": \"The money a company receives from selling its products or services.\",\"example\": \"Our revenue in the first semester was just over 10,000 euros.\",\"fi\": \"liikevaihto, tuotot\",\"mods\": [\"pitch\"]},\"pricing\": {\"term\": \"pricing\",\"def\": \"The way a company decides what to charge for its product.\",\"example\": \"Our pricing is simple: one price for one semester.\",\"fi\": \"hinnoittelu\",\"mods\": [\"pitch\"]},\"subscription\": {\"term\": \"subscription\",\"def\": \"A regular payment, for example monthly, to keep using a service.\",\"example\": \"A monthly subscription would be better for students who stay a full year.\",\"fi\": \"tilaus (esim. kuukausitilaus)\",\"mods\": [\"pitch\"]},\"scale (up)\": {\"term\": \"scale (up)\",\"def\": \"To grow a business to serve many more customers.\",\"example\": \"We plan to scale up to Helsinki and Tampere next year.\",\"fi\": \"skaalata, kasvattaa toimintaa\",\"mods\": [\"pitch\"]},\"profit margin\": {\"term\": \"profit margin\",\"def\": \"The part of the price that is profit, after all costs are paid.\",\"example\": \"Because we reuse each package five times, the profit margin is good.\",\"fi\": \"voittomarginaali, kate\",\"mods\": [\"pitch\"]},\"investor\": {\"term\": \"investor\",\"def\": \"A person or company that gives money to a business and expects to get more money back later.\",\"example\": \"We are looking for an investor who knows the Finnish student market.\",\"fi\": \"sijoittaja\",\"mods\": [\"pitch\"]},\"funding\": {\"term\": \"funding\",\"def\": \"Money given to a business or project.\",\"example\": \"With this funding, we can buy 300 more packages.\",\"fi\": \"rahoitus\",\"mods\": [\"pitch\"]},\"raise money\": {\"term\": \"raise money\",\"def\": \"To collect money from investors.\",\"example\": \"We want to raise 30,000 euros before next autumn.\",\"fi\": \"kerätä rahoitusta\",\"mods\": [\"pitch\"]},\"milestone\": {\"term\": \"milestone\",\"def\": \"An important goal on the way to a bigger goal.\",\"example\": \"Our first milestone is 500 customers by the end of the year.\",\"fi\": \"välitavoite, virstanpylväs\",\"mods\": [\"pitch\"]},\"return on investment (roi)\": {\"term\": \"return on investment (ROI)\",\"def\": \"The money an investor gets back, compared with the money they put in.\",\"example\": \"We expect a return on investment within two years.\",\"fi\": \"sijoitetun pääoman tuotto\",\"mods\": [\"pitch\"]},\"founder\": {\"term\": \"founder\",\"def\": \"A person who starts a company.\",\"example\": \"The three founders met in the first year at LAB.\",\"fi\": \"perustaja\",\"mods\": [\"pitch\"]},\"expertise\": {\"term\": \"expertise\",\"def\": \"Special knowledge or skill in a subject.\",\"example\": \"Sara's expertise is in logistics; she worked for a delivery company for two years.\",\"fi\": \"asiantuntemus\",\"mods\": [\"pitch\"]},\"track record\": {\"term\": \"track record\",\"def\": \"The things a person or company has done in the past, especially successes.\",\"example\": \"We have a track record: this is our second student project that made money.\",\"fi\": \"näytöt, aiemmat saavutukset\",\"mods\": [\"pitch\"]},\"complementary\": {\"term\": \"complementary\",\"def\": \"Different but working well together.\",\"example\": \"Our skills are complementary: one of us codes, one sells, one runs the logistics.\",\"fi\": \"toisiaan täydentävä\",\"mods\": [\"pitch\"]},\"commitment\": {\"term\": \"commitment\",\"def\": \"A strong promise to do something, and the willingness to work hard for it.\",\"example\": \"Our commitment is clear: we have worked on Snowbox every weekend for a year.\",\"fi\": \"sitoutuminen\",\"mods\": [\"pitch\"]},\"call to action\": {\"term\": \"call to action\",\"def\": \"A clear request that tells people what to do next.\",\"example\": \"The call to action is simple: book a meeting with us this week.\",\"fi\": \"toimintakehotus\",\"mods\": [\"pitch\"]},\"next step\": {\"term\": \"next step\",\"def\": \"The first thing that should happen after the pitch.\",\"example\": \"The next step is a 30-minute call to discuss the details.\",\"fi\": \"seuraava askel\",\"mods\": [\"pitch\"]},\"get in touch\": {\"term\": \"get in touch\",\"def\": \"To contact someone.\",\"example\": \"Please get in touch if you want to see the numbers in detail.\",\"fi\": \"ottaa yhteyttä\",\"mods\": [\"pitch\"]},\"closing line\": {\"term\": \"closing line\",\"def\": \"The last sentence of a talk, which should be strong and memorable.\",\"example\": \"Our closing line repeats the idea from the beginning of the pitch.\",\"fi\": \"loppulause, päätössanat\",\"mods\": [\"pitch\"]},\"cv (curriculum vitae)\": {\"term\": \"CV (curriculum vitae)\",\"def\": \"A short document listing your education, work experience and skills.\",\"example\": \"Please find my CV attached to this email.\",\"fi\": \"ansioluettelo, CV\",\"mods\": [\"situations\"]},\"applicant\": {\"term\": \"applicant\",\"def\": \"A person who applies for a job or a place on a course.\",\"example\": \"There were forty applicants for one summer position.\",\"fi\": \"hakija\",\"mods\": [\"situations\"]},\"shortlist\": {\"term\": \"to shortlist\",\"def\": \"To choose a small number of applicants from all those who applied.\",\"example\": \"Six people were shortlisted for an interview.\",\"fi\": \"valita jatkoon, karsia haastatteluun\",\"mods\": [\"situations\"]},\"qualification\": {\"term\": \"qualification\",\"def\": \"A degree, certificate or course you have completed.\",\"example\": \"The advertisement asks for a business qualification and good English.\",\"fi\": \"pätevyys, tutkinto\",\"mods\": [\"situations\"]},\"referee\": {\"term\": \"referee\",\"def\": \"A person who can describe your work to an employer, for example a former manager or a teacher.\",\"example\": \"I asked my summer job supervisor to be my referee.\",\"fi\": \"suosittelija\",\"mods\": [\"situations\"]},\"work placement\": {\"term\": \"work placement\",\"def\": \"A period of practical work that is part of your studies.\",\"example\": \"My work placement lasts three months and starts in May.\",\"fi\": \"työharjoittelu\",\"mods\": [\"situations\"]},\"tailor\": {\"term\": \"to tailor\",\"def\": \"To change something so that it fits one particular situation.\",\"example\": \"Tailor the cover letter to each job instead of sending the same one everywhere.\",\"fi\": \"räätälöidä, muokata sopivaksi\",\"mods\": [\"situations\"]},\"application form\": {\"term\": \"application form\",\"def\": \"A document with questions that you fill in when you apply for something.\",\"example\": \"Some employers use an application form instead of a CV.\",\"fi\": \"hakulomake\",\"mods\": [\"situations\"]},\"hard skill\": {\"term\": \"hard skill\",\"def\": \"A skill that can be measured, taught and proved, such as a language or a computer program.\",\"example\": \"Finnish, English and Excel are the hard skills on my CV.\",\"fi\": \"kova taito, mitattava osaaminen\",\"mods\": [\"situations\"]},\"soft skill\": {\"term\": \"soft skill\",\"def\": \"A skill about how you work with people and situations, such as teamwork or communication.\",\"example\": \"The interviewer asked about soft skills more than about software.\",\"fi\": \"pehmeä taito, vuorovaikutustaito\",\"mods\": [\"situations\"]},\"transferable skill\": {\"term\": \"transferable skill\",\"def\": \"A skill you learned in one situation that is also useful in another.\",\"example\": \"Serving customers in a café gave me transferable skills for an office job.\",\"fi\": \"siirrettävä taito\",\"mods\": [\"situations\"]},\"teamwork\": {\"term\": \"teamwork\",\"def\": \"Working well together with other people towards a shared goal.\",\"example\": \"The group project was where I really learned teamwork.\",\"fi\": \"tiimityö, ryhmätyöskentely\",\"mods\": [\"situations\"]},\"time management\": {\"term\": \"time management\",\"def\": \"Planning your time so that you finish things when they are needed.\",\"example\": \"Studying and working at the same time taught me time management.\",\"fi\": \"ajanhallinta\",\"mods\": [\"situations\"]},\"adaptability\": {\"term\": \"adaptability\",\"def\": \"The ability to change the way you work when the situation changes.\",\"example\": \"Adaptability matters in a small company, where tasks change every week.\",\"fi\": \"sopeutumiskyky\",\"mods\": [\"situations\"]},\"attention to detail\": {\"term\": \"attention to detail\",\"def\": \"Being careful and accurate in small things.\",\"example\": \"Checking every invoice takes attention to detail.\",\"fi\": \"tarkkuus, huolellisuus\",\"mods\": [\"situations\"]},\"certify\": {\"term\": \"to certify\",\"def\": \"To state officially, usually in a document, that something is true.\",\"example\": \"The course certifies that you can use the accounting software.\",\"fi\": \"todistaa, sertifioida\",\"mods\": [\"situations\"]},\"demonstrate\": {\"term\": \"to demonstrate\",\"def\": \"To show that something is true, by giving proof or an example.\",\"example\": \"The project demonstrates that I can work to a deadline.\",\"fi\": \"osoittaa, näyttää toteen\",\"mods\": [\"situations\"]},\"achievement\": {\"term\": \"achievement\",\"def\": \"Something good that you managed to do, especially after effort.\",\"example\": \"My main achievement was reducing the waiting time by half.\",\"fi\": \"saavutus\",\"mods\": [\"situations\"]},\"concrete\": {\"term\": \"concrete\",\"def\": \"Real and specific, not general or vague.\",\"example\": \"Give a concrete example instead of saying you are reliable.\",\"fi\": \"konkreettinen\",\"mods\": [\"situations\"]},\"gain experience\": {\"term\": \"to gain experience\",\"def\": \"To get practical knowledge by doing something.\",\"example\": \"I gained experience of customer service during two summers.\",\"fi\": \"kartuttaa kokemusta\",\"mods\": [\"situations\"]},\"develop\": {\"term\": \"to develop\",\"def\": \"To improve a skill gradually over time.\",\"example\": \"I developed my presentation skills during the second year.\",\"fi\": \"kehittää (taitoa)\",\"mods\": [\"situations\"]},\"reliable\": {\"term\": \"reliable\",\"def\": \"Someone who can be trusted to do what they said they would do.\",\"example\": \"Saying you are reliable is weak; showing it with an example is strong.\",\"fi\": \"luotettava\",\"mods\": [\"situations\"]},\"handle\": {\"term\": \"to handle\",\"def\": \"To deal with a situation, a task or a person successfully.\",\"example\": \"I handled complaints on my own when the manager was away.\",\"fi\": \"hoitaa, käsitellä\",\"mods\": [\"situations\"]},\"outcome\": {\"term\": \"outcome\",\"def\": \"The result of an action or a situation.\",\"example\": \"The outcome was that we finished two days early.\",\"fi\": \"lopputulos\",\"mods\": [\"situations\"]},\"job advertisement\": {\"term\": \"job advertisement\",\"def\": \"A public announcement that a company is looking for someone to fill a job.\",\"example\": \"The job advertisement says they need someone with customer service experience.\",\"fi\": \"työpaikkailmoitus\",\"mods\": [\"situations\"]},\"requirement\": {\"term\": \"requirement\",\"def\": \"Something an employer says you must have to get the job.\",\"example\": \"One requirement is fluent English; another is a driving licence.\",\"fi\": \"vaatimus\",\"mods\": [\"situations\"]},\"strength\": {\"term\": \"strength\",\"def\": \"Something you are good at.\",\"example\": \"My main strength is that I stay calm when things go wrong.\",\"fi\": \"vahvuus\",\"mods\": [\"situations\"]},\"weakness\": {\"term\": \"weakness\",\"def\": \"Something you find difficult, or an area where you are still learning.\",\"example\": \"When they ask about a weakness, name a real one and say what you are doing about it.\",\"fi\": \"heikkous, kehityskohde\",\"mods\": [\"situations\"]},\"be responsible for\": {\"term\": \"to be responsible for\",\"def\": \"To have the duty to do or manage something.\",\"example\": \"In that job I was responsible for the weekly stock order.\",\"fi\": \"olla vastuussa (jostakin)\",\"mods\": [\"situations\"]},\"hands-on experience\": {\"term\": \"hands-on experience\",\"def\": \"Practical experience of actually doing something, not only studying it.\",\"example\": \"The summer job gave me hands-on experience of working with customers.\",\"fi\": \"käytännön kokemus\",\"mods\": [\"situations\"]},\"notice period\": {\"term\": \"notice period\",\"def\": \"The time you must keep working after you say you are leaving a job.\",\"example\": \"My notice period is one month, so I could start in June.\",\"fi\": \"irtisanomisaika\",\"mods\": [\"situations\"]},\"get back to someone\": {\"term\": \"to get back to someone\",\"def\": \"To reply to someone later with an answer.\",\"example\": \"They said they would get back to me by the end of the week.\",\"fi\": \"palata asiaan, vastata myöhemmin\",\"mods\": [\"situations\"]},\"trade fair\": {\"term\": \"trade fair\",\"def\": \"A large event where companies show their products to possible customers and partners.\",\"example\": \"We are taking a stand at the trade fair in Helsinki in n class=\"quiz-bar\"><span class=\"quiz-bar-fill\" style=\"width:' + pct + '%\"><\u002Fspan><\u002Fspan><\u002Fdiv>' +\n      '<div class=\"quiz-q\">' + esc(q.q) + '<\u002Fdiv>' +\n      '<div class=\"quiz-opts\">' + shown.map(function (o, j) {\n        return '<button type=\"button\" class=\"quiz-opt\" data-j=\"' + j + '\">' + esc(o) + '<\u002Fbutton>';\n      }).join('') + '<\u002Fdiv><div class=\"quiz-fb\" id=\"q-fb\"><\u002Fdiv>';\n    card.querySelectorAll('.quiz-opt').forEach(function (b) {\n      b.addEventListener('click', function () {\n        var ok = shown[b.dataset.j] === q.answer;\n        if (ok) qScore++; else qMissed.push(entry);\n        card.querySelectorAll('.quiz-opt').forEach(function (x) {\n          x.disabled = true;\n          if (shown[x.dataset.j] === q.answer) x.classList.add('correct');\n          else if (x === b) x.classList.add('wrong');\n        });\n        var fb = $('q-fb');\n        fb.className = 'quiz-fb ' + (ok ? 'ok' : 'bad');\n        fb.innerHTML = '<strong>' + (ok ? 'Correct.' : 'Not quite.') + '<\u002Fstrong> ' + esc(q.rationale) +\n          '<div class=\"btn-next\"><button class=\"btn-primary\" id=\"q-next\">' +\n          (qi === qList.length - 1 ? 'See result' : 'Next \\u2192') + '<\u002Fbutton><\u002Fdiv>';\n        $('q-next').addEventListener('click', function () { qi++; renderQ(); });\n      });\n    });\n  }\n  $('quiz-start').addEventListener('click', startQuiz);\n  (function () {\n    var pCard = document.getElementById('practice-bmc-card');\n    if (!pCard) return;\n    var pList = [], pi = 0, pScore = 0, pMissed = [];\n    function pStart() {\n      pList = (DATA.PRACTICE && DATA.PRACTICE['practice-bmc'] || []).slice();\n      pList.sort(function () { return Math.random() - 0.5; });\n      pi = 0; pScore = 0; pMissed = [];\n      pRender();\n    }\n    function pRender() {\n      if (pi >= pList.length) {\n        var pct = Math.round(pScore / pList.length * 100);\n        var msg = pct >= 85 ? 'Very good. You know the nine blocks well.'\n          : pct >= 60 ? 'A good result. Look again at the blocks you mixed up.'\n            : 'Worth clicking through the nine blocks above before you try again.';\n        pCard.innerHTML = '<div class=\"score-box\"><div class=\"n\">' + pScore + ' / ' + pList.length + '<\u002Fdiv><p>' + msg + '<\u002Fp>' +\n          '<div class=\"btn-row\">' +\n          (pMissed.length ? '<button type=\"button\" class=\"btn-primary\" id=\"pb-missed\">Retry the ' + pMissed.length + ' I missed<\u002Fbutton>' : '') +\n          '<button type=\"button\" class=\"' + (pMissed.length ? 'btn-ghost' : 'btn-primary') + '\" id=\"pb-again\">Start again<\u002Fbutton>' +\n          '<\u002Fdiv><\u002Fdiv>' + reviewHtml(pMissed.map(function (q) { return { q: q, mod: null }; }));\n        document.getElementById('pb-again').addEventListener('click', pStart);\n        if (document.getElementById('pb-missed')) document.getElementById('pb-missed').addEventListener('click', function () {\n          pList = pMissed.slice();\n          pi = 0; pScore = 0; pMissed = [];\n          pRender();\n        });\n        return;\n      }\n      var q = pList[pi];\n      var pct = Math.round((pi + 1) / pList.length * 100);\n      var shown = q.options.slice().sort(function () { return Math.random() - 0.5; });\n      pCard.innerHTML =\n        '<div class=\"quiz-meta\"><span>Question ' + (pi + 1) + ' of ' + pList.length + ' &middot; score ' + pScore + '<\u002Fspan>' +\n        '<span class=\"quiz-bar\"><span class=\"quiz-bar-fill\" style=\"width:' + pct + '%\"><\u002Fspan><\u002Fspan><\u002Fdiv>' +\n        '<div class=\"quiz-q\">' + esc(q.q) + '<\u002Fdiv>' +\n        '<div class=\"quiz-opts\">' + shown.map(function (o, j) {\n          return '<button type=\"button\" class=\"quiz-opt\" data-j=\"' + j + '\">' + esc(o) + '<\u002Fbutton>';\n        }).join('') + '<\u002Fdiv><div class=\"quiz-fb\" id=\"pb-fb\"><\u002Fdiv>';\n      pCard.querySelectorAll('.quiz-opt').forEach(function (b) {\n        b.addEventListener('click', function () {\n          var ok = shown[b.dataset.j] === q.answer;\n          if (ok) pScore++; else pMissed.push(q);\n          pCard.querySelectorAll('.quiz-opt').forEach(function (x) {\n            x.disabled = true;\n            if (shown[x.dataset.j] === q.answer) x.classList.add('correct');\n            else if (x === b) x.classList.add('wrong');\n          });\n          var fb = document.getElementById('pb-fb');\n          fb.className = 'quiz-fb ' + (ok ? 'ok' : 'bad');\n          fb.innerHTML = '<strong>' + (ok ? 'Correct.' : 'Not quite.') + '<\u002Fstrong> ' + esc(q.rationale) +\n            '<div class=\"btn-next\"><button type=\"button\" class=\"btn-primary\" id=\"pb-next\">' +\n            (pi === pList.length - 1 ? 'See result' : 'Next \\u2192') + '<\u002Fbutton><\u002Fdiv>';\n          document.getElementById('pb-next').addEventListener('click', function () { pi++; pRender(); });\n        });\n      });\n    }\n    document.getElementById('practice-bmc-start').addEventListener('click', pStart);\n  })();\n\n  /* ── register-style exercises (one per module that has one) ──────── */\n  MODULES.forEach(function (m) {\n    if (!m.exercise || m.exercise.kind !== 'register') return;\n    var host = $('reg-' + m.id);\n    if (!host) return;\n    var idx = 0, answered = false;\n    function render() {\n      if (idx >= m.exercise.items.length) {\n        host.innerHTML = '<div class=\"score-box\"><div class=\"n\">Done<\u002Fdiv>' +\n          '<p>You have worked through all ' + m.exercise.items.length + ' sentences.<\u002Fp>' +\n          '<div class=\"btn-row\"><button class=\"btn-primary\" id=\"rg-' + m.id + '\">Start again<\u002Fbutton><\u002Fdiv><\u002Fdiv>';\n        $('rg-' + m.id).addEventListener('click', function () { idx = 0; render(); });\n        return;\n      }\n      var it = m.exercise.items[idx];\n      answered = false;\n      var pct = Math.round((idx + 1) / m.exercise.items.length * 100);\n      host.innerHTML =\n        '<div class=\"quiz-meta\"><span>' + (idx + 1) + ' of ' + m.exercise.items.length + '<\u002Fspan>' +\n        '<span class=\"quiz-bar\"><span class=\"quiz-bar-fill\" style=\"width:' + pct + '%\"><\u002Fspan><\u002Fspan><\u002Fdiv>' +\n        '<div class=\"reg-casual\"><span class=\"reg-label\">' + m.exercise.lead + '<\u002Fspan>\\u201C' + esc(it.casual) + '\\u201D<\u002Fdiv>' +\n        '<p style=\"font-weight:700;margin-bottom:12px;\">' + m.exercise.ask + '<\u002Fp>' +\n        '<div class=\"quiz-opts\" id=\"rgo-' + m.id + '\"><\u002Fdiv><div class=\"quiz-fb\" id=\"rgf-' + m.id + '\"><\u002Fdiv>';\n      var box = $('rgo-' + m.id);\n      it.options.slice().sort(function () { return Math.random() - 0.5; }).forEach(function (opt) {\n        var b = document.createElement('button');\n        b.type = 'button'; b.className = 'quiz-opt'; b.textContent = opt;\n        b.addEventListener('click', function () {\n          if (answered) return;\n          answered = true;\n          var ok = opt === it.answer;\n          box.querySelectorAll('.quiz-opt').forEach(function (x) {\n            x.disabled = true;\n            if (x.textContent === it.answer) x.classList.add('correct');\n            else if (x === b) x.classList.add('wrong');\n          });\n          var fb = $('rgf-' + m.id);\n          fb.className = 'quiz-fb ' + (ok ? 'ok' : 'bad');\n          fb.innerHTML = '<strong>' + (ok ? 'Yes.' : 'The better version is: \\u201C' + esc(it.answer) + '\\u201D') + '<\u002Fstrong> ' +\n            esc(it.rationale) + '<div class=\"btn-next\"><button class=\"btn-primary\" id=\"rgn-' + m.id + '\">Next \\u2192<\u002Fbutton><\u002Fdiv>';\n          $('rgn-' + m.id).addEventListener('click', function () { idx++; render(); });\n        });\n        box.appendChild(b);\n      });\n    }\n    render();\n  });\n\n  /* ── search across the whole coursebook ─────────────────────────── */\n  var SEARCH = [];\n  MODULES.forEach(function (m) {\n    SEARCH.push({ type: 'module', title: m.num + '. ' + m.title, text: m.sub, where: 'Module', view: 'm-' + m.id });\n    m.sections.forEach(function (sec) {\n      sec.items.forEach(function (it) {\n        var bits = [it.description || ''];\n        ['when', 'points', 'questions', 'phrases'].forEach(function (f) { if (it[f]) bits = bits.concat(it[f]); });\n        if (it.example) bits.push(it.example);\n        (it.vocab || []).forEach(function (k) {\n          var v = VOCAB[k];\n          if (v) bits.push(v.term + (v.def ? ' \\u2014 ' + v.def : '') + (v.fi ? ' (' + v.fi + ')' : ''));\n        });\n        SEARCH.push({\n          type: 'topic', title: it.name, text: bits.join(' \\u00b7 '),\n          where: m.num + '. ' + m.title + ' \\u00b7 ' + sec.label, key: m.id + '::' + it.name\n        });\n      });\n    });\n  });\n  (function () {\n    var seen = [];\n    Object.keys(VOCAB).forEach(function (k) {\n      var v = VOCAB[k];\n      if (!v || !v.def || seen.indexOf(v.term) !== -1) return;\n      seen.push(v.term);\n      var mm = MODULES.filter(function (x) { return x.id === v.mods[0]; })[0];\n      SEARCH.push({\n        type: 'word', title: v.term,\n        text: v.def + (v.example ? ' \\u00b7 ' + v.example : '') + (v.fi ? ' \\u00b7 FI: ' + v.fi : ''),\n        where: 'Word' + (mm ? ' \\u00b7 module ' + mm.num : ''), word: v.term\n      });\n    });\n  })();\n\n  function snippet(text, q) {\n    text = String(text || '');\n    var at = text.toLowerCase().indexOf(q);\n    if (at === -1) return esc(text.slice(0, 130)) + (text.length > 130 ? '\\u2026' : '');\n    var from = Math.max(0, at - 55), to = Math.min(text.length, at + q.length + 95);\n    return (from > 0 ? '\\u2026' : '') + esc(text.slice(from, at)) +\n      '<mark>' + esc(text.slice(at, at + q.length)) + '<\u002Fmark>' +\n      esc(text.slice(at + q.length, to)) + (to < text.length ? '\\u2026' : '');\n  }\n\n  var GROUPS = [\n    { type: 'module', label: 'Modules' },\n    { type: 'topic', label: 'Topics' },\n    { type: 'word', label: 'Words' }\n  ];\n\n  function runSearch() {\n    var q = ($('gs-input').value || '').toLowerCase().trim();\n    if (q.length < 2) {\n      $('gs-body').innerHTML = '<div class=\"panel\">Type at least two letters to search. The search covers module titles, topic names, key points, phrases, examples and the whole EN&ndash;FI word list.<\u002Fdiv>';\n      $('gs-count').textContent = '';\n      return;\n    }\n    var hits = SEARCH.filter(function (r) { return (r.title + ' ' + r.text).toLowerCase().indexOf(q) !== -1; });\n    hits.sort(function (a, b) {\n      var at = a.title.toLowerCase().indexOf(q) !== -1 ? 0 : 1;\n      var bt = b.title.toLowerCase().indexOf(q) !== -1 ? 0 : 1;\n      return at - bt;\n    });\n    var out = '';\n    GROUPS.forEach(function (g) {\n      var rows = hits.filter(function (r) { return r.type === g.type; });\n      if (!rows.length) return;\n      var capped = rows.slice(0, 40);\n      out += '<div class=\"gs-group\"><div class=\"gs-glabel\">' + g.label + ' \\u00b7 ' + rows.length + '<\u002Fdiv>' +\n        capped.map(function (r) {\n          var attr = r.key ? ' data-key=\"' + esc(r.key) + '\"' : (r.view ? ' data-goto=\"' + esc(r.view) + '\"' : ' data-word=\"' + esc(r.word) + '\"');\n          var body = r.title.toLowerCase().indexOf(q) !== -1 ? snippet(r.title, q) : esc(r.title);\n          return '<button type=\"button\" class=\"gs-hit\"' + attr + '>' +\n            '<span class=\"gs-where\">' + esc(r.where) + '<\u002Fspan>' +\n            '<span class=\"gs-title\">' + body + '<\u002Fspan>' +\n            '<span class=\"gs-snip\">' + snippet(r.text, q) + '<\u002Fspan><\u002Fbutton>';\n        }).join('') +\n        (rows.length > capped.length ? '<div class=\"kw-count\">Showing the first ' + capped.length + ' of ' + rows.length + ' \\u2014 add another letter to narrow it down.<\u002Fdiv>' : '') +\n        '<\u002Fdiv>';\n    });\n    $('gs-body').innerHTML = out || '<div class=\"panel\">Nothing in the coursebook matches that.<\u002Fdiv>';\n    $('gs-count').textContent = hits.length + ' result' + (hits.length === 1 ? '' : 's');\n  }\n  $('gs-input').addEventListener('input', runSearch);\n  $('gs-body').addEventListener('click', function (e) {\n    var b = e.target.closest ? e.target.closest('.gs-hit') : null;\n    if (!b) return;\n    if (b.dataset.key) { openItem(b.dataset.key); return; }\n    if (b.dataset.goto) { showView(b.dataset.goto); return; }\n    if (b.dataset.word) {\n      $('kw-search').value = b.dataset.word;\n      $('kw-filter').value = 'all';\n      showView('keywords');\n    }\n  });\n  runSearch();\n\n  /* ── printable appendix: the whole book in one flow ──────────────── */\n  var printBuilt = false;\n  function buildPrintBook() {\n    if (printBuilt) return;\n    var out = '<div class=\"pb-cover\"><h1>English for Business<\u002Fh1>' +\n      '<p class=\"pb-sub\">Coursebook \\u00b7 Language Centre, LAB University of Applied Sciences<\u002Fp>' +\n      '<p class=\"pb-credit\">Designed by Hamid Guedra. Printed from the online coursebook \\u2014 the interactive exercises and quizzes are in the web version.<\u002Fp><\u002Fdiv>';\n    MODULES.forEach(function (m) {\n      out += '<div class=\"pb-module\"><h2>' + m.num + '. ' + esc(m.title) + '<\u002Fh2>' +\n        '<p class=\"pb-msub\">' + esc(m.sub) + '<\u002Fp>';\n      (m.intro || []).forEach(function (h) { out += '<div class=\"pb-intro\">' + h + '<\u002Fdiv>'; });\n      m.sections.forEach(function (sec) {\n        out += '<h3 class=\"pb-sec\">' + esc(sec.label) + '<\u002Fh3>';\n        sec.items.forEach(function (it) {\n          out += '<div class=\"pb-item\"><h4>' + esc(it.name) + '<\u002Fh4>' + itemBodyHtml(it, true) + '<\u002Fdiv>';\n        });\n      });\n      out += '<\u002Fdiv>';\n    });\n    out += '<div class=\"pb-module\"><h2>Keywords EN\\u2013FI<\u002Fh2>' +\n      '<p class=\"pb-msub\">Each term is listed in the module that introduces it.<\u002Fp>';\n    MODULES.forEach(function (m) {\n      var keys = [];\n      m.sections.forEach(function (sec) {\n        sec.items.forEach(function (it) {\n          (it.vocab || []).forEach(function (k) {\n            var v = VOCAB[k];\n            if (!v || !v.def || v.mods[0] !== m.id) return;\n            if (keys.indexOf(k) === -1) keys.push(k);\n          });\n        });\n      });\n      if (!keys.length) return;\n      keys.sort(function (a, b) { return a.localeCompare(b); });\n      out += '<h3 class=\"pb-sec\">' + m.num + '. ' + esc(m.title) + '<\u002Fh3>' +\n        '<table class=\"pb-table\"><thead><tr><th>English<\u002Fth><th>Suomi<\u002Fth><\u002Ftr><\u002Fthead><tbody>' +\n        keys.map(function (k) {\n          var v = VOCAB[k];\n          return '<tr><td>' + esc(v.term) + '<\u002Ftd><td>' + (v.fi ? esc(v.fi) : '\\u2013') + '<\u002Ftd><\u002Ftr>';\n        }).join('') + '<\u002Ftbody><\u002Ftable>';\n    });\n    out += '<\u002Fdiv>';\n    $('print-book').innerHTML = out;\n    printBuilt = true;\n  }\n  window.addEventListener('beforeprint', buildPrintBook);\n  if ($('print-btn')) {\n    $('print-btn').addEventListener('click', function () {\n      buildPrintBook();\n      setTimeout(function () { window.print(); }, 80);\n    });\n  }\n\n  showView('start');\n})();\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
