ly recorded in the minutes?\",\"options\": [\"The attendees\",\"The decisions and action points\",\"The date of the next meeting\",\"What each person was wearing\"],\"answer\": \"What each person was wearing\",\"rationale\": \"The minutes are an official record: who was there, what was discussed and decided, what needs further action, and when the group meets next.\"},{\"q\": \"What is an agenda?\",\"options\": [\"The written record of a meeting\",\"The list of topics for a meeting\",\"The room where a meeting takes place\",\"A vote at the end of a meeting\"],\"answer\": \"The list of topics for a meeting\",\"rationale\": \"The agenda is sent before the meeting and lists the topics in order, often with a time for each.\"},{\"q\": \"Who chairs a meeting?\",\"options\": [\"The person who takes notes\",\"The person who leads the meeting\",\"The newest person in the team\",\"The person who arrives first\"],\"answer\": \"The person who leads the meeting\",\"rationale\": \"The chair opens and closes the meeting, gives people the turn to speak, and keeps to the agenda and the time.\"},{\"q\": \"In a meeting, what are the 'minutes'?\",\"options\": [\"The time each item takes\",\"The written record of the meeting\",\"The break in the middle\",\"The list of people invited\"],\"answer\": \"The written record of the meeting\",\"rationale\": \"The minutes record who attended, what was decided, and who will do what. They are usually sent out within a day or two.\"},{\"q\": \"What does AOB stand for?\",\"options\": [\"All of the budget\",\"Any other business\",\"Agenda or break\",\"Action on behalf\"],\"answer\": \"Any other business\",\"rationale\": \"AOB is usually the last item. It gives people a short chance to raise small topics that were not on the agenda.\"},{\"q\": \"Which is the most polite way to disagree in a meeting?\",\"options\": [\"I see your point, but I'm not sure that would work.\",\"With respect, I think you have misunderstood the figures.\",\"I understand what you mean, but that is simply not correct.\",\"I disagree with that, and I would like to explain why.\"],\"answer\": \"I see your point, but I'm not sure that would work.\",\"rationale\": \"All four sound polite on the surface. Only the first softens the disagreement itself. “Not correct” and “you have misunderstood” still tell the other person they are wrong, and “with respect” often signals the opposite.\"},{\"q\": \"What does 'Let's park that' mean?\",\"options\": [\"Let's stop the meeting now\",\"Let's discuss it later\",\"Let's vote on it now\",\"Let's delete it from the agenda\"],\"answer\": \"Let's discuss it later\",\"rationale\": \"To park a topic means to leave it for now and come back to it later, often at the end of the meeting.\"},{\"q\": \"A good action point includes …\",\"options\": [\"a task, a person, and a deadline\",\"a task and a deadline\",\"a task and the person who suggested it\",\"a task, a deadline, and the reason for it\"],\"answer\": \"a task, a person, and a deadline\",\"rationale\": \"All four contain a task. Without a named person, nobody owns it; without a deadline, nothing moves. The person who suggested it and the reason are useful, but they are not what makes the action happen.\"},{\"q\": \"When does the chair say 'All those in favour?'\",\"options\": [\"When opening the meeting\",\"When the group votes on a proposal\",\"When someone arrives late\",\"When closing the meeting\"],\"answer\": \"When the group votes on a proposal\",\"rationale\": \"“In favour” means supporting the proposal. The chair then usually asks “Anyone against?”\"},{\"q\": \"Which phrase moves the meeting to the next topic?\",\"options\": [\"Sorry to interrupt.\",\"Shall we move on?\",\"Could you clarify?\",\"I'm afraid I disagree.\"],\"answer\": \"Shall we move on?\",\"rationale\": \"“Shall we move on?” is the standard way to close one item and begin the next.\"},{\"q\": \"You want to speak while someone else is talking. What do you say?\",\"options\": [\"Sorry to interrupt, but …\",\"Could I come back to that in a moment?\",\"Can I just say something here?\",\"If I may add one point …\"],\"answer\": \"Sorry to interrupt, but …\",\"rationale\": \"The first names the interruption and apologises for it in the same breath, which is the standard formula. The second postpones your point instead of making it. The third and fourth interrupt without acknowledging that you are doing so.\"},{\"q\": \"When should the minutes be sent out?\",\"options\": [\"Only if someone asks\",\"Just before the next meeting\",\"Soon after the meeting, usually within a day or two\",\"At the end of the month\"],\"answer\": \"Soon after the meeting, usually within a day or two\",\"rationale\": \"People need the minutes quickly, so that they remember the decisions and start on their action points.\"},{\"q\": \"What is 'To sum up' used for?\",\"options\": [\"To start the meeting\",\"To give a short summary at the end\",\"To ask for a break\",\"To introduce a new person\"],\"answer\": \"To give a short summary at the end\",\"rationale\": \"The chair uses “to sum up” or “to recap” to repeat the main decisions and action points before closing.\"},{\"q\": \"An action point reads: “Improve the customer feedback process by the end of the quarter.” What is missing?\",\"options\": [\"A named person\",\"A deadline\",\"A reason\",\"A description of the task\"],\"answer\": \"A named person\",\"rationale\": \"It has a task and a deadline, but nobody owns it. An action point without a name is the most common reason work does not start.\"},{\"q\": \"You are chairing. One person has spoken for most of the meeting and two have said nothing. What is the best move?\",\"options\": [\"Invite the quiet people to speak, by name\",\"Wait, because people speak when they have something to say\",\"Ask the talkative person to let somebody else have a turn\",\"Move on to the next item in order to save the group time\"],\"answer\": \"Invite the quiet people to speak, by name\",\"rationale\": \"Chairing means managing who has the floor. A direct invitation is the standard tool. Waiting rarely works, and stopping the talkative person in public costs them face without helping the others.\"},{\"q\": \"In the minutes, which of these should be recorded most carefully?\",\"options\": [\"The decisions, and who does what next\",\"Everything that each person said, in the order they said it\",\"The chair's own view of how the discussion went\",\"The length of time that each agenda item took up\"],\"answer\": \"The decisions, and who does what next\",\"rationale\": \"Minutes are a record for action, not a transcript. Decisions and action points are what people return to; a word-by-word account buries them.\"}]},{\"id\": \"charts\",\"num\": 4,\"title\": \"Charts, graphs and data\",\"sub\": \"Choosing the right visual, and describing it in English\",\"intro\": [\"<strong>Showing information, not just telling it.<\u002Fstrong> Reports, presentations and pitches are full of charts. A reader who would skip a paragraph of figures will look at a chart and understand it in a second — but only if you chose the right one, and only if you say what it means. You will need both skills for your business plan report and your pitch, where one good chart can carry a whole argument.\",\"<strong>Two skills, not one.<\u002Fstrong> The first half of this module is about choosing: which chart answers which kind of question. The second half is the English: the verbs, adverbs and sentence patterns you need to describe what a chart shows.\",\"<strong>How to use:<\u002Fstrong> Read the first card, then the seven chart types, then the two cards on choosing and describing. Finish with the exercise at the bottom of the page.\"],\"sections\": [{\"label\": \"Ten things to know about charts\",\"items\": [{\"name\": \"What charts and diagrams do\",\"icon\": \"\",\"sub\": \"\",\"num\": 1,\"full\": true,\"img\": \"<svg viewBox=\\\"0 0 420 250\\\" xmlns=\\\"http://www.w3.org/2000/svg\\\" role=\\\"img\\\" width=\\\"100%\\\" style=\\\"max-width:420px;height:auto;display:block;margin:0 auto;\\\"><text x=\\\"48\\\" y=\\\"20\\\" font-size=\\\"13\\\" font-weight=\\\"700\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">Sales by country, 2025 (€ million)<\u002Ftext><line x1=\\\"48\\\" y1=\\\"205.0\\\" x2=\\\"400\\\" y2=\\\"205.0\\\" stroke=\\\"#e0e0e0\\\" stroke-width=\\\"1\\\"/><text x=\\\"42\\\" y=\\\"209.0\\\" text-anchor=\\\"end\\\" font-size=\\\"10\\\" fill=\\\"#9aa0a6\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">0<\u002Ftext><line x1=\\\"48\\\" y1=\\\"155.0\\\" x2=\\\"400\\\" y2=\\\"155.0\\\" stroke=\\\"#e0e0e0\\\" stroke-width=\\\"1\\\"/><text x=\\\"42\\\" y=\\\"159.0\\\" text-anchor=\\\"end\\\" font-size=\\\"10\\\" fill=\\\"#9aa0a6\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">50<\u002Ftext><line x1=\\\"48\\\" y1=\\\"105.0\\\" x2=\\\"400\\\" y2=\\\"105.0\\\" stroke=\\\"#e0e0e0\\\" stroke-width=\\\"1\\\"/><text x=\\\"42\\\" y=\\\"109.0\\\" text-anchor=\\\"end\\\" font-size=\\\"10\\\" fill=\\\"#9aa0a6\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">100<\u002Ftext><line x1=\\\"48\\\" y1=\\\"55.0\\\" x2=\\\"400\\\" y2=\\\"55.0\\\" stroke=\\\"#e0e0e0\\\" stroke-width=\\\"1\\\"/><text x=\\\"42\\\" y=\\\"59.0\\\" text-anchor=\\\"end\\\" font-size=\\\"10\\\" fill=\\\"#9aa0a6\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">150<\u002Ftext><line x1=\\\"48\\\" y1=\\\"205\\\" x2=\\\"400\\\" y2=\\\"205\\\" stroke=\\\"#1a1a1a\\\" stroke-width=\\\"1.5\\\"/><line x1=\\\"48\\\" y1=\\\"205\\\" x2=\\\"48\\\" y2=\\\"25\\\" stroke=\\\"#1a1a1a\\\" stroke-width=\\\"1.5\\\"/><rect x=\\\"66\\\" y=\\\"55\\\" width=\\\"44\\\" height=\\\"150\\\" fill=\\\"#069494\\\"/><text x=\\\"88\\\" y=\\\"222\\\" text-anchor=\\\"middle\\\" font-size=\\\"11\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">DE<\u002Ftext><rect x=\\\"132\\\" y=\\\"75\\\" width=\\\"44\\\" height=\\\"130\\\" fill=\\\"#E8871E\\\"/><text x=\\\"154\\\" y=\\\"222\\\" text-anchor=\\\"middle\\\" font-size=\\\"11\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">FR<\u002Ftext><rect x=\\\"198\\\" y=\\\"93\\\" width=\\\"44\\\" height=\\\"112\\\" fill=\\\"#5B4B8A\\\"/><text x=\\\"220\\\" y=\\\"222\\\" text-anchor=\\\"middle\\\" font-size=\\\"11\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">FI<\u002Ftext><rect x=\\\"264\\\" y=\\\"117\\\" width=\\\"44\\\" height=\\\"88\\\" fill=\\\"#2E86AB\\\"/><text x=\\\"286\\\" y=\\\"222\\\" text-anchor=\\\"middle\\\" font-size=\\\"11\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">SE<\u002Ftext><rect x=\\\"330\\\" y=\\\"147\\\" width=\\\"44\\\" height=\\\"58\\\" fill=\\\"#6A994E\\\"/><text x=\\\"352\\\" y=\\\"222\\\" text-anchor=\\\"middle\\\" font-size=\\\"11\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">PT<\u002Ftext><text x=\\\"48\\\" y=\\\"242\\\" font-size=\\\"10\\\" fill=\\\"#9aa0a6\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">Source: company records<\u002Ftext><text x=\\\"318\\\" y=\\\"20\\\" font-size=\\\"10\\\" font-weight=\\\"700\\\" fill=\\\"#C0392B\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">← title<\u002Ftext><text x=\\\"16\\\" y=\\\"118\\\" font-size=\\\"10\\\" font-weight=\\\"700\\\" fill=\\\"#C0392B\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\" transform=\\\"rotate(-90 16,118)\\\">value axis<\u002Ftext><text x=\\\"352\\\" y=\\\"222\\\" font-size=\\\"10\\\" font-weight=\\\"700\\\" fill=\\\"#C0392B\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">← labels<\u002Ftext><text x=\\\"232\\\" y=\\\"242\\\" font-size=\\\"10\\\" font-weight=\\\"700\\\" fill=\\\"#C0392B\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">← source<\u002Ftext><\u002Fsvg>\",\"description\": \"A chart turns numbers into a picture. A reader who would skip a paragraph of figures will look at a chart, understand the shape of the data in a second, and remember it. In business writing you will meet charts constantly — in reports, in presentations, and in every pitch.\",\"points\": [\"A chart shows a pattern the reader can see at a glance: a comparison, a trend, a proportion, or a relationship\",\"A diagram shows a structure or a process rather than numbers\",\"Every chart needs a title, labelled axes or sections, and a source\",\"The chart shows the pattern; your sentence says what it means\",\"Never let the reader work out the point on their own — write it under the chart\",\"If the data is simple enough for one sentence, use the sentence\"],\"when\": null,\"questions\": null,\"phrases\": null,\"example\": \"Under the chart above: “Figure 2. Sales by country, 2025 (€ million). Source: company records. Germany sold more than twice as much as Portugal, despite having a smaller sales team.”\",\"vocab\": [\"chart\",\"diagram\",\"data\",\"figure\",\"at a glance\",\"axis\",\"label\",\"source\"]},{\"name\": \"Bar charts\",\"icon\": \"\",\"sub\": \"\",\"num\": 2,\"full\": false,\"img\": \"<svg viewBox=\\\"0 0 420 250\\\" xmlns=\\\"http://www.w3.org/2000/svg\\\" role=\\\"img\\\" width=\\\"100%\\\" style=\\\"max-width:420px;height:auto;display:block;margin:0 auto;\\\"><text x=\\\"48\\\" y=\\\"20\\\" font-size=\\\"12\\\" font-weight=\\\"700\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">Sales by country (€ million)<\u002Ftext><line x1=\\\"48\\\" y1=\\\"205.0\\\" x2=\\\"400\\\" y2=\\\"205.0\\\" stroke=\\\"#e0e0e0\\\" stroke-width=\\\"1\\\"/><text x=\\\"42\\\" y=\\\"209.0\\\" text-anchor=\\\"end\\\" font-size=\\\"10\\\" fill=\\\"#9aa0a6\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">0<\u002Ftext><line x1=\\\"48\\\" y1=\\\"163.0\\\" x2=\\\"400\\\" y2=\\\"163.0\\\" stroke=\\\"#e0e0e0\\\" stroke-width=\\\"1\\\"/><text x=\\\"42\\\" y=\\\"167.0\\\" text-anchor=\ [\"Use it to compare things that are not connected in a sequence\",\"The bars can run up the page or across it — horizontal bars suit long category names\",\"Order the bars by size unless the categories have a natural order\",\"Start the value axis at zero, or the differences look bigger than they are\",\"A grouped bar chart compares two sets side by side, for example this year and last year\"],\"when\": null,\"questions\": null,\"phrases\": null,\"example\": \"“The bar chart compares sales in five countries. Germany had the highest figure at 4.2 million euros, roughly twice the total for Portugal.”\",\"vocab\": [\"bar chart\",\"category\",\"vertical\",\"horizontal\",\"compare\",\"the highest / the lowest\"]},{\"name\": \"Line graphs\",\"icon\": \"\",\"sub\": \"\",\"num\": 3,\"full\": false,\"img\": \"<svg viewBox=\\\"0 0 420 250\\\" xmlns=\\\"http://www.w3.org/2000/svg\\\" role=\\\"img\\\" width=\\\"100%\\\" style=\\\"max-width:420px;height:auto;display:block;margin:0 auto;\\\"><text x=\\\"48\\\" y=\\\"20\\\" font-size=\\\"12\\\" font-weight=\\\"700\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">Website visitors, two products<\u002Ftext><line x1=\\\"48\\\" y1=\\\"205.0\\\" x2=\\\"400\\\" y2=\\\"205.0\\\" stroke=\\\"#e0e0e0\\\" stroke-width=\\\"1\\\"/><text x=\\\"42\\\" y=\\\"209.0\\\" text-anchor=\\\"end\\\" font-size=\\\"10\\\" fill=\\\"#9aa0a6\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">0<\u002Ftext><line x1=\\\"48\\\" y1=\\\"147.5\\\" x2=\\\"400\\\" y2=\\\"147.5\\\" stroke=\\\"#e0e0e0\\\" stroke-width=\\\"1\\\"/><text x=\\\"42\\\" y=\\\"151.5\\\" text-anchor=\\\"end\\\" font-size=\\\"10\\\" fill=\\\"#9aa0a6\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">25<\u002Ftext><line x1=\\\"48\\\" y1=\\\"90.0\\\" x2=\\\"400\\\" y2=\\\"90.0\\\" stroke=\\\"#e0e0e0\\\" stroke-width=\\\"1\\\"/><text x=\\\"42\\\" y=\\\"94.0\\\" text-anchor=\\\"end\\\" font-size=\\\"10\\\" fill=\\\"#9aa0a6\\\" font-family=\\\"D \\\" font-size=\\\"9\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">A<\u002Ftext><text x=\\\"288\\\" y=\\\"221\\\" text-anchor=\\\"middle\\\" font-size=\\\"9\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">S<\u002Ftext><text x=\\\"317\\\" y=\\\"221\\\" text-anchor=\\\"middle\\\" font-size=\\\"9\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">O<\u002Ftext><text x=\\\"346\\\" y=\\\"221\\\" text-anchor=\\\"middle\\\" font-size=\\\"9\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">N<\u002Ftext><text x=\\\"375\\\" y=\\\"221\\\" text-anchor=\\\"middle\\\" font-size=\\\"9\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">D<\u002Ftext><rect x=\\\"58\\\" y=\\\"30\\\" width=\\\"10\\\" height=\\\"10\\\" fill=\\\"#069494\\\"/><text x=\\\"73\\\" y=\\\"39\\\" font-size=\\\"10\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">Product A<\u002Ftext><rect x=\\\"140\\\" y=\\\"30\\\" width=\\\"10\\\" height=\\\"10\\\" fill=\\\"#E8871E\\\"/><text x=\\\"155\\\" y=\\\"39\\\" font-size=\\\"10\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">Product B<\u002Ftext><text x=\\\"48\\\" y=\\\"240\\\" font-size=\\\"10\\\" fill=\\\"#9aa0a6\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">Time runs along the bottom — the shape is the message<\u002Ftext><\u002Fsvg>\",\"description\": \"A line graph shows how something changes over time. Points are plotted and joined with a line, so the reader sees the direction of travel: rising, falling, or staying flat. Time always runs along the bottom.\",\"points\": [\"Use it when the horizontal axis is time: days, months, quarters, years\",\"Two or three lines can be compared on one graph; more than that becomes unreadable\",\"The shape matters more than any single point — describe the trend first\",\"Mark anything that explains a sudden change, such as a launch or a price rise\",\"Also called a line chart or a line plot\"],\"when\": null,\"questions\": null,\"phrases\": null,\"example\": \"“The line graph shows visitor numbers from January to December. Numbers rose steadily until June, fluctuated over the summer, then fell sharply in November.”\",\"vocab\": [\"line graph\",\"trend\",\"plot\",\"over time\",\"fluctuate\",\"period\"]},{\"name\": \"Pie charts\",\"icon\": \"\",\"sub\": \"\",\"num\": 4,\"full\": false,\"img\": \"<svg viewBox=\\\"0 0 420 250\\\" xmlns=\\\"http://www.w3.org/2000/svg\\\" role=\\\"img\\\" width=\\\"100%\\\" style=\\\"max-width:420px;height:auto;display:block;margin:0 auto;\\\"><text x=\\\"20\\\" y=\\\"20\\\" font-size=\\\"12\\\" font-weight=\\\"700\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">Where the budget goes<\u002Ftext><path d=\\\"M 130 125 L 130.0 37.0 A 88 88 0 1 1 119.0 212.3 Z\\\" fill=\\\"#069494\\\" stroke=\\\"#ffffff\\\" stroke-width=\\\"2\\\"/><path d=\\\"M 130 125 L 119.0 212.3 A 88 88 0 0 1 46.3 152.2 Z\\\" fill=\\\"#E8871E\\\" stroke=\\\"#ffffff\\\" stroke-width=\\\"2\\\"/><path d=\\\"M 130 125 L 46.3 152.2 A 88 88 0 0 1 50.4 87.5 Z\\\" fill=\\\"#5B4B8A\\\" stroke=\\\"#ffffff\\\" stroke-width=\\\"2\\\"/><path d=\\\"M 130 125 L 50.4 87.5 A 88 88 0 0 1 87.6 47.9 Z\\\" fill=\\\"#2E86AB\\\" stroke=\\\"#ffffff\\\" stroke-width=\\\"2\\\"/><path d=\\\"M 130 125 L 87.6 47.9 A 88 88 0 0 1 130.0 37.0 Z\\\" fill=\\\"#6A994E\\\" stroke=\\\"#ffffff\\\" stroke-width=\\\"2\\\"/><rect x=\\\"252\\\" y=\\\"60\\\" width=\\\"12\\\" height=\\\"12\\\" fill=\\\"#069494\\\"/><text x=\\\"270\\\" y=\\\"70\\\" font-size=\\\"11\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">Salaries — 52%<\u002Ftext><rect x=\\\"252\\\" y=\\\"82\\\" width=\\\"12\\\" height=\\\"12\\\" fill=\\\"#E8871E\\\"/><text x=\\\"270\\\" y=\\\"92\\\" font-size=\\\"11\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">Premises — 18%<\u002Ftext><rect x=\\\"252\\\" y=\\\"104\\\" width=\\\"12\\\" height=\\\"12\\\" fill=\\\"#5B4B8A\\\"/><text x=\\\"270\\\" y=\\\"114\\\" font-size=\\\"11\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">Marketing — 12%<\u002Ftext><rect x=\\\"252\\\" y=\\\"126\\\" width=\\\"12\\\" height=\\\"12\\\" fill=\\\"#2E86AB\\\"/><text x=\\\"270\\\" y=\\\"136\\\" font-size=\\\"11\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">Software — 10%<\u002Ftext><rect x=\\\"252\\\" y=\\\"148\\\" width=\\\"12\\\" height=\\\"12\\\" fill=\\\"#6A994E\\\"/><text x=\\\"270\\\" y=\\\"158\\\" font-size=\\\"11\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">Other — 8%<\u002Ftext><text x=\\\"20\\\" y=\\\"238\\\" font-size=\\\"10\\\" fill=\\\"#9aa0a6\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">All slices add up to 100%<\u002Ftext><\u002Fsvg>\",\"description\": \"A pie chart shows how a whole is divided. Each slice is one part, and all the slices together make 100 per cent. It answers the question “how much of the total?” — not “how many?”\",\"points\": [\"Use it only for parts of one whole, and only when the parts add up to 100 per cent\",\"Keep it to about five slices — more than that and nobody can compare them\",\"Order the slices from largest to smallest\",\"If two slices are a similar size, a bar chart compares them better\",\"A pie chart cannot show change over time — use a line graph for that\"],\"when\": null,\"questions\": null,\"phrases\": null,\"example\": \"“The pie chart shows a breakdown of costs. Salaries account for just over half the total, while marketing makes up only 12 per cent.”\",\"vocab\": [\"pie chart\",\"slice\",\"proportion\",\"account for\",\"the majority\",\"breakdown\"]},{\"name\": \"Histograms\",\"icon\": \"\",\"sub\": \"\",\"num\": 5,\"full\": false,\"img\": \"<svg viewBox=\\\"0 0 420 250\\\" xmlns=\\ >0–20<\u002Ftext><rect x=\\\"110\\\" y=\\\"113.8\\\" width=\\\"58\\\" height=\\\"91.2\\\" fill=\\\"#5B4B8A\\\" stroke=\\\"#ffffff\\\" stroke-width=\\\"1\\\"/><text x=\\\"139\\\" y=\\\"221\\\" text-anchor=\\\"middle\\\" font-size=\\\"9\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">20–40<\u002Ftext><rect x=\\\"168\\\" y=\\\"56.2\\\" width=\\\"58\\\" height=\\\"148.8\\\" fill=\\\"#5B4B8A\\\" stroke=\\\"#ffffff\\\" stroke-width=\\\"1\\\"/><text x=\\\"197\\\" y=\\\"221\\\" text-anchor=\\\"middle\\\" font-size=\\\"9\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">40–60<\u002Ftext><rect x=\\\"226\\\" y=\\\"73.0\\\" width=\\\"58\\\" height=\\\"132.0\\\" fill=\\\"#5B4B8A\\\" stroke=\\\"#ffffff\\\" stroke-width=\\\"1\\\"/><text x=\\\"255\\\" y=\\\"221\\\" text-anchor=\\\"middle\\\" font-size=\\\"9\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">60–80<\u002Ftext><rect x=\\\"284\\\" y=\\\"135.4\\\" width=\\\"58\\\" height=\\\"69.6\\\" fill=\\\"#5B4B8A\\\" stroke=\\\"#ffffff\\\" stroke-width=\\\"1\\\"/><text x=\\\"313\\\" y=\\\"221\\\" text-anchor=\\\"middle\\\" font-size=\\\"9\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">80–100<\u002Ftext><rect x=\\\"342\\\" y=\\\"178.6\\\" width=\\\"58\\\" height=\\\"26.4\\\" fill=\\\"#5B4B8A\\\" stroke=\\\"#ffffff\\\" stroke-width=\\\"1\\\"/><text x=\\\"371\\\" y=\\\"221\\\" text-anchor=\\\"middle\\\" font-size=\\\"9\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">100–120<\u002Ftext><text x=\\\"48\\\" y=\\\"240\\\" font-size=\\\"10\\\" fill=\\\"#9aa0a6\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">One continuous scale — the bars touch<\u002Ftext><\u002Fsvg>\",\"description\": \"A histogram looks like a bar chart, but it is doing something different. A bar chart compares separate categories; a histogram shows how measurements are spread across a continuous scale, such as age, height, price or time. The bars touch, because the scale does not stop between them.\",\"points\": [\"Use it for measured data on a scale, not for named categories\",\"Each bar covers a range, for example 20–29 years, 30–39 years\",\"The bars touch each other; in a bar chart they do not\",\"The shape tells you where most of the values sit\",\"The ranges must all be the same width, or the picture is misleading\"],\"when\": null,\"questions\": null,\"phrases\": null,\"example\": \"“The histogram shows the distribution of order values. Most orders fall into the 40–80 euro range, and very few are above 100 euros.”\",\"vocab\": [\"histogram\",\"range\",\"distribution\",\"frequency\",\"fall into\",\"continuous\"]},{\"name\": \"Scatter plots\",\"icon\": \"\",\"sub\": \"\",\"num\": 6,\"full\": false,\"img\": \"<svg viewBox=\\\"0 0 420 250\\\" xmlns=\\\"http://www.w3.org/2000/svg\\\" role=\\\"img\\\" width=\\\"100%\\\" style=\\\"max-width:420px;height:auto;display:block;margin:0 auto;\\\"><text x=\\\"48\\\" y=\\\"20\\\" font-size=\\\"12\\\" font-weight=\\\"700\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">Price against weekly sales<\u002Ftext><line x1=\\\"48\\\" y1=\\\"205.0\\\" x2=\\\"400\\\" y2=\\\"205.0\\\" stroke=\\\"#e0e0e0\\\" stroke-width=\\\"1\\\"/><text x=\\\"42\\\" y=\\\"209.0\\\" text-anchor=\\\"end\\\" font-size=\\\"10\\\" fill=\\\"#9aa0a6\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">0<\u002Ftext><line x1=\\\"48\\\" y1=\\\"147.5\\\" x2=\\\"400\\\" y2=\\\"147.5\\\" stroke=\\\"#e0e0e0\\\" stroke-width=\\\"1\\\"/><text x=\\\"42\\\" y=\\\"151.5\\\" text-anchor=\\\"end\\\" font-size=\\\"10\\\" fill=\\\"#9aa0a6\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">25<\u002Ftext><line x1=\\\"48\\\" y1=\\\"90.0\\\" x2=\\\"400\\\" y2=\\\"90.0\\\" stroke=\\\"#e0e0e0\\\" stroke-width=\\\"1\\\"/><text x=\\\"42\\\" y=\\\"94.0\\\" text-anchor=\\\"end\\\" font-size=\\\"10\\\" fill=\\\"#9aa0a en two variables\",\"Dots rising left to right suggest a positive relationship; falling suggests a negative one\",\"A cloud with no pattern means no relationship, which is also a result\",\"A dot far from the others is an outlier, and is often the most interesting one\",\"A relationship in the data does not prove that one thing caused the other\"],\"when\": null,\"questions\": null,\"phrases\": null,\"example\": \"“The scatter plot compares price and weekly sales. There is a clear negative correlation: as the price rises, sales fall. One outlier sold well despite a high price.”\",\"vocab\": [\"scatter plot\",\"variable\",\"correlation\",\"relationship\",\"outlier\",\"cluster\"]},{\"name\": \"Venn diagrams\",\"icon\": \"\",\"sub\": \"\",\"num\": 7,\"full\": false,\"img\": \"<svg viewBox=\\\"0 0 420 250\\\" xmlns=\\\"http://www.w3.org/2000/svg\\\" role=\\\"img\\\" width=\\\"100%\\\" style=\\\"max-width:420px;height:auto;display:block;margin:0 auto;\\\"><text x=\\\"20\\\" y=\\\"20\\\" font-size=\\\"12\\\" font-weight=\\\"700\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">Two roles: what they share<\u002Ftext><circle cx=\\\"152\\\" cy=\\\"130\\\" r=\\\"86\\\" fill=\\\"#069494\\\" opacity=\\\"0.42\\\"/><circle cx=\\\"270\\\" cy=\\\"130\\\" r=\\\"86\\\" fill=\\\"#E8871E\\\" opacity=\\\"0.42\\\"/><circle cx=\\\"152\\\" cy=\\\"130\\\" r=\\\"86\\\" fill=\\\"none\\\" stroke=\\\"#069494\\\" stroke-width=\\\"2\\\"/><circle cx=\\\"270\\\" cy=\\\"130\\\" r=\\\"86\\\" fill=\\\"none\\\" stroke=\\\"#E8871E\\\" stroke-width=\\\"2\\\"/><text x=\\\"104\\\" y=\\\"122\\\" text-anchor=\\\"middle\\\" font-size=\\\"11\\\" font-weight=\\\"700\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">Sales<\u002Ftext><text x=\\\"104\\\" y=\\\"139\\\" text-anchor=\\\"middle\\\" font-size=\\\"9.5\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">driving licence<\u002Ftext><text x=\\\"318\\\" y=\\\"122\\\" text-anchor=\\\"middle\\\" font-size=\\\"11\\\" font-weight=\\\"700\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">Support<\u002Ftext><text x=\\\"318\\\" y=\\\"139\\\" text-anchor=\\\"middle\\\" font-size=\\\"9.5\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">shift work<\u002Ftext><text x=\\\"211\\\" y=\\\"124\\\" text-anchor=\\\"middle\\\" font-size=\\\"9.5\\\" font-weight=\\\"700\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">English<\u002Ftext><text x=\\\"211\\\" y=\\\"139\\\" text-anchor=\\\"middle\\\" font-size=\\\"9.5\\\" font-weight=\\\"700\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">customers<\u002Ftext><text x=\\\"20\\\" y=\\\"238\\\" font-size=\\\"10\\\" fill=\\\"#9aa0a6\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">The overlap is what the two sets have in common<\u002Ftext><\u002Fsvg>\",\"description\": \"A Venn diagram shows how groups relate to each other. Each circle is a group, called a set. Where circles overlap, the items belong to both groups. It is a diagram, not a chart — it shows relationships, not amounts.\",\"points\": [\"Each circle is a set: a group of things with something in common\",\"The overlapping part shows what the sets share\",\"Anything outside the circles belongs to neither set\",\"Two or three circles work; four is usually unreadable\",\"The size of the circles normally means nothing, so do not read amounts into it\"],\"when\": null,\"questions\": null,\"phrases\": null,\"example\": \"“The Venn diagram compares two roles. Both need customer contact and good English; only the sales role needs a driving licence.”\",\"vocab\": [\"venn diagram\",\"set\",\"overlap\",\"have in common\",\"belong to\",\"distinguish\"]},{\"name\": \"Flow charts\",\"icon\": \"\",\"sub\": \"\",\"num\": 8,\"full\": false,\"img\": \"<svg viewBox=\\\"0 0 420 250\\\" xmlns=\\\"http://www.w3.org/2000/svg\\\" role=\\\"img\\\" width=\\\"100%\\\" style=\\\"max-width:420px;height:auto;display:block;margin:0 auto;\\\"><defs><marker id=\\\"ah\\\" markerWidth=\\\"9\\\" markerHeight=\\\"9\\\" refX=\\\"8\\\" refY=\\\"3\\\" orient=\\\"auto\\\"><path d=\\\"M0,0 L0,6 L8,3 z\\\" fill=\\\"#1a1a1a\\\"/><\u002Fmarker><\u002Fdefs><text x=\\\"20\\\" y=\\\"18\\\" font-size=\\\"12\\\" font-weight=\\\"700\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">Handling an order<\u002Ftext><rect x=\\\"150\\\" y=\\\"30\\\" width=\\\"120\\\" height=\\\"34\\\" rx=\\\"17\\\" fill=\\\"#6A994E\\\"/><text x=\\\"210.0\\\" y=\\\"51.0\\\" text-anchor=\\\"middle\\\" font-size=\\\"11\\\" font-weight=\\\"700\\\" fill=\\\"#ffffff\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">Order arrives<\u002Ftext><line x1=\\\"210\\\" y1=\\\"64\\\" x2=\\\"210\\\" y2=\\\"84\\\" stroke=\\\"#1a1a1a\\\" stroke-width=\\\"1.8\\\" marker-end=\\\"url(#ah)\\\"/><rect x=\\\"150\\\" y=\\\"86\\\" width=\\\"120\\\" height=\\\"34\\\" rx=\\\"0\\\" fill=\\\"#069494\\\"/><text x=\\\"210.0\\\" y=\\\"107.0\\\" text-anchor=\\\"middle\\\" font-size=\\\"11\\\" font-weight=\\\"700\\\" fill=\\\"#ffffff\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">Check stock<\u002Ftext><line x1=\\\"210\\\" y1=\\\"120\\\" x2=\\\"210\\\" y2=\\\"138\\\" stroke=\\\"#1a1a1a\\\" stroke-width=\\\"1.8\\\" marker-end=\\\"url(#ah)\\\"/><polygon points=\\\"210,138 292,172 210,206 128,172\\\" fill=\\\"#E8871E\\\"/><text x=\\\"210\\\" y=\\\"169\\\" text-anchor=\\\"middle\\\" font-size=\\\"10\\\" font-weight=\\\"700\\\" fill=\\\"#ffffff\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">In stock?<\u002Ftext><text x=\\\"210\\\" y=\\\"183\\\" text-anchor=\\\"middle\\\" font-size=\\\"10\\\" font-weight=\\\"700\\\" fill=\\\"#ffffff\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\"><\u002Ftext><line x1=\\\"292\\\" y1=\\\"172\\\" x2=\\\"336\\\" y2=\\\"172\\\" stroke=\\\"#1a1a1a\\\" stroke-width=\\\"1.8\\\" marker-end=\\\"url(#ah)\\\"/><text x=\\\"322.0\\\" y=\\\"168.0\\\" font-size=\\\"10\\\" font-weight=\\\"700\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">yes<\u002Ftext><rect x=\\\"330\\\" y=\\\"155\\\" width=\\\"84\\\" height=\\\"34\\\" rx=\\\"0\\\" fill=\\\"#2E86AB\\\"/><text x=\\\"372.0\\\" y=\\\"176.0\\\" text-anchor=\\\"middle\\\" font-size=\\\"11\\\" font-weight=\\\"700\\\" fill=\\\"#ffffff\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">Dispatch<\u002Ftext><line x1=\\\"128\\\" y1=\\\"172\\\" x2=\\\"96\\\" y2=\\\"172\\\" stroke=\\\"#1a1a1a\\\" stroke-width=\\\"1.8\\\" marker-end=\\\"url(#ah)\\\"/><text x=\\\"120.0\\\" y=\\\"168.0\\\" font-size=\\\"10\\\" font-weight=\\\"700\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">no<\u002Ftext><rect x=\\\"14\\\" y=\\\"155\\\" width=\\\"80\\\" height=\\\"34\\\" rx=\\\"0\\\" fill=\\\"#C0392B\\\"/><text x=\\\"54.0\\\" y=\\\"176.0\\\" text-anchor=\\\"middle\\\" font-size=\\\"11\\\" font-weight=\\\"700\\\" fill=\\\"#ffffff\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">Contact<\u002Ftext><text x=\\\"20\\\" y=\\\"238\\\" font-size=\\\"10\\\" fill=\\\"#9aa0a6\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">Diamond = a decision; each answer takes a different path<\u002Ftext><\u002Fsvg>\",\"description\": \"A flow chart shows a process: what happens, in what order, and where a decision changes the path. It turns a long paragraph of instructions into something a reader can follow with a finger.\",\"points\": [\"Use it for a process, a procedure, or anything with steps in order\",\"Arrows show the direction; each box is one step\",\"A diamond marks a decision, with a different arrow for yes and for no\",\"Keep the wording in each box short — a few words, not a sentence\",\"Follow every path to the end before you publish it, including the ones that fail\"],\"when\": null,\"questions\": null,\"phrases\": null,\"example\": \"“The flow chart shows what happens when an order arrives. If the item is in stock, it goes straight to dispatch; if not, the customer is contacted within one working day.”\",\"vocab\": [\"flow chart\",\"process\",\"step\",\"decision point\",\"sequence\",\"lead to\"]},{\"name\": \"Choosing the right chart\",\"icon\": \"\",\"sub\": \"\",\"num\": 9,\"full\": false,\"img\": null,\"description\": \"The commonest mistake is not a badly drawn chart — it is the wrong chart for the question. Decide what you want the reader to see first, then choose the form that shows it.\",\"points\": [\"Comparing separate categories — bar chart\",\"Change over time — line graph\",\"Parts of one whole — pie chart\",\"How measurements are spread — histogram\",\"Relationship between two variables — scatter plot\",\"How groups overlap — Venn diagram; a process — flow chart\",\"If a sentence does the job, do not draw anything\"],\"when\": null,\"questions\": null,\"phrases\": null,\"example\": \"You want to show that the under-30s are your biggest customer group, out of four age groups. That is a comparison of separate categories, so use a bar chart — not a pie chart, and not a histogram.\",\"vocab\": [\"appropriate\",\"misleading\",\"distort\",\"scale\",\"legend\",\"caption\",\"illustrate\",\"be worth\"]},{\"name\": \"Describing a chart in English\",\"icon\": \"\",\"sub\": \"\",\"num\": 10,\"full\": false,\"img\": \"<svg viewBox=\\\"0 0 420 250\\\" xmlns=\\\"http://www.w3.org/2000/svg\\\" role=\\\"img\\\" width=\\\"100%\\\" style=\\\"max-width:420px;height:auto;display:block;margin:0 auto;\\\"><text x=\\\"48\\\" y=\\\"20\\\" font-size=\\\"12\\\" font-weight=\\\"700\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">Online orders, January–December<\u002Ftext><line x1=\\\"48\\\" y1=\\\"205.0\\\" x2=\\\"400\\\" y2=\\\"205.0\\\" stroke=\\\"#e0e0e0\\\" stroke-width=\\\"1\\\"/><text x=\\\"42\\\" y=\\\"209.0\\\" text-anchor=\\\"end\\\" font-size=\\\"10\\\" fill=\\\"#9aa0a6\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">0<\u002Ftext><line x1=\\\"48\\\" y1=\\\"147.0\\\" x2=\\\"400\\\" y2=\\\"147.0\\\" stroke=\\\"#e0e0e0\\\" stroke-width=\\\"1\\\"/><text x=\\\"42\\\" y=\\\"151.0\\\" text-anchor=\\\"end\\\" font-size=\\\"10\\\" fill=\\\"#9aa0a6\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">400<\u002Ftext><line x1=\\\"48\\\" y1=\\\"89.0\\\" x2=\\\"400\\\" y2=\\\"89.0\\\" stroke=\\\"#e0e0e0\\\" stroke-width=\\\"1\\\"/><text x=\\\"42\\\" y=\\\"93.0\\\" text-anchor=\\\"end\\\" font-size=\\\"10\\\" fill=\\\"#9aa0a6\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">800<\u002Ftext><line x1=\\\"48\\\" y1=\\\"31.0\\\" x2=\\\"400\\\" y2=\\\"31.0\\\" stroke=\\\"#e0e0e0\\\" stroke-width=\\\"1\\\"/><text x=\\\"42\\\" y=\\\"35.0\\\" text-anchor=\\\"end\\\" font-size=\\\"10\\\" fill=\\\"#9aa0a6\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">1200<\u002Ftext><line x1=\\\"48\\\" y1=\\\"205\\\" x2=\\\"400\\\" y2=\\\"205\\\" stroke=\\\"#1a1a1a\\\" stroke-width=\\\"1.5\\\"/><line x1=\\\"48\\\" y1=\\\"205\\\" x2=\\\"48\\\" y2=\\\"25\\\" stroke=\\\"#1a1a1a\\\" stroke-width=\\\"1.5\\\"/><polyline points=\\\"56,147.0 85,142.7 114,131.1 143,123.8 172,112.2 201,103.5 230,91.9 259,77.4 288,58.6 317,31.0 346,33.9 375,31.7\\\" fill=\\\"none\\\" stroke=\\\"#069494\\\" stroke-width=\\\"2.8\\\"/><circle cx=\\\"56\\\" cy=\\\"147.0\\\" r=\\\"3\\\" fill=\\\"#069494\\\"/><circle cx=\\\"85\\\" cy=\\\"142.7\\\" r=\\\"3\\\" fill=\\\"#069494\\\"/><circle cx=\\\"114\\\" cy=\\\"131.1\\\" r=\\\"3\\\" fill=\\\"#069494\\\"/><circle cx=\\\"143\\\" cy=\\\"123.8\\\" r=\\\"3\\\" fill=\\\"#069494\\\"/><circle cx=\\\"172\\\" cy=\\\"112.2\\\" r=\\\"3\\\" fill=\\\"#069494\\\"/><circle cx=\\\"201\\\" cy=\\\"103.5\\\" r=\\\"3\\\" fill=\\\"#069494\\\"/><circle cx=\\\"230\\\" cy=\\\"91.9\\\" r=\\\"3\\\" fill=\\\"#069494\\\"/><circle cx=\\\"259\\\" cy=\\\"77.4\\\" r=\\\"3\\\" fill=\\\"#069494\\\"/><circle cx=\\\"288\\\" cy=\\\"58.6\\\" r=\\\"3\\\" fill=\\\"#069494\\\"/><circle cx=\\\"317\\\" cy=\\\"31.0\\\" r=\\\"3\\\" fill=\\\"#069494\\\"/><circle cx=\\\"346\\\" cy=\\\"33.9\\\" r=\\\"3\\\" fill=\\\"#069494\\\"/><circle cx=\\\"375\\\" cy=\\\"31.7\\\" r=\\\"3\\\" fill=\\\"#069494\\\"/><text x=\\\"56\\\" y=\\\"221\\\" text-anchor=\\\"middle\\\" font-size=\\\"9\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">J<\u002Ftext><text x=\\\"85\\\" y=\\\"221\\\" text-anchor=\\\"middle\\\" font-size=\\\"9\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">F<\u002Ftext><text x=\\\"114\\\" y=\\\"221\\\" text-anchor=\\\"middle\\\" font-size=\\\"9\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">M<\u002Ftext><text x=\\\"143\\\" y=\\\"221\\\" text-anchor=\\\"middle\\\" font-size=\\\"9\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">A<\u002Ftext><text x=\\\"172\\\" y=\\\"221\\\" text-anchor=\\\"middle\\\" font-size=\\\"9\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">M<\u002Ftext><text x=\\\"201\\\" y=\\\"221\\\" text-anchor=\\\"middle\\\" font-size=\\\"9\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">J<\u002Ftext><text x=\\\"230\\\" y=\\\"221\\\" text-anchor=\\\"middle\\\" font-size=\\\"9\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">J<\u002Ftext><text x=\\\"259\\\" y=\\\"221\\\" text-anchor=\\\"middle\\\" font-size=\\\"9\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">A<\u002Ftext><text x=\\\"288\\\" y=\\\"221\\\" text-anchor=\\\"middle\\\" font-size=\\\"9\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">S<\u002Ftext><text x=\\\"317\\\" y=\\\"221\\\" text-anchor=\\\"middle\\\" font-size=\\\"9\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">O<\u002Ftext><text x=\\\"346\\\" y=\\\"221\\\" text-anchor=\\\"middle\\\" font-size=\\\"9\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">N<\u002Ftext><text x=\\\"375\\\" y=\\\"221\\\" text-anchor=\\\"middle\\\" font-size=\\\"9\\\" fill=\\\"#1a1a1a\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">D<\u002Ftext><text x=\\\"95\\\" y=\\\"150\\\" font-size=\\\"10\\\" font-weight=\\\"700\\\" fill=\\\"#E8871E\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">rose steadily<\u002Ftext><circle cx=\\\"317\\\" cy=\\\"31.0\\\" r=\\\"6\\\" fill=\\\"none\\\" stroke=\\\"#C0392B\\\" stroke-width=\\\"2\\\"/><text x=\\\"326\\\" y=\\\"27.0\\\" font-size=\\\"10\\\" font-weight=\\\"700\\\" fill=\\\"#C0392B\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">peak<\u002Ftext><text x=\\\"318\\\" y=\\\"58.5\\\" font-size=\\\"10\\\" font-weight=\\\"700\\\" fill=\\\"#5B4B8A\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">levelled off<\u002Ftext><text x=\\\"48\\\" y=\\\"240\\\" font-size=\\\"10\\\" fill=\\\"#9aa0a6\\\" font-family=\\\"DM Sans, Helvetica, Arial, sans-serif\\\">Describe the shape first, then one or two figures<\u002Ftext><\u002Fsvg>\",\"description\": \"Presenting a chart in English follows a pattern. Say what the chart shows, describe the main pattern, give one or two supporting figures, then say what it means. That last step is the one most students leave out.\",\"points\": [\"1. Introduce it: “The chart shows…”, “This graph compares…”\",\"2. Give the main pattern: “The overall trend is…”, “The clearest difference is…”\",\"3. Support it with one or two figures — not all of them\",\"4. Say what it means: “This suggests that…”, “The reason for this may be…”\",\"Verbs of change: rise, increase, grow, fall, drop, decline, peak, level off, remain stable\",\"Adverbs of degree: sharply, steadily, gradually, slightly — they go after the verb\",\"Be careful with numbers you have not checked: “roughly” and “about” are honest\"],\"when\": null,\"questions\": null,\"phrases\": null,\"example\": \"“The line graph shows online orders over twelve months. The overall trend is upward: orders rose steadily from about 400 in January to a peak of 1,200 in October, then levelled off. This suggests that the new website reached a wider audience.”\",\"vocab\": [\"rise\",\"fall\",\"peak\",\"level off\",\"remain stable\",\"sharply\",\"steadily\",\"slightly\",\"roughly\",\"suggest\"]}]}],\"exercise\": {\"kind\": \"register\",\"title\": \"Which chart?\",\"intro\": \"Read what you need to show. Then choose the chart that shows it best. In every case more than one chart could be drawn — the question is which one answers the reader’s question fastest.\",\"lead\": \"You need to show:\",\"ask\": \"Which chart or diagram should you use?\",\"items\": [{\"casual\": \"Sales figures for six different countries, side by side.\",\"options\": [\"A bar chart\",\"A pie chart\",\"A line graph\",\"A histogram\"],\"answer\": \"A bar chart\",\"rationale\": \"Six separate categories being compared. A pie chart would only work if the six countries made up one whole and you cared about the proportions rather than the amounts.\"},{\"casual\": \"How website visitor numbers changed each month last year.\",\"options\": [\"A line graph\",\"A bar chart\",\"A scatter plot\",\"A Venn diagram\"],\"answer\": \"A line graph\",\"rationale\": \"The horizontal axis is time, and you want the shape of the change. A bar chart could show the same numbers, but the trend is much harder to see.\"},{\"casual\": \"How this year's marketing budget is divided between five activities.\",\"options\": [\"A pie chart\",\"A line graph\",\"A histogram\",\"A scatter plot\"],\"answer\": \"A pie chart\",\"rationale\": \"Parts of one whole that add up to 100 per cent, and only five of them. This is exactly what a pie chart is for.\"},{\"casual\": \"Whether customers who spend longer on the site also spend more money.\",\"options\": [\"A scatter plot\",\"A bar chart\",\"A pie chart\",\"A flow chart\"],\"answer\": \"A scatter plot\",\"rationale\": \"Two variables measured for each customer, and you are looking for a relationship between them. No other chart here shows that.\"},{\"casual\": \"What happens step by step when a customer returns a product.\",\"options\": [\"A flow chart\",\"A line graph\",\"A bar chart\",\"A histogram\"],\"answer\": \"A flow chart\",\"rationale\": \"A process with steps and at least one decision point. Charts show numbers; this is a procedure, so it needs a diagram.\"},{\"casual\": \"The ages of your customers, grouped into ten-year bands.\",\"options\": [\"A histogram\",\"A bar chart\",\"A pie chart\",\"A line graph\"],\"answer\": \"A histogram\",\"rationale\": \"Age is measured on a continuous scale and the bands are ranges, so the bars touch. A bar chart is for separate named categories.\"},{\"casual\": \"Which skills two job roles share, and which belong to only one.\",\"options\": [\"A Venn diagram\",\"A bar chart\",\"A flow chart\",\"A scatter plot\"],\"answer\": \"A Venn diagram\",\"rationale\": \"Two sets with an overlap. The overlapping area is precisely the thing you want to show.\"},{\"casual\": \"One number: this year's total revenue.\",\"options\": [\"No chart — just write the number in a sentence\",\"A pie chart with one slice\",\"A bar chart with one bar\",\"A line graph\"],\"answer\": \"No chart — just write the number in a sentence\",\"rationale\": \"A chart earns its space by showing a pattern. With a single figure there is no pattern, and the chart takes longer to read than the sentence.\"}]},\"quiz\": [{\"q\": \"Which chart is best for showing how a total is divided into parts?\",\"options\": [\"A pie chart\",\"A line graph\",\"A scatter plot\",\"A histogram\"],\"answer\": \"A pie chart\",\"rationale\": \"A pie chart shows proportions of one whole. It cannot show change over time, and it cannot compare two separate totals.\"},{\"q\": \"What is the difference between a bar chart and a histogram?\",\"options\": [\"A bar chart compares categories; a histogram shows a continuous scale\",\"A histogram uses horizontal bars and a bar chart uses vertical ones\",\"A bar chart is for money and a histogram is for people\",\"There is no real difference between them\"],\"answer\": \"A bar chart compares categories; a histogram shows a continuous scale\",\"rationale\": \"This is why a histogram's bars touch and a bar chart's do not: on a histogram the scale does not stop between the bars.\"},{\"q\": \"You want to show whether price and sales are connected. Which chart?\",\"options\": [\"A scatter plot\",\"A pie chart\",\"A flow chart\",\"A Venn diagram\"],\"answer\": \"A scatter plot\",\"rationale\": \"A scatter plot places each case by two measurements at once, which is the only way to see a relationship between two variables.\"},{\"q\": \"A graph's vertical axis starts at 90 instead of 0. What is the risk?\",\"options\": [\"Small differences look far larger than they are\",\"The chart will not print correctly\",\"The data becomes incorrect\",\"The legend will not match the lines\"],\"answer\": \"Small differences look far larger than they are\",\"rationale\": \"The figures may be perfectly accurate and the picture still misleading. This is why you check the scale before you trust the shape.\"},{\"q\": \"In the sentence “Sales rose sharply in March”, what does “sharply” tell you?\",\"options\": [\"The change was quick and large\",\"The change was expected\",\"The change was permanent\",\"The change was small\"],\"answer\": \"The change was quick and large\",\"rationale\": \"Adverbs of degree grade the verb: sharply is fast and big, steadily is even, gradually is slow, slightly is small.\"},{\"q\": \"What does “to level off” mean?\",\"options\": [\"To stop rising or falling and stay about the same\",\"To fall to zero\",\"To rise very quickly\",\"To go up and down repeatedly\"],\"answer\": \"To stop rising or falling and stay about the same\",\"rationale\": \"It describes the end of a trend, not its reversal. Going up and down repeatedly is “to fluctuate”.\"},{\"q\": \"What is an outlier on a scatter plot?\",\"options\": [\"A value that is very different from all the others\",\"The highest point on the trend line\",\"A dot with no label\",\"The point where the two axes meet\"],\"answer\": \"A value that is very different from all the others\",\"rationale\": \"Outliers are worth looking at rather than ignoring — they are often the most interesting case in the set.\"},{\"q\": \"You have four numbers to report. When is a chart NOT worth using?\",\"options\": [\"When a single sentence would say it just as clearly\",\"When the numbers are large\",\"When the audience is not expert\",\"When you have no colour printer\"],\"answer\": \"When a single sentence would say it just as clearly\",\"rationale\": \"A chart earns its space by showing a pattern the reader could not get quickly from words. With very little data, the sentence wins.\"},{\"q\": \"In a Venn diagram, what does the overlapping area show?\",\"options\": [\"What the two sets have in common\",\"Which set is larger\",\"The total of both sets\",\"Items that belong to neither set\"],\"answer\": \"What the two sets have in common\",\"rationale\": \"The circle sizes normally mean nothing, so a Venn diagram shows relationships between groups, not amounts.\"},{\"q\": \"Which is the correct order for presenting a chart in English?\",\"options\": [\"Introduce it, give the main pattern, add a figure, say what it means\",\"Give every figure, then introduce the chart\",\"Say what it means, then show the numbers\",\"Read out each value from left to right\"],\"answer\": \"Introduce it, give the main pattern, add a figure, say what it means\",\"rationale\": \"Most students stop after the figures. The last step — what it means — is the part the audience actually needs.\"},{\"q\": \"What does a diamond shape usually mean in a flow chart?\",\"options\": [\"A decision point\",\"The end of the process\",\"An error\",\"A step that takes a long time\"],\"answer\": \"A decision point\",\"rationale\": \"A diamond splits the path, normally into a yes route and a no route. A box is a step; an oval is usually the start or the end.\"},{\"q\": \"Why should the slices of a pie chart be limited to about five?\",\"options\": [\"Similar slices become impossible to compare by eye\",\"Software cannot draw more than five\",\"More than five will not add up to 100 per cent\",\"Colour printers only have five colours\"],\"answer\": \"Similar slices become impossible to compare by eye\",\"rationale\": \"People are poor at judging angles. Once you have many slices of similar size, a bar chart does the comparison far better.\"},{\"q\": \"A scatter plot shows that ice cream sales and sunburn cases rise together. What can you conclude?\",\"options\": [\"They are related, but one may not have caused the other\",\"Ice cream causes sunburn\",\"Sunburn causes people to buy ice cream\",\"The data must be wrong\"],\"answer\": \"They are related, but one may not have caused the other\",\"rationale\": \"Both are probably driven by a third thing — hot weather. Correlation is a pattern in the data, not proof of a cause.\"},{\"q\": \"Which sentence describes a chart most usefully?\",\"options\": [\"Orders rose steadily to a peak in October, which suggests the new site worked.\",\"There are twelve months shown on the graph in different colours.\",\"The graph shows the numbers for each month of the year.\",\"January is 400, February is 450, March is 520, April is 560.\"],\"answer\": \"Orders rose steadily to a peak in October, which suggests the new site worked.\",\"rationale\": \"It gives the pattern and then the meaning. Listing every value, or describing the graph's appearance, leaves the audience to do the work.\"}]},{\"id\": \"canvas\",\"num\": 5,\"noNum\": true,\"title\": \"The Business Model Canvas\",\"sub\": \"Describing how a business actually works — on one page\",\"intro\": [\"<strong>From communication to content.<\u002Fstrong> Modules 1–4 were about <em>how<\u002Fem> to say things and how to show them. Modules 5 and 6 give you something to say. The Business Model Canvas (Alexander Osterwalder and Yves Pigneur) is a one-page tool that describes any business idea in nine blocks. In this course, it is the starting point for your business plan report: seven of the nine blocks become the sections of your report.\",\"<strong>How to use:<\u002Fstrong> The nine blocks are in three groups. The <strong>customer side<\u002Fstrong> is about who your customers are and how you reach and keep them. The <strong>money<\u002Fstrong> blocks show what comes in and what goes out. The <strong>business side<\u002Fstrong> is about what you need to make it all work. Click each block — together they answer one question: how does this company create value, deliver it, and earn money from it?\"],\"sections\": [{\"label\": \"Customer side\",\"items\": [{\"name\": \"Value Propositions\",\"icon\": \"🎁\",\"sub\": \"\",\"num\": 1,\"full\": false,\"img\": null,\"description\": \"This is the core of your business. It explains why customers should choose you instead of your competitors. It answers the question: Why would someone buy from us?\",\"points\": null,\"when\": null,\"questions\": [\"What value do we deliver to the customer?\",\"Which customer needs are we satisfying?\"],\"phrases\": null,\"example\": \"Spotify: listeners get access to millions of songs on demand, without buying each one individually.\",\"vocab\": [\"deliver value\",\"satisfy a need\",\"solve a problem\",\"bundle of services\",\"customization\",\"unique selling point (usp)\",\"competitive advantage\",\"pain point\",\"differentiate\",\"brand image\"]},{\"name\": \"Customer Segments\",\"icon\": \"👥\",\"sub\": \"\",\"num\": 2,\"full\": false,\"img\": null,\"description\": \"The different groups of people or organizations your company wants to reach and serve. Not all customers are the same — understanding your segments helps you focus your efforts.\",\"points\": null,\"when\": null,\"questions\": [\"For whom are we creating value?\",\"Who are our most important customers?\"],\"phrases\": null,\"example\": \"Netflix targets multiple segments: casual viewers, families, film enthusiasts, and binge-watchers — each offered relevant content.\",\"vocab\": [\"mass market\",\"niche market\",\"demographics\",\"target audience\",\"multi-sided platform\",\"customer profile\",\"market segmentation\",\"b2b (business-to-business)\",\"b2c (business-to-consumer)\",\"early adopters\"]},{\"name\": \"Channels\",\"icon\": \"🚚\",\"sub\": \"\",\"num\": 3,\"full\": false,\"img\": null,\"description\": \"How a company communicates with and reaches its customers to deliver its value proposition. Channels can be physical (a shop) or digital (a website or app).\",\"points\": null,\"when\": null,\"questions\": [\"How are we reaching our customers?\",\"Which channels work best?\"],\"phrases\": null,\"example\": \"Apple sells through its own website, Apple Stores, and third-party retailers — each channel targeting different buying situations.\",\"vocab\": [\"distribution channel\",\"awareness\",\"post-purchase support\",\"point of sale\",\"evaluation\",\"brick and mortar\",\"direct channel\",\"indirect channel\",\"e-commerce\",\"customer journey\"]},{\"name\": \"Customer Relationships\",\"icon\": \"❤️\",\"sub\": \"\",\"num\": 4,\"full\": false,\"img\": null,\"description\": \"The types of relationships a company builds with its customers. The goal is to get new customers, keep existing ones, and grow sales.\",\"points\": null,\"when\": null,\"questions\": [\"What kind of relationship does each customer group expect?\",\"How do we attract and keep customers?\"],\"phrases\": null,\"example\": \"Amazon uses automated recommendations to suggest products, but also offers dedicated support for business accounts.\",\"vocab\": [\"personal assistance\",\"self-service\",\"co-creation\",\"customer retention\",\"automated service\",\"dedicated support\",\"loyalty programme\",\"churn rate\",\"customer satisfaction\",\"after-sales service\"]}]},{\"label\": \"Money\",\"items\": [{\"name\": \"Revenue Streams\",\"icon\": \"💰\",\"sub\": \"\",\"num\": 5,\"full\": false,\"img\": null,\"description\": \"The money a company earns from each customer segment. A business may have one revenue stream or several.\",\"points\": null,\"when\": null,\"questions\": [\"What are customers willing to pay for?\",\"How does each revenue stream contribute to total income?\"],\"phrases\": null,\"example\": \"Spotify earns from premium subscriptions and from advertising shown to free users — two separate revenue streams.\",\"vocab\": [\"subscription fee\",\"asset sale\",\"licensing\",\"fixed pricing\",\"dynamic pricing\",\"usage fee\",\"freemium model\",\"brokerage fee\",\"advertising revenue\",\"margin\"]},{\"name\": \"Cost Structure\",\"icon\": \"📊\",\"sub\": \"\",\"num\": 9,\"full\": false,\"img\": null,\"description\": \"All the costs a business must pay to operate. Understanding your cost structure helps you find ways to become more efficient or competitive.\",\"points\": null,\"when\": null,\"questions\": [\"What are the most important costs in our business?\",\"Which resources and activities are most expensive?\"],\"phrases\": null,\"example\": \"Ryanair is highly cost-driven — they reduce fixed and variable costs at every stage to keep ticket prices low.\",\"vocab\": [\"fixed costs\",\"variable costs\",\"economies of scale\",\"cost-driven\",\"value-driven\",\"outsourcing\",\"overhead\",\"break-even point\",\"cash flow\",\"depreciation\"]}]},{\"label\": \"Business side\",\"items\": [{\"name\": \"Key Resources\",\"icon\": \"🧰\",\"sub\": \"\",\"num\": 6,\"full\": false,\"img\": null,\"description\": \"The most important things a company needs to make its business model work. Resources can be physical, financial, human, or intellectual.\",\"points\": null,\"when\": null,\"questions\": [\"What key resources does our value proposition require?\",\"What do we need to deliver our service?\"],\"phrases\": null,\"example\": \"Google's key resources include its search algorithm (intellectual property), its data centres (physical), and its engineers (human).\",\"vocab\": [\"intellectual property\",\"human resources\",\"financial assets\",\"physical equipment\",\"patent\",\"credit\",\"trademark\",\"data\",\"know-how\",\"infrastructure\"]},{\"name\": \"Key Activities\",\"icon\": \"⚙️\",\"sub\": \"\",\"num\": 7,\"full\": false,\"img\": null,\"description\": \"The most important actions a company must carry out to operate successfully and deliver its value proposition.\",\"points\": null,\"when\": null,\"questions\": [\"What are the most important things we must do every day?\",\"Do we make products, solve problems, or manage a platform?\"],\"phrases\": null,\"example\": \"IKEA's key activities include designing flat-pack furniture, managing global supply chains, and operating its stores.\",\"vocab\": [\"production\",\"problem solving\",\"platform management\",\"manufacture\",\"supply chain management\",\"consulting\",\"research and development (r&d)\",\"quality control\",\"marketing\",\"logistics\"]},{\"name\": \"Key Partners\",\"icon\": \"🤝\",\"sub\": \"\",\"num\": 8,\"full\": false,\"img\": null,\"description\": \"The network of outside companies and suppliers that help your business model work. Partners allow you to focus on what you do best.\",\"points\": null,\"when\": null,\"questions\": [\"Who are our key partners and suppliers?\",\"What do we get from them that we cannot easily do ourselves?\"],\"phrases\": null,\"example\": \"Starbucks partners with coffee farmers (suppliers), cup manufacturers, and music streaming services — each partner adds something the business needs.\",\"vocab\": [\"strategic partnership\",\"joint venture\",\"supplier\",\"strategic alliance\",\"outsourcing\",\"resource acquisition\",\"subcontractor\",\"franchise\",\"memorandum of understanding (mou)\",\"due diligence\"]}]}],\"exercise\": null,\"quiz\": [{\"q\": \"Which block describes the group of people you want to reach?\",\"options\": [\"Customer Segments\",\"Customer Relationships\",\"Channels\",\"Value Propositions\"],\"answer\": \"Customer Segments\",\"rationale\": \"All four are customer-facing blocks, which is why this is worth checking. Segments are <em>who<\u002Fem>; Relationships are <em>how you keep them<\u002Fem>; Channels are <em>how you reach them<\u002Fem>; Value Propositions are <em>what you offer them<\u002Fem>.\"},{\"q\": \"What do we call the core value or benefit we offer to customers?\",\"options\": [\"Revenue Stream\",\"Value Proposition\",\"Key Activity\",\"Customer Relationship\"],\"answer\": \"Value Proposition\",\"rationale\": \"The Value Proposition explains why customers should choose you — it is the benefit or solution you offer.\"},{\"q\": \"A monthly payment for a service (like Netflix) is an example of a:\",\"options\": [\"A subscription fee\",\"A usage fee\",\"An asset sale\",\"A licensing fee\"],\"answer\": \"A subscription fee\",\"rationale\": \"All four are revenue streams. A subscription is paid for continuing access, whatever you use. A usage fee is paid per use, an asset sale transfers ownership, and licensing charges for permission to use something you own.\"},{\"q\": \"Costs that do not change based on how much you produce (like rent) are called:\",\"options\": [\"Variable Costs\",\"Revenue Streams\",\"Fixed Costs\",\"Dynamic Pricing\"],\"answer\": \"Fixed Costs\",\"rationale\": \"Fixed costs stay the same every month regardless of production. Rent and salaries are common examples.\"},{\"q\": \"Which block covers the suppliers and outside companies that help your business work?\",\"options\": [\"Key Partners\",\"Key Resources\",\"Key Activities\",\"Cost Structure\"],\"answer\": \"Key Partners\",\"rationale\": \"The three Key blocks are easy to confuse. Partners are people <em>outside<\u002Fem> the company; Resources are what you own or control; Activities are what you actually do.\"},{\"q\": \"Which Key Activity involves designing and making a physical product?\",\"options\": [\"Platform management\",\"Production\",\"Problem solving\",\"Consulting\"],\"answer\": \"Production\",\"rationale\": \"Production is the activity of designing, making, and delivering a physical product — typical in manufacturing businesses.\"},{\"q\": \"What type of resource are patents and copyrights?\",\"options\": [\"Intellectual resources\",\"Financial resources\",\"Physical resources\",\"Human resources\"],\"answer\": \"Intellectual resources\",\"rationale\": \"Intellectual resources are things you own that have no physical form: patents, brands, software, customer data. They often cost money to create, but that does not make them financial resources.\"},{\"q\": \"Which channel stage involves helping customers decide if your product is right for them?\",\"options\": [\"Evaluation\",\"Awareness\",\"Purchase\",\"After-sales support\"],\"answer\": \"Evaluation\",\"rationale\": \"Awareness is finding out you exist. Evaluation is deciding whether you are right for them. Purchase is buying, and after-sales support comes later. The stages run in that order.\"},{\"q\": \"A business focused on keeping costs as low as possible is called:\",\"options\": [\"Cost-driven\",\"Value-driven\",\"Cost Structure\",\"Economies of scale\"],\"answer\": \"Cost-driven\",\"rationale\": \"Cost-driven and value-driven are the two strategies. Cost Structure is the block itself, not a strategy, and economies of scale are one way of lowering costs, not the strategy.\"},{\"q\": \"If two companies work together on one shared business project, it is called a:\",\"options\": [\"Joint Venture\",\"Strategic Alliance\",\"Outsourcing\",\"Franchise\"],\"answer\": \"Joint Venture\",\"rationale\": \"All four are partnership types. A joint venture creates one shared project or company. An alliance is looser, outsourcing pays someone to do your work, and a franchise licenses your model to someone else.\"},{\"q\": \"A bakery owns its ovens and employs three bakers. In which block do the ovens and the bakers belong?\",\"options\": [\"Key Resources\",\"Key Activities\",\"Key Partners\",\"Cost Structure\"],\"answer\": \"Key Resources\",\"rationale\": \"Resources are what you have: equipment, people, money, intellectual property. Baking is the Activity, the flour supplier is a Partner, and their wages appear in the Cost Structure.\"},{\"q\": \"A company sells software once, then charges yearly for support. How many revenue streams is that?\",\"options\": [\"Two — an asset sale and a subscription\",\"One, because the money comes from the same customer\",\"One, because it is all built around the same product\",\"Three — the sale, the support, and the maintenance\"],\"answer\": \"Two — an asset sale and a subscription\",\"rationale\": \"Revenue streams are counted by how money arrives, not by product or customer. A one-off sale and a recurring fee behave differently and are planned differently.\"},{\"q\": \"Which pair is most often confused on the canvas, and what is the difference?\",\"options\": [\"Key Resources and Key Activities — what you have, against what you do\",\"Channels and Customer Segments — how you sell, against what you sell\",\"Cost Structure and Revenue Streams — money out, against money in\",\"Value Propositions and Key Partners — your offer, against your suppliers\"],\"answer\": \"Key Resources and Key Activities — what you have, against what you do\",\"rationale\": \"The three Key blocks use similar words for different things. The other pairs listed are rarely confused, and one of the descriptions is wrong: Segments are people, not products.\"}]},{\"id\": \"pitch\",\"num\": 6,\"title\": \"Pitching your idea\",\"sub\": \"Turning a business model into a three-minute talk\",\"intro\": [\"<strong>Now say it out loud.<\u002Fstrong> A pitch is a short talk — often three minutes — where you present a business idea to investors, customers or a jury. In this course, you structure your pitch with the <strong>ANSVA model<\u002Fstrong>: Attention, Need, Solution, Visualization, Action. ANSVA is based on Monroe’s Motivated Sequence, a classic five-step plan for persuasive talks (Alan H. Monroe, 1935). The order matters: first you earn attention, then you show a need, and only then do you present your solution — so the audience is ready to hear it.\",\"<strong>How to use:<\u002Fstrong> Click the five parts in order. Every part includes questions to answer, phrases you can reuse and an example from a student company called Snowbox.\"],\"sections\": [{\"label\": \"The five parts\",\"items\": [{\"name\": \"Attention\",\"icon\": \"💬\",\"sub\": \"Make them want to listen\",\"num\": 1,\"full\": true,\"img\": null,\"description\": \"The opening of your pitch. In a few seconds, you make the audience want to listen. Say who you are, then give one clear, memorable sentence about your idea.\",\"points\": [\"Start with a hook: a question, a surprising fact or a very short story.\",\"Say your name and your company name.\",\"Give your idea in a nutshell: one sentence, no details.\"],\"when\": [\"The first 20–30 seconds of your pitch.\"],\"questions\": [\"Who are you?\",\"What is your idea, in one sentence?\",\"Why should this audience care?\"],\"phrases\": [\"Have you ever …?\",\"Imagine that …\",\"Hi, I’m … and this is …\",\"In a nutshell, we …\"],\"example\": \"Hi, I’m Emma from Snowbox. Every winter, 12,000 international students arrive in Finland without winter clothes. We rent them everything they need — for less than the price of one new jacket.\",\"vocab\": [\"statement\",\"memorable\",\"impact\",\"in a nutshell\",\"relate to\"]},{\"name\": \"Need\",\"icon\": \"🎭\",\"sub\": \"Show the problem is real\",\"num\": 2,\"full\": false,\"img\": null,\"description\": \"Show the audience a real problem. Explain who has the problem, how big it is, and how you know it is real.\",\"points\": [\"State the problem in one or two sentences.\",\"Say who has the problem (your target customers) and how many they are.\",\"Give evidence: numbers, interviews or your own research.\"],\"when\": [\"Right after Attention, before you present your solution.\"],\"questions\": [\"What problem do you solve?\",\"Who has this problem, and how many people are they?\",\"What evidence shows the problem is real?\"],\"phrases\": [\"The problem is that …\",\"Every year, … people …\",\"We talked to … customers, and …\",\"Right now, there is no easy way to …\"],\"example\": \"International students need winter gear for only eight months, but buying everything new costs over 400 euros. We interviewed 60 students: 80% said they would rather rent.\",\"vocab\": [\"pain point\",\"target customer\",\"market size\",\"validate\",\"evidence\"]},{\"name\": \"Solution\",\"icon\": \"💡\",\"sub\": \"Present your idea and show it\",\"num\": 3,\"full\": false,\"img\": null,\"description\": \"Present your product or service as the answer to the need. Explain how it works, show it if you can, and say what makes it different. In Monroe’s original model, this part is called Satisfaction.\",\"points\": [\"Explain how your solution works, step by step.\",\"Show it: a demo, a prototype or a picture beats a description.\",\"Say what makes you different from the alternatives.\"],\"when\": [\"The middle of your pitch — usually the longest part.\"],\"questions\": [\"What is your solution, and how does it work?\",\"What can you show, not just tell?\",\"What makes it different from what exists now?\"],\"phrases\": [\"Our solution is …\",\"Here is how it works: first …, then …\",\"Let me show you …\",\"Unlike our competitors, we …\"],\"example\": \"Snowbox is a rental service. Students order a full winter set online and pick it up on campus for 89 euros per semester. Unlike second-hand shops, every item is cleaned and guaranteed.\",\"vocab\": [\"solution\",\"feature\",\"benefit\",\"demo (demonstration)\",\"prototype\",\"unique selling point (usp)\",\"competitor\"]},{\"name\": \"Visualization\",\"icon\": \"🖼️\",\"sub\": \"Help them see the future\",\"num\": 4,\"full\": false,\"img\": null,\"description\": \"Help the audience see life with your product. Paint a short, concrete picture of the future — and use real results to show the picture is true.\",\"points\": [\"Describe one everyday moment with your product.\",\"You can also show the future without it: what stays broken?\",\"Back the picture with proof: users, pilot customers, growth.\"],\"when\": [\"After the solution, before your final ask.\"],\"questions\": [\"What does your customer’s life look like with your product?\",\"What happens if the problem is not solved?\",\"What proof do you already have?\"],\"phrases\": [\"Imagine a winter where …\",\"With us, you simply …\",\"Without a solution like this, …\",\"Already, … customers …\"],\"example\": \"Imagine landing in Helsinki in January and having warm boots waiting for you at the campus pick-up point. That is the winter we are building — and our first 120 customers already have it.\",\"vocab\": [\"user\",\"growth\",\"traction\",\"pilot customer\",\"mission\"]},{\"name\": \"Action\",\"icon\": \"👉\",\"sub\": \"Tell them what to do next\",\"num\": 5,\"full\": false,\"img\": null,\"description\": \"End by telling the audience exactly what you want from them and what happens next. Close with one line they will remember — it can echo your opening.\",\"points\": [\"Make your ask clear: how much, and what for.\",\"Give the audience an easy next step.\",\"End with a short closing line that echoes your Attention.\"],\"when\": [\"The last 20–30 seconds of your pitch.\"],\"questions\": [\"What do you ask from this audience?\",\"What exactly will you do with it?\",\"What is your closing line?\"],\"phrases\": [\"We are asking for …\",\"With this investment, we will …\",\"The next step is …\",\"Join us, and …\"],\"example\": \"We are asking for 30,000 euros to expand to Helsinki and Tampere — next to our own 6,000. Join us, and let’s make sure no student freezes through their first Finnish winter.\",\"vocab\": [\"call to action\",\"next step\",\"investor\",\"funding\",\"closing line\",\"get in touch\"]}]}],\"exercise\": null,\"quiz\": [{\"q\": \"What does ANSVA stand for?\",\"options\": [\"Attention, Need, Solution, Visualization, Action\",\"Aim, Need, Sell, Value, Ask\",\"Attention, Numbers, Solution, Value, Action\",\"Ask, Need, Show, Visualize, Act\"],\"answer\": \"Attention, Need, Solution, Visualization, Action\",\"rationale\": \"ANSVA is the five-part structure of your pitch, in speaking order.\"},{\"q\": \"Which part comes first in an ANSVA pitch?\",\"options\": [\"Attention\",\"Need\",\"Solution\",\"Action\"],\"answer\": \"Attention\",\"rationale\": \"You open by making the audience want to listen — before any details.\"},{\"q\": \"In the Attention part, your main job is to …\",\"options\": [\"make the audience want to listen\",\"explain your revenue model\",\"answer questions\",\"thank the jury\"],\"answer\": \"make the audience want to listen\",\"rationale\": \"A hook plus one memorable sentence about your idea. Details come later.\"},{\"q\": \"“Have you ever frozen at a bus stop in January?” This line is a typical …\",\"options\": [\"Attention hook\",\"Action ask\",\"Solution demo\",\"revenue model\"],\"answer\": \"Attention hook\",\"rationale\": \"A question hook pulls the audience in during the first seconds.\"},{\"q\": \"In the Need part, you show that …\",\"options\": [\"the problem is real and big enough\",\"your team works hard\",\"your slides look good\",\"your price is low\"],\"answer\": \"the problem is real and big enough\",\"rationale\": \"Who has the problem, how many they are, and your evidence.\"},{\"q\": \"“We interviewed 60 students: 80% said they would rather rent.” Which part is this?\",\"options\": [\"Need\",\"Attention\",\"Action\",\"Visualization\"],\"answer\": \"Need\",\"rationale\": \"Interview numbers are evidence that the problem is real.\"},{\"q\": \"In the Solution part, you …\",\"options\": [\"present your product and how it works\",\"ask for money\",\"list your hobbies\",\"summarise the whole pitch\"],\"answer\": \"present your product and how it works\",\"rationale\": \"Explain it step by step, show it if you can, and say what makes it different.\"},{\"q\": \"“Unlike second-hand shops, every item is cleaned and guaranteed.” What is the speaker doing?\",\"options\": [\"Showing what makes the solution different\",\"Making the Action ask\",\"Opening with a hook\",\"Describing the team\"],\"answer\": \"Showing what makes the solution different\",\"rationale\": \"Comparing yourself with alternatives belongs in the Solution part.\"},{\"q\": \"In the Visualization part, you …\",\"options\": [\"help the audience see life with your product\",\"show your bank account\",\"read your business plan aloud\",\"introduce yourself\"],\"answer\": \"help the audience see life with your product\",\"rationale\": \"A short, concrete picture of the future — supported by real proof.\"},{\"q\": \"“Imagine landing in Helsinki in January and having warm boots waiting for you.” Which part is this?\",\"options\": [\"Visualization\",\"Need\",\"Attention\",\"Solution\"],\"answer\": \"Visualization\",\"rationale\": \"The speaker paints a picture of the customer’s future life.\"},{\"q\": \"In the Action part, you …\",\"options\": [\"tell the audience exactly what you ask and what happens next\",\"start a new topic\",\"explain the problem again in detail\",\"apologise for the time\"],\"answer\": \"tell the audience exactly what you ask and what happens next\",\"rationale\": \"A clear ask, an easy next step, and a closing line.\"},{\"q\": \"A good closing line often …\",\"options\": [\"echoes your opening\",\"introduces new data\",\"lists all seven report sections\",\"asks the jury to be quiet\"],\"answer\": \"echoes your opening\",\"rationale\": \"Ending where you began makes the pitch feel complete and memorable.\"},{\"q\": \"ANSVA is based on …\",\"options\": [\"Monroe’s Motivated Sequence\",\"the Business Model Canvas\",\"the SWOT analysis\",\"the 7 Ps of marketing\"],\"answer\": \"Monroe’s Motivated Sequence\",\"rationale\": \"Alan H. Monroe’s classic five-step plan for persuasive talks (1935). In Monroe’s version, Solution is called Satisfaction.\"}]},{\"id\": \"situations\",\"num\": 7,\"title\": \"Getting a job and working with others\",\"sub\": \"Applications, skills, interviews, business fairs, and feedback\",\"intro\": [\"<strong>Putting it together.<\u002Fstrong> This module follows the order you will meet these things: writing an application, working out what your skills actually are, describing them so an employer believes you, the interview itself, meeting people at a fair, and giving or receiving feedback once you are working. Everything here builds on the earlier modules — the same polite, clear English, now used to talk about yourself.\",\"<strong>The part most applicants get wrong.<\u002Fstrong> Almost everyone lists their hard skills and then claims their soft skills. Topics 2 and 3 are about the difference, and about how to make a claim believable by attaching it to something you actually did.\",\"<strong>How to use:<\u002Fstrong> Read the six topics in order, then try the exercise at the bottom of the page.\"],\"sections\": [{\"label\": \"Three situations you will meet\",\"items\": [{\"name\": \"Job applications\",\"icon\": \"\",\"sub\": \"\",\"num\": 1,\"full\": false,\"img\": null,\"description\": \"An application usually has two parts. A CV lists what you have done. A cover letter explains why that makes you right for this particular job. An employer may read a hundred applications, so yours has to be easy to read and easy to match against the advertisement.\",\"points\": [\"Read the advertisement twice, and note the exact words it uses for the skills it wants\",\"The CV shows what you have done; the cover letter explains why it matters for this job\",\"Use the same words as the advertisement where they are true of you — do not copy whole sentences\",\"Keep the CV to one or two pages, most recent first\",\"Check the company name, the job title, and every date — small errors are the fastest way to be rejected\",\"Ask someone to proofread before you send, and read it aloud yourself\"],\"when\": null,\"questions\": null,\"phrases\": null,\"example\": \"The advertisement asks for “good customer service skills and the ability to work independently”. The cover letter answers both: “In my summer job I served about eighty customers a day, and on Saturdays I opened the shop alone.”\",\"vocab\": [\"cv (curriculum vitae)\",\"applicant\",\"shortlist\",\"qualification\",\"referee\",\"work placement\",\"tailor\",\"application form\"]},{\"name\": \"Hard and soft skills\",\"icon\": \"\",\"sub\": \"\",\"num\": 2,\"full\": false,\"img\": null,\"description\": \"Employers ask for two kinds of skill. Hard skills can be measured or certified: a language, a software, a licence. Soft skills are how you work with people and handle situations. Most advertisements ask for both, but most applicants describe only the hard ones.\",\"points\": [\"Hard skills are teachable and provable: languages, Excel, accounting, a driving licence, a certificate\",\"Soft skills are about how you work: teamwork, communication, time management, adaptability\",\"Hard skills often get you the interview; soft skills often get you the job\",\"Some skills sit between the two — presenting, negotiating, writing a report\",\"Soft skills are transferable: what you learned in a café job also works in an office\",\"Before you write, sort the advertisement's requirements into the two groups\"],\"when\": null,\"questions\": null,\"phrases\": null,\"example\": \"Advertisement: “We are looking for a trainee with good Excel skills, fluent English, and the ability to work in a busy team.” That is tw
