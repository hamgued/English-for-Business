  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

b-black); }\n  .site-nav-inner { max-width: 1200px; margin: 0 auto; padding: 0 24px; display: flex; justify-content: space-between; align-items: stretch; gap: 16px; flex-wrap: wrap; }\n  .site-nav .brand { display: flex; align-items: center; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--lab-white); text-decoration: none; padding: 12px 0; }\n  .site-nav .links { display: flex; }\n  .site-nav .links a { display: flex; align-items: center; padding: 12px 16px; font-size: 0.9rem; font-weight: 700; color: var(--lab-footer-text); text-decoration: none; border-bottom: 3px solid transparent; }\n  .site-nav .links a:hover { color: var(--lab-white); background: #2a2a2a; }\n  .site-nav .links a.here { color: var(--lab-white); border-bottom-color: var(--lab-teal); }\n\n  /* HEADER + NAV */\n  header { background: var(--lab-white); border-bottom: 1px solid var(--lab-grey-border); padding: 14px 24px; }\n  .header-inner { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }\n  h1 { font-size: 1.6rem; font-weight: 700; }\n  .credit { font-size: 0.85rem; color: var(--lab-grey-mid); margin-top: 2px; }\n  .credit a { color: var(--lab-grey-mid); }\n  .tabs-bar { display: flex; flex-wrap: wrap; gap: 4px; }\n  .tab-btn {\n    font-family: inherit; font-size: 0.82rem; font-weight: 700;\n    padding: 8px 14px; border: none; background: var(--lab-grey-light);\n    color: var(--lab-grey-mid); cursor: pointer;\n  }\n  .tab-btn:hover { background: var(--lab-grey-border); }\n  .tab-btn.active, .tab-btn.active:hover { background: var(--lab-teal); color: var(--lab-white); }\n\n  main { flex-grow: 1; width: 100%; max-width: 1200px; margin: 0 auto; padding: 32px 24px 64px; }\n\n  .module-h { font-size: 2rem; font-weight: 700; }\n  .module-sub { color: var(--lab-grey-mid); margin-bottom: 20px; }\n  .section-label {\n    font-size: 0.78rem; font-weight: 700; text-transform: uppercase;\n    letter-spacing: 0.07em; color: var(--lab-grey-mid);\n    margin: 28px 0 10px; padding-bottom: 6px;\n    border-bottom: 2px solid var(--lab-teal);\n  }\n  .callout { background: var(--lab-teal-light); border-left: 4px solid var(--lab-teal); padding: 14px 16px; margin-bottom: 12px; font-size: 0.95rem; }\n  .callout.warn { background: var(--yellow-light); border-left-color: var(--yellow); }\n  .panel { background: var(--lab-white); border: 1px solid var(--lab-grey-border); padding: 20px; margin-bottom: 12px; }\n  .panel ul, .modal-body ul { padding-left: 20px; }\n  .panel li { margin-bottom: 6px; }\n\n  /* START PAGE PATH */\n  .path { display: flex; flex-direction: column; gap: 8px; }\n  .path-step {\n    display: flex; gap: 14px; align-items: flex-start; text-align: left;\n    background: var(--lab-white); border: 1px solid var(--lab-grey-border);\n    padding: 14px 16px; cursor: pointer; font-family: inherit; width: 100%;\n  }\n  .path-step:hover { border-color: var(--lab-teal); }\n  .path-num {\n    background: var(--lab-teal); color: var(--lab-white); font-weight: 700;\n    min-width: 30px; height: 30px; display: flex; align-items: center;\n    justify-content: center; flex-shrink: 0; font-size: 0.95rem;\n  }\n  .path-title { display: block; font-weight: 700; font-size: 1.05rem; }\n  .path-sub { display: block; font-size: 0.875rem; color: var(--lab-grey-mid); }\n\n  /* TOPIC GRID */\n  .topic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }\n  .topic-cell {\n    font-family: inherit; text-align: left; background: var(--lab-white);\n    border: 2px solid var(--lab-grey-border); color: var(--lab-black);\n    padding: 18px; cursor: pointer; display: flex; flex-direction: column;\n    gap: 6px; min-height: 110px;\n  }\n  .topic-cell:hover, .topic-cell:focus-visible { border-color: var(--lab-teal); outline: none; }\n  .topic-cell.full { grid-column: 1 / -1; }\n  .topic-num {\n    align-self: flex-start; background: var(--lab-teal); color: var(--lab-white);\n    font-size: 0.8rem; font-weight: 700; padding: 2px 9px; min-width: 26px; text-align: center;\n  }\n  .topic-title { font-weight: 700; font-size: 1.05rem; }\n  .topic-sub { font-size: 0.85rem; color: var(--lab-grey-mid); }\n\n  /* MODAL */\n  #item-modal { position: fixed; inset: 0; z-index: 200; background: rgba(26,26,26,0.6); display: none; align-items: center; justify-content: center; padding: 16px; }\n  #item-modal.show { display: flex; }\n  .modal-panel { background: var(--lab-white); width: 100%; max-width: 780px; max-height: 92vh; display: flex; flex-direction: column; border: 1px solid var(--lab-grey-border); }\n  .modal-head { background: var(--lab-teal); color: var(--lab-white); padding: 16px 22px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }\n  .modal-head h2 { font-size: 1.3rem; font-weight: 700; }\n  .modal-head .order { display: block; font-size: 0.78rem; font-weight: 400; opacity: 0.9; }\n  .modal-close { font-family: inherit; font-size: 1.2rem; background: transparent; border: 1px solid rgba(255,255,255,0.6); color: var(--lab-white); width: 34px; height: 34px; cursor: pointer; flex-shrink: 0; }\n  .modal-close:hover { background: rgba(255,255,255,0.15); }\n  .modal-body { padding: 22px; overflow-y: auto; }\n  .modal-body section { margin-bottom: 20px; }\n  .modal-body h3 { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--lab-grey-mid); margin-bottom: 8px; }\n  .modal-body li { margin-bottom: 5px; }\n  .phrase { background: var(--lab-teal-light); border-left: 4px solid var(--lab-teal); padding: 8px 12px; margin-bottom: 7px; font-size: 0.95rem; }\n  .figure { background: var(--lab-white); border: 1px solid var(--lab-grey-border); padding: 14px 12px; }\n  .figure svg { display: block; margin: 0 auto; }\n  .example-box { background: var(--lab-grey-light); border-left: 4px solid var(--lab-grey-border); padding: 12px 14px; font-style: italic; white-space: pre-wrap; }\n  .example-box .who { display: block; font-style: normal; font-size: 0.78rem; color: var(--lab-grey-mid); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.05em; }\n  .modal-foot { padding: 14px 22px; border-top: 1px solid var(--lab-grey-border); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }\n\n  /* VOCAB PILLS — always in flow, never clipped */\n  .vocab-box { background: var(--lab-grey-light); padding: 14px; }\n  .term-list { display: flex; flex-wrap: wrap; gap: 7px; }\n  .term-wrap { display: inline-block; }\n  .term-wrap.open { display: block; width: 100%; }\n  .term-pill { font-family: inherit; display: inline-block; padding: 4px 12px; font-size: 0.85rem; font-weight: 700; cursor: pointer; background: var(--lab-white); border: 1px solid var(--lab-grey-border); color: var(--lab-teal); }\n  .term-pill.plain { cursor: default; color: var(--lab-grey-mid); }\n  .term-pill:hover, .term-wrap.open .term-pill { border-color: var(--lab-teal); background: var(--lab-teal-light); }\n  .term-def { display: none; margin-top: 6px; padding: 10px 13px; background: var(--lab-black); color: var(--lab-white); font-size: 0.87rem; line-height: 1.6; }\n  .term-wrap.open .term-def { display: block; }\n  .term-def .ex { margin-top: 4px; font-style: italic; color: var(--lab-footer-text); }\n  .term-def .fi { margin-top: 6px; color: #7fe3e3; }\n\n  /* BUTTONS */\n  .btn-primary, .btn-ghost {\n    font-family: inherit; font-size: 0.92rem; font-weight: 700;\n    padding: 10px 18px; cursor: pointer; border: 1px solid var(--lab-teal);\n  }\n  .btn-primary { background: var(--lab-teal); color: var(--lab-white); }\n  .btn-primary:hover { background: #057a7a; }\n  .btn-ghost { background: var(--lab-white); color: var(--lab-teal); }\n  .btn-ghost:hover { background: var(--lab-teal-light); }\n  .btn-primary:disabled, .btn-ghost:disabled { opacity: 0.4; cursor: default; }\n\n  /* KEYWORDS */\n  .kw-controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }\n  .kw-controls input, .kw-controls select {\n    font-family: inherit; font-size: 0.95rem; padding: 9px 12px;\n    border: 1px solid var(--lab-grey-border); background: var(--lab-white); color: var(--lab-black);\n  }\n  .kw-controls input { flex: 1; min-width: 200px; }\n  .kw-controls input:focus, .kw-controls select:focus { outline: 2px solid var(--lab-teal); outline-offset: -2px; }\n  .kw-count { font-size: 0.85rem; color: var(--lab-grey-mid); margin-bottom: 14px; }\n  .kw-group { margin-bottom: 10px; border: 1px solid var(--lab-grey-border); background: var(--lab-white); }\n  .kw-group > summary {\n    list-style: none; cursor: pointer; padding: 13px 16px;\n    display: flex; align-items: center; gap: 10px;\n    font-weight: 700; color: var(--lab-teal); font-size: 1.02rem;\n  }\n  .kw-group > summary::-webkit-details-marker { display: none; }\n  .kw-group > summary:hover { background: var(--lab-teal-light); }\n  .kw-group > summary:focus-visible { outline: 2px solid var(--lab-teal); outline-offset: -2px; }\n  .kw-group > summary .kw-sign {\n    display: inline-block; width: 22px; height: 22px; flex-shrink: 0;\n    background: var(--lab-teal); color: var(--lab-white);\n    font-size: 0.9rem; line-height: 22px; text-align: center; font-weight: 700;\n  }\n  .kw-group > summary .kw-sign::before { content: '+'; }\n  .kw-group[open] > summary .kw-sign::before { content: '\\2212'; }\n  .kw-group > summary .kw-n { margin-left: auto; font-weight: 400; font-size: 0.85rem; color: var(--lab-grey-mid); }\n  .kw-group[open] > summary { border-bottom: 1px solid var(--lab-grey-border); }\n  .kw-group .kw-inner { padding: 0; }\n  .kw-table { width: 100%; border-collapse: collapse; background: var(--lab-white); }\n  .kw-table tr:last-child td { border-bottom: none; }\n  .kw-table th, .kw-table td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--lab-grey-border); vertical-align: top; font-size: 0.93rem; }\n  .kw-table th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--lab-white); background: var(--lab-teal); }\n  .kw-table td:first-child { font-weight: 700; width: 42%; }\n  .kw-table .kw-mods { font-size: 0.75rem; color: var(--lab-grey-mid); font-weight: 400; display: block; margin-top: 2px; }\n\n  /* QUIZ + EXERCISES */\n  .quiz-card { background: var(--lab-white); border: 1px solid var(--lab-grey-border); padding: 22px; margin-top: 12px; }\n  .quiz-meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--lab-grey-mid); margin-bottom: 12px; }\n  .quiz-bar { flex: 1; height: 5px; background: var(--lab-grey-light); margin-left: 12px; }\n  .quiz-bar-fill { height: 100%; background: var(--lab-teal); }\n  .quiz-q { font-size: 1.12rem; font-weight: 700; margin-bottom: 14px; }\n  .reg-casual { background: var(--lab-grey-light); border-left: 4px solid var(--lab-grey-border); padding: 14px 16px; margin-bottom: 14px; font-size: 1.05rem; }\n  .reg-label { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--lab-grey-mid); margin-bottom: 4px; }\n  .quiz-opts { display: grid; gap: 8px; }\n  .quiz-opt { font-family: inherit; font-size: 1rem; text-align: left; background: var(--lab-white); border: 1px solid var(--lab-grey-border); padding: 12px 14px; cursor: pointer; color: var(--lab-black); }\n  .quiz-opt:hover:not(:disabled) { border-color: var(--lab-teal); background: var(--lab-teal-light); }\n  .quiz-opt:disabled { cursor: default; }\n  .quiz-opt.correct { background: var(--green-light); border: 2px solid var(--green); }\n  .quiz-opt.wrong { background: var(--red-light); border: 2px solid var(--red); }\n  .quiz-fb { margin-top: 14px; padding: 14px; display: none; }\n  .quiz-fb.ok { display: block; background: var(--green-light); border-left: 4px solid var(--green); }\n  .quiz-fb.bad { display: block; background: var(--red-light); border-left: 4px solid var(--red); }\n  .btn-next { margin-top: 14px; }\n  .score-box { text-align: center; padding: 30px 16px; }\n  .score-box .n { font-size: 2.4rem; font-weight: 700; color: var(--lab-teal); }\n  .score-box p { margin: 8px 0 18px; color: var(--lab-grey-mid); }\n  .btn-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }\n\n  /* IMPORTED EMAIL BLOCKS */\n  .info-strip { background: var(--lab-teal-light); border-left: 4px solid var(--lab-teal); padding: 14px 16px; margin-bottom: 12px; font-size: 0.95rem; }\n  .annotated-email { background: var(--lab-white); border: 1px solid var(--lab-grey-border); margin-bottom: 16px; }\n  .email-header-bar { background: var(--lab-grey-light); border-bottom: 1px solid var(--lab-grey-border); padding: 10px 16px; display: flex; gap: 20px; flex-wrap: wrap; font-size: 0.85rem; color: var(--lab-grey-mid); }\n  .email-body-parts { padding: 6px 0; }\n  .email-part { padding: 12px 16px; cursor: pointer; border-left: 4px solid transparent; }\n  .email-part:hover { background: var(--lab-grey-light); border-left-color: var(--lab-teal); }\n  .part-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--lab-teal); margin-bottom: 3px; }\n  .part-text { font-size: 0.95rem; white-space: pre-line; }\n  .part-note { font-size: 0.78rem; color: var(--lab-grey-mid); font-style: italic; margin-top: 4px; }\n  .annotation-panel { display: none; background: var(--lab-grey-light); border-left: 4px solid var(--lab-teal); padding: 14px 16px; margin: 0 16px 12px; font-size: 0.92rem; }\n  .annotation-panel.show { display: block; }\n  .annotation-panel h4 { font-size: 0.95rem; margin-bottom: 6px; }\n  .alts { margin-top: 8px; display: flex; flex-direction: column; gap: 5px; }\n  .alt-item { background: var(--lab-white); border: 1px solid var(--lab-grey-border); padding: 7px 10px; font-size: 0.88rem; }\n  .register-table { width: 100%; border-collapse: collapse; font-size: 0.92rem; margin-top: 10px; background: var(--lab-white); }\n  .register-table th { background: var(--lab-teal); color: var(--lab-white); padding: 8px 14px; text-align: left; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }\n  .register-table td { padding: 9px 14px; border-bottom: 1px solid var(--lab-grey-border); vertical-align: top; }\n  .register-table tr:nth-child(even) td { background: var(--lab-grey-light); }\n  .register-table .formal { color: var(--green); font-weight: 500; }\n  .register-table .informal { color: var(--red); }\n\n  footer { background: var(--lab-footer-bg); color: var(--lab-footer-text); padding: 30px 24px; font-size: 0.85rem; line-height: 1.7; }\n  .footer-inner { max-width: 1200px; margin: 0 auto; }\n  footer a { color: var(--lab-white); }\n\n  /* GLOBAL SEARCH */\n  .gs-group { margin-bottom: 20px; }\n  .gs-glabel { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--lab-grey-mid); margin-bottom: 8px; padding-bottom: 5px; border-bottom: 2px solid var(--lab-teal); }\n  .gs-hit { display: block; width: 100%; text-align: left; font-family: inherit; background: var(--lab-white); border: 1px solid var(--lab-grey-border); border-left: 4px solid var(--lab-teal); padding: 12px 14px; margin-bottom: 6px; cursor: pointer; color: var(--lab-black); }\n  .gs-hit:hover, .gs-hit:focus-visible { background: var(--lab-teal-light); outline: none; }\n  .gs-where { display: block; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--lab-grey-mid); margin-bottom: 3px; }\n  .gs-title { display: block; font-weight: 700; font-size: 1.02rem; }\n  .gs-snip { display: block; font-size: 0.88rem; color: var(--lab-grey-mid); margin-top: 3px; }\n  mark { background: var(--lab-teal-light); color: var(--lab-black); padding: 0 2px; }\n\n  /* QUIZ REVIEW */\n  .review { text-align: left; margin-top: 22px; }\n  .review-h { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--lab-grey-mid); border-bottom: 2px solid var(--lab-teal); padding-bottom: 6px; margin-bottom: 12px; }\n  .review-mod { font-weight: 700; color: var(--lab-teal); margin: 16px 0 8px; }\n  .review-item { background: var(--lab-white); border: 1px solid var(--lab-grey-border); border-left: 4px solid var(--red); padding: 12px 14px; margin-bottom: 8px; }\n  .review-q { font-weight: 700; margin-bottom: 6px; }\n  .review-a { font-size: 0.93rem; margin-bottom: 5px; }\n  .review-a span { display: block; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--lab-grey-mid); }\n  .review-r { font-size: 0.9rem; color: var(--lab-grey-mid); }\n  .review-none { margin-top: 16px; color: var(--lab-grey-mid); }\n\n  /* PRINT BOOK (built on demand, hidden on screen) */\n  #print-book { display: none; }\n\n  @media print {\n    @page { margin: 18mm 15mm; }\n    body { background: var(--lab-white); display: block; }\n    header, main, footer, #item-modal, .no-print { display: none !important; }\n    #print-book { display: block !important; font-size: 11.5pt; line-height: 1.5; color: #000; }\n    #print-book .pb-cover { text-align: left; padding-bottom: 12pt; border-bottom: 3pt solid var(--lab-teal); margin-bottom: 18pt; }\n    #print-book .pb-cover h1 { font-size: 30pt; letter-spacing: -0.02em; }\n    #print-book .pb-sub { font-size: 13pt; color: #333; margin-top: 6pt; }\n    #print-book .pb-credit { font-size: 10.5pt; color: #444; margin-top: 10pt; }\n    #print-book .pb-module { break-before: page; }\n    #print-book h2 { font-size: 20pt; letter-spacing: -0.02em; margin-bottom: 3pt; }\n    #print-book .pb-msub { font-size: 12pt; color: #333; margin-bottom: 10pt; }\n    #print-book .pb-intro { border-left: 3pt solid var(--lab-teal); padding: 6pt 10pt; margin-bottom: 7pt; font-size: 11pt; break-inside: avoid; }\n    #print-book .pb-sec { font-size: 11pt; text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 2pt solid var(--lab-teal); padding-bottom: 4pt; margin: 16pt 0 9pt; break-after: avoid; }\n    #print-book .pb-item { border: 0.75pt solid #999; padding: 9pt 11pt; margin-bottom: 8pt; break-inside: avoid; }\n    #print-book .pb-item h4 { font-size: 13pt; margin-bottom: 5pt; }\n    #print-book .pb-item h3 { font-size: 10.5pt; text-transform: uppercase; letter-spacing: 0.05em; color: #444; margin: 8pt 0 3pt; }\n    #print-book .pb-item section { margin-bottom: 6pt; }\n    #print-book ul { padding-left: 16pt; }\n    #print-book li { margin-bottom: 2pt; }\n    #print-book .phrase, #print-book .example-box { border-left: 3pt solid #999; padding: 5pt 8pt; margin-bottom: 4pt; background: none; }\n    #print-book .pb-vocab li { margin-bottom: 4pt; }\n    #print-book .pb-vocab b { font-weight: 700; }\n    #print-book .pb-table { width: 100%; border-collapse: collapse; font-size: 11pt; }\n    #print-book .pb-table th, #print-book .pb-table td { text-align: left; padding: 4pt 8pt; border-bottom: 0.5pt solid #999; vertical-align: top; }\n    #print-book .pb-table th { border-bottom: 1.5pt solid #000; }\n    #print-book .figure svg { max-width: 100%; height: auto; }\n    a { color: #000; text-decoration: none; }\n  }\n\n  @media (max-width: 700px) {\n    main { padding: 24px 16px 48px; }\n    .module-h { font-size: 1.5rem; }\n    .topic-grid { grid-template-columns: 1fr; }\n    .tab-btn { font-size: 0.75rem; padding: 7px 10px; }\n  }\n\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<nav class=\"site-nav no-print\">\n  <div class=\"site-nav-inner\">\n    <a class=\"brand\" href=\"index.html\">English for Business<\u002Fa>\n    <span class=\"links\">\n      <a href=\"index.html\">Main page<\u002Fa>\n      <a href=\"videos.html\">Videos<\u002Fa>\n      <a href=\"english-for-business-coursebook.html\" class=\"here\">Coursebook<\u002Fa>\n    <\u002Fspan>\n  <\u002Fdiv>\n<\u002Fnav>\n\n<header>\n  <div class=\"header-inner\">\n    <div>\n      <h1>English for Business<\u002Fh1>\n      <p class=\"credit\">Coursebook · Designed by <a href=\"https://www.linkedin.com/in/hagu1/\" target=\"_blank\" rel=\"noopener\">Hamid Guedra<\u002Fa> (Language Centre, <a href=\"https://lab.fi/en\" target=\"_blank\" rel=\"noopener\">LAB University of Applied Sciences<\u002Fa>)<\u002Fp>\n    <\u002Fdiv>\n    <nav class=\"tabs-bar\">\n        <button class=\"tab-btn\" data-view=\"start\">Start here<\u002Fbutton>\n        <button class=\"tab-btn\" data-view=\"m-basics\">1. Business English basics<\u002Fbutton>\n        <button class=\"tab-btn\" data-view=\"m-emails\">2. Professional emails<\u002Fbutton>\n        <button class=\"tab-btn\" data-view=\"m-meetings\">3. Business meetings<\u002Fbutton>\n        <button class=\"tab-btn\" data-view=\"m-charts\">4. Charts, graphs and data<\u002Fbutton>\n        <button class=\"tab-btn\" data-view=\"m-canvas\">5. The Business Model Canvas<\u002Fbutton>\n        <button class=\"tab-btn\" data-view=\"m-pitch\">6. Pitching your idea<\u002Fbutton>\n        <button class=\"tab-btn\" data-view=\"m-situations\">7. Getting a job and working with others<\u002Fbutton>\n        <button class=\"tab-btn\" data-view=\"search\">Search<\u002Fbutton>\n        <button class=\"tab-btn\" data-view=\"keywords\">Keywords EN–FI<\u002Fbutton>\n        <button class=\"tab-btn\" data-view=\"quiz\">Practice quiz<\u002Fbutton>\n    <\u002Fnav>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<main>\n\n      <div class=\"view-section\" id=\"view-start\">\n        <h2 class=\"module-h\">English for Business<\u002Fh2>\n        <div class=\"callout\"><strong>What this coursebook is for.<\u002Fstrong> It is a reference to use alongside the course: the language of the workplace, the situations you will meet, and the vocabulary that goes with them. The modules build on each other, so working through them in order is the easiest route, but you can also go straight to the part you need.<\u002Fdiv>\n        <p class=\"section-label\">Course learning outcomes<\u002Fp>\n        <div class=\"panel\">\n          <p>By the end of the course, you are able to:<\u002Fp>\n          <ul>\n            <li>communicate clearly and effectively in business-related workplace situations, both orally and in writing;<\u002Fli>\n            <li>find, evaluate and use information effectively;<\u002Fli>\n            <li>function collaboratively in international business environments.<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <p class=\"section-label\">How the modules fit together<\u002Fp>\n        <div class=\"path\">\n          <button class=\"path-step\" data-view=\"m-basics\">\n            <span class=\"path-num\">1<\u002Fspan>\n            <span class=\"path-body\"><span class=\"path-title\">Business English basics<\u002Fspan><span class=\"path-sub\">What it is, where it is used, and why the way you say things matters<\u002Fspan><\u002Fspan>\n          <\u002Fbutton>\n          <button class=\"path-step\" data-view=\"m-emails\">\n            <span class=\"path-num\">2<\u002Fspan>\n            <span class=\"path-body\"><span class=\"path-title\">Professional emails<\u002Fspan><span class=\"path-sub\">The most common written task in any workplace<\u002Fspan><\u002Fspan>\n          <\u002Fbutton>\n          <button class=\"path-step\" data-view=\"m-meetings\">\n            <span class=\"path-num\">3<\u002Fspan>\n            <span class=\"path-body\"><span class=\"path-title\">Business meetings<\u002Fspan><span class=\"path-sub\">Taking part, chairing, deciding, and writing it down<\u002Fspan><\u002Fspan>\n          <\u002Fbutton>\n          <button class=\"path-step\" data-view=\"m-charts\">\n            <span class=\"path-num\">4<\u002Fspan>\n            <span class=\"path-body\"><span class=\"path-title\">Charts, graphs and data<\u002Fspan><span class=\"path-sub\">Choosing the right visual, and describing it in English<\u002Fspan><\u002Fspan>\n          <\u002Fbutton>\n          <button class=\"path-step\" data-view=\"m-canvas\">\n            <span class=\"path-num\">5<\u002Fspan>\n            <span class=\"path-body\"><span class=\"path-title\">The Business Model Canvas<\u002Fspan><span class=\"path-sub\">Describing how a business actually works — on one page<\u002Fspan><\u002Fspan>\n          <\u002Fbutton>\n          <button class=\"path-step\" data-view=\"m-pitch\">\n            <span class=\"path-num\">6<\u002Fspan>\n            <span class=\"path-body\"><span class=\"path-title\">Pitching your idea<\u002Fspan><span class=\"path-sub\">Turning a business model into a three-minute talk<\u002Fspan><\u002Fspan>\n          <\u002Fbutton>\n          <button class=\"path-step\" data-view=\"m-situations\">\n            <span class=\"path-num\">7<\u002Fspan>\n            <span class=\"path-body\"><span class=\"path-title\">Getting a job and working with others<\u002Fspan><span class=\"path-sub\">Applications, skills, interviews, business fairs, and feedback<\u002Fspan><\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"callout\"><strong>How the modules build.<\u002Fstrong> Modules 1–3 are about <em>how<\u002Fem> to communicate: the level of formality, then writing, then speaking in real time. Module 4 adds showing as well as telling. Modules 5 and 6 give you something to communicate: how a business works, and how to present it. Module 7 puts it all together in the situations you will meet first.<\u002Fdiv>\n        <p class=\"section-label\">Offline copy<\u002Fp>\n        <div class=\"panel no-print\">\n          <p>You can print the whole coursebook or save it as a PDF: every module, every topic with its key points, phrases and vocabulary, and the full EN–FI word list, in one document.<\u002Fp>\n          <div class=\"btn-row\" style=\"justify-content: flex-start; margin-top: 12px;\"><button type=\"button\" class=\"btn-primary\" id=\"print-btn\">Print / save as PDF<\u002Fbutton><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"callout warn\"><strong>A note on the Finnish.<\u002Fstrong> The Finnish equivalents are there to help you check a meaning quickly. Many English business terms have more than one possible Finnish translation, and the right one depends on the situation. Use the English definition and example as your main guide.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"view-section hidden\" id=\"view-search\">\n        <h2 class=\"module-h\">Search<\u002Fh2>\n        <p class=\"module-sub\">Every module, topic, key point, phrase and word in the coursebook<\u002Fp>\n        <div class=\"kw-controls\">\n          <input type=\"text\" id=\"gs-input\" placeholder=\"Search the coursebook…\" aria-label=\"Search the coursebook\">\n        <\u002Fdiv>\n        <div class=\"kw-count\" id=\"gs-count\"><\u002Fdiv>\n        <div id=\"gs-body\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"view-section hidden\" id=\"view-m-basics\">\n        <h2 class=\"module-h\">1. Business English basics<\u002Fh2>\n        <p class=\"module-sub\">What it is, where it is used, and why the way you say things matters<\u002Fp>\n        <div class=\"callout\"><strong>Start here.<\u002Fstrong> Business English is not a different language. It is ordinary English used in work situations, with some special vocabulary and — more importantly — a different level of politeness and formality. You already know most of the words; the new skill is choosing the right ones for the reader in front of you. This module is about noticing that difference, because you will use it in every email, meeting and pitch on this course.<\u002Fdiv>\n        <div class=\"callout\"><strong>How to use:<\u002Fstrong> Click any topic to see key points, vocabulary and an example. Then try the <strong>Friends vs. Work<\u002Fstrong> exercise at the bottom of this page.<\u002Fdiv>\n        <p class=\"section-label\">Six things to understand first<\u002Fp>\n        <div class=\"topic-grid\">\n          <button class=\"topic-cell\" data-item=\"basics::Where do we use it?\">\n            <span class=\"topic-num\">1<\u002Fspan>\n            <span class=\"topic-title\">Where do we use it?<\u002Fspan>\n            \n          <\u002Fbutton>\n          <button class=\"topic-cell\" data-item=\"basics::How is it different?\">\n            <span class=\"topic-num\">2<\u002Fspan>\n            <span class=\"topic-title\">How is it different?<\u002Fspan>\n            \n          <\u002Fbutton>\n          <button class=\"topic-cell\" data-item=\"basics::Special vocabulary\">\n            <span class=\"topic-num\">3<\u002Fspan>\n            <span class=\"topic-title\">Special vocabulary<\u002Fspan>\n            \n          <\u002Fbutton>\n          <button class=\"topic-cell\" data-item=\"basics::Politeness and culture\">\n            <span class=\"topic-num\">4<\u002Fspan>\n            <span class=\"topic-title\">Politeness and culture<\u002Fspan>\n            \n          <\u002Fbutton>\n          <button class=\"topic-cell\" data-item=\"basics::Spoken and written skills\">\n            <span class=\"topic-num\">5<\u002Fspan>\n            <span class=\"topic-title\">Spoken and written skills<\u002Fspan>\n            \n          <\u002Fbutton>\n          <button class=\"topic-cell\" data-item=\"basics::Why is it useful?\">\n            <span class=\"topic-num\">6<\u002Fspan>\n            <span class=\"topic-title\">Why is it useful?<\u002Fspan>\n            \n          <\u002Fbutton>\n        <\u002Fdiv>\n        <p class=\"section-label\">Exercise · Friends vs. Work<\u002Fp>\n        <div class=\"callout\">Read the sentence you might say to a friend. Then choose the best <strong>work version<\u002Fstrong>. In business, <em>how<\u002Fem> you say something is often as important as <em>what<\u002Fem> you say.<\u002Fdiv>\n        <div class=\"quiz-card\" id=\"reg-basics\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"view-section hidden\" id=\"view-m-emails\">\n        <h2 class=\"module-h\">2. Professional emails<\u002Fh2>\n        <p class=\"module-sub\">The most common written task in any workplace<\u002Fp>\n        <div class=\"callout\"><strong>Why email first?<\u002Fstrong> Email is where most people are judged on their English at work. A clear, polite email gets an answer; an unclear one does not. Everything in Module 1 about formality applies here in a very practical way. On this course, you also practise email in a real exchange with a partner — so the phrases in this module are ones you will actually send.<\u002Fdiv>\n        <div class=\"callout\"><strong>How to use:<\u002Fstrong> Explore the email types and the parts of an email, then read the <strong>annotated model email<\u002Fstrong> and the <strong>formal vs informal<\u002Fstrong> table further down this page.<\u002Fdiv>\n        <p class=\"section-label\">Common email types<\u002Fp>\n        <div class=\"topic-grid\">\n          <button class=\"topic-cell\" data-item=\"emails::Enquiry email\">\n            <span class=\"topic-num\">1 🔎<\u002Fspan>\n            <span class=\"topic-title\">Enquiry email<\u002Fspan>\n            \n          <\u002Fbutton>\n          <button class=\"topic-cell\" data-item=\"emails::Cover letter email\">\n            <span class=\"topic-num\">2 📄<\u002Fspan>\n            <span class=\"topic-title\">Cover letter email<\u002Fspan>\n            \n          <\u002Fbutton>\n          <button class=\"topic-cell\" data-item=\"emails::Follow-up email\">\n            <span class=\"topic-num\">3 🔁<\u002Fspan>\n            <span class=\"topic-title\">Follow-up email<\u002Fspan>\n            \n          <\u002Fbutton>\n          <button class=\"topic-cell\" data-item=\"emails::Complaint email\">\n            <span class=\"topic-num\">4 ⚠️<\u002Fspan>\n            <span class=\"topic-title\">Complaint email<\u002Fspan>\n            \n          <\u002Fbutton>\n          <button class=\"topic-cell\" data-item=\"emails::Thank-you email\">\n            <span class=\"topic-num\">5 🙏<\u002Fspan>\n            <span class=\"topic-title\">Thank-you email<\u002Fspan>\n            \n          <\u002Fbutton>\n          <button class=\"topic-cell\" data-item=\"emails::Request email\">\n            <span class=\"topic-num\">6 📋<\u002Fspan>\n            <span class=\"topic-title\">Request email<\u002Fspan>\n            \n          <\u002Fbutton>\n        <\u002Fdiv>\n        <p class=\"section-label\">Parts of every professional email<\u002Fp>\n        <div class=\"topic-grid\">\n          <button class=\"topic-cell\" data-item=\"emails::Subject line\">\n            <span class=\"topic-num\">1 📌<\u002Fspan>\n            <span class=\"topic-title\">Subject line<\u002Fspan>\n            \n          <\u002Fbutton>\n          <button class=\"topic-cell\" data-item=\"emails::Greeting\">\n            <span class=\"topic-num\">2 👋<\u002Fspan>\n            <span class=\"topic-title\">Greeting<\u002Fspan>\n            \n          <\u002Fbutton>\n          <button class=\"topic-cell\" data-item=\"emails::Opening sentence\">\n            <span class=\"topic-num\">3 ▶️<\u002Fspan>\n            <span class=\"topic-title\">Opening sentence<\u002Fspan>\n            \n          <\u002Fbutton>\n          <button class=\"topic-cell\" data-item=\"emails::Closing\">\n            <span class=\"topic-num\">4 🤝<\u002Fspan>\n            <span class=\"topic-title\">Closing<\u002Fspan>\n            \n          <\u002Fbutton>\n        <\u002Fdiv>\n        <p class=\"section-label\">Annotated model email and register<\u002Fp>\n        <div class=\"info-strip\"><strong>How to read this:<\u002Fstrong> Below is a model cover letter email, broken into parts. Click any part to see an explanation, tips, and alternative phrases you can use.<\u002Fdiv>\n\n  <div style=\"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--gray-600);margin:0 0 12px;\">Model email — Cover letter email (job application)<\u002Fdiv>\n\n  <div class=\"annotated-email\">\n    <div class=\"email-header-bar\">\n      <span><strong>To:<\u002Fstrong> hiring@greenloop.fi<\u002Fspan>\n      <span><strong>From:<\u002Fstrong> sofia.makinen@student.lab.fi<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"email-body-parts\">\n      <div class=\"email-part\" onclick=\"toggleAnnotation('ann-subject')\">\n        <div class=\"part-label\">Subject line<\u002Fdiv>\n        <div class=\"part-text\">Application for Sales Assistant position — Sofia Mäkinen\n          <div class=\"part-note\">Click to see tips and alternatives →<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"annotation-panel\" id=\"ann-subject\">\n        <h4>📌 Subject line<\u002Fh4>\n        <p>A good subject line tells the reader exactly what the email is about before they open it. Include the job title and your name so it is easy to identify.<\u002Fp>\n        <div class=\"alts\">\n          <div class=\"alt-item\">\"Application — Marketing Trainee — Aleksi Virtanen\"<\u002Fdiv>\n          <div class=\"alt-item\">\"Job application: Customer Service role — Maria Korhonen\"<\u002Fdiv>\n          <div class=\"alt-item\">\"Re: Sales Assistant vacancy — cover letter enclosed\"<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"email-part\" onclick=\"toggleAnnotation('ann-greeting')\">\n        <div class=\"part-label\">Greeting<\u002Fdiv>\n        <div class=\"part-text\">Dear Hiring Team,\n          <div class=\"part-note\">Click to see tips and alternatives →<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"annotation-panel\" id=\"ann-greeting\">\n        <h4>👋 Greeting<\u002Fh4>\n        <p>Use <em>Dear<\u002Fem> + a name or title. If you do not know the person's name, <em>Dear Hiring Team<\u002Fem> or <em>Dear Hiring Manager<\u002Fem> is correct. Avoid <em>To Whom It May Concern<\u002Fem> — it sounds old-fashioned.<\u002Fp>\n        <p style=\"margin-top:8px;\"><strong>Not sure of the person's gender?<\u002Fstrong> If the name is unfamiliar or from another culture and you cannot tell whether the person uses Mr or Ms, avoid guessing. Use their full name instead — <em>Dear Alex Kim,<\u002Fem> — or use a neutral title such as <em>Dear Hiring Manager<\u002Fem>. This is always safe and professional.<\u002Fp>\n        <div class=\"alts\">\n          <div class=\"alt-item\">\"Dear Ms Leinonen,\" (you know she uses Ms)<\u002Fdiv>\n          <div class=\"alt-item\">\"Dear Alex Kim,\" (full name — safe when gender is unclear)<\u002Fdiv>\n          <div class=\"alt-item\">\"Dear Hiring Manager,\" (no name known)<\u002Fdiv>\n          <div class=\"alt-item\">\"Dear GreenLoop Recruitment Team,\" (addressing a team)<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"email-part\" onclick=\"toggleAnnotation('ann-opening')\">\n        <div class=\"part-label\">Opening paragraph<\u002Fdiv>\n        <div class=\"part-text\">I am writing to apply for the Sales Assistant position at GreenLoop, advertised on your website. I am a first-year business student at LAB University of Applied Sciences with a strong interest in sustainable retail.\n          <div class=\"part-note\">Click to see tips and alternatives →<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"annotation-panel\" id=\"ann-opening\">\n        <h4>▶️ Opening paragraph<\u002Fh4>\n        <p>Your first sentence should say who you are and why you are writing. Mention where you saw the job advertisement if possible. Keep it to 2–3 sentences.<\u002Fp>\n        <div class=\"alts\">\n          <div class=\"alt-item\">\"I am writing to express my interest in the Customer Service Trainee role at GreenLoop.\"<\u002Fdiv>\n          <div class=\"alt-item\">\"I would like to apply for the position of Marketing Assistant, as advertised on LinkedIn.\"<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"email-part\" onclick=\"toggleAnnotation('ann-skills')\">\n        <div class=\"part-label\">Skills paragraph<\u002Fdiv>\n        <div class=\"part-text\">I have experience working in a customer-facing role at a local café, where I developed my communication and teamwork skills. In my studies, I have also practised professional writing in English and completed a business plan project that included market research and customer segmentation.\n          <div class=\"part-note\">Click to see tips and alternatives →<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"annotation-panel\" id=\"ann-skills\">\n        <h4>💼 Skills paragraph<\u002Fh4>\n        <p>Describe 2–3 relevant skills. For each one, give a short example — do not just list skills. Use this structure: skill + example + result or learning.<\u002Fp>\n        <div class=\"alts\">\n          <div class=\"alt-item\">\"I am a reliable team player. During a group project, I coordinated communication and made sure we met our deadline.\"<\u002Fdiv>\n          <div class=\"alt-item\">\"My written English skills are strong, and I have practised writing formal reports and emails during my Business English course.\"<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"email-part\" onclick=\"toggleAnnotation('ann-closing')\">\n        <div class=\"part-label\">Closing paragraph<\u002Fdiv>\n        <div class=\"part-text\">I would welcome the opportunity to discuss my application further. Please find my CV attached. I look forward to hearing from you.\n          <div class=\"part-note\">Click to see tips and alternatives →<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"annotation-panel\" id=\"ann-closing\">\n        <h4>🤝 Closing paragraph<\u002Fh4>\n        <p>End by expressing interest in the next step. Mention any attachments. Keep it short — 2–3 sentences maximum.<\u002Fp>\n        <div class=\"alts\">\n          <div class=\"alt-item\">\"I am available for an interview at your convenience and look forward to hearing from you.\"<\u002Fdiv>\n          <div class=\"alt-item\">\"Thank you for considering my application. I hope to have the opportunity to discuss it with you.\"<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"email-part\" onclick=\"toggleAnnotation('ann-signoff')\">\n        <div class=\"part-label\">Sign-off<\u002Fdiv>\n        <div class=\"part-text\">Kind regards,<br>Sofia Mäkinen<br>LAB University of Applied Sciences<br>sofia.makinen@student.lab.fi\n          <div class=\"part-note\">Click to see tips and alternatives →<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"annotation-panel\" id=\"ann-signoff\">\n        <h4>✍️ Sign-off<\u002Fh4>\n        <p><strong>Kind regards<\u002Fstrong> and <strong>Best regards<\u002Fstrong> are the most common sign-offs in modern professional email — use them in almost all situations. <em>Yours sincerely<\u002Fem> and <em>Yours faithfully<\u002Fem> are still correct in very formal letters, but they are old-fashioned in everyday business email. Always include your full name and contact details below the sign-off.<\u002Fp>\n        <div class=\"alts\">\n          <div class=\"alt-item\">\"Kind regards, [Full name]\" — most common in professional email<\u002Fdiv>\n          <div class=\"alt-item\">\"Best regards, [Full name]\" — equally common, slightly warmer<\u002Fdiv>\n          <div class=\"alt-item\">\"Best wishes, [Full name]\" — friendly and professional; good for ongoing relationships<\u002Fdiv>\n          <div class=\"alt-item\">\"Yours sincerely, [Full name]\" — very formal; correct but old-fashioned for email<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:white;border:1px solid var(--gray-200);padding:20px;\">\n    <h3 style=\"font-size:15px;font-weight:700;margin-bottom:14px;color:var(--gray-900);\">✅ Do and ❌ Don't<\u002Fh3>\n    <div class=\"dos-donts\">\n      <div class=\"do-list\">\n        <h4>✅ Do<\u002Fh4>\n        <ul>\n          <li>Use full sentences — no contractions (write <em>I am<\u002Fem>, not <em>I'm<\u002Fem>)<\u002Fli>\n          <li>Keep the email between 100–150 words for a cover letter; other emails can be longer<\u002Fli>\n          <li>Use a clear, specific subject line<\u002Fli>\n          <li>Start by saying why you are writing<\u002Fli>\n          <li>Give examples for your skills — not just claims<\u002Fli>\n          <li>Proofread before sending<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"dont-list\">\n        <h4>❌ Don't<\u002Fh4>\n        <ul>\n          <li>Use slang or informal language (<em>Hey, Thanks a lot, FYI<\u002Fem>)<\u002Fli>\n          <li>Use contractions (<em>I'm, I've, can't, don't<\u002Fem>)<\u002Fli>\n          <li>Write very long paragraphs — keep them short<\u002Fli>\n          <li>Leave the subject line blank or vague (<em>Hello, Hi<\u002Fem>)<\u002Fli>\n          <li>Forget to include your name and contact details<\u002Fli>\n          <li>Copy from AI without reading and checking carefully<\u002Fli>\n          <li>Begin with <em>I hope this email finds you well<\u002Fem> — overused and empty<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<div class=\"info-strip\"><strong>What is register?<\u002Fstrong> Register means the level of formality in your writing. Professional emails use a formal or semi-formal register. Informal language — like contractions and slang — is not appropriate. Use this page to learn the difference.<\u002Fdiv>\n\n  <div style=\"background:white;border:1px solid var(--gray-200);padding:24px;margin-bottom:16px;\">\n    <h2 style=\"font-size:17px;font-weight:700;margin-bottom:6px;color:var(--gray-900);\">Formal vs. informal — key differences<\u002Fh2>\n    <p style=\"font-size:13.5px;color:var(--gray-600);margin-bottom:16px;\">The table below shows common informal phrases and the formal alternatives you should use in professional emails.<\u002Fp>\n    <table class=\"register-table\">\n      <thead><tr><th>Instead of (informal)<\u002Fth><th>Use this (formal)<\u002Fth><\u002Ftr><\u002Fthead>\n      <tbody>\n        <tr><td class=\"informal\">Hey / Hi [first name]<\u002Ftd><td class=\"formal\">Dear Mr/Ms [Last name] / Dear Hiring Team<\u002Ftd><\u002Ftr>\n        <tr><td class=\"informal\">I'm writing to...<\u002Ftd><td class=\"formal\">I am writing to...<\u002Ftd><\u002Ftr>\n        <tr><td class=\"informal\">Can you...?<\u002Ftd><td class=\"formal\">Could you please...? / I would be grateful if you could...<\u002Ftd><\u002Ftr>\n        <tr><td class=\"informal\">I want to apply for...<\u002Ftd><td class=\"formal\">I would like to apply for... / I am writing to apply for...<\u002Ftd><\u002Ftr>\n        <tr><td class=\"informal\">Thanks a lot / Thanks!<\u002Ftd><td class=\"formal\">Thank you for your time. / Thank you for your consideration.<\u002Ftd><\u002Ftr>\n        <tr><td class=\"informal\">I've got experience in...<\u002Ftd><td class=\"formal\">I have experience in...<\u002Ftd><\u002Ftr>\n        <tr><td class=\"informal\">I think I'd be great for this job<\u002Ftd><td class=\"formal\">I believe I have the skills required for this position.<\u002Ftd><\u002Ftr>\n        <tr><td class=\"informal\">Let me know if you need anything<\u002Ftd><td class=\"formal\">Please do not hesitate to contact me if you require further information.<\u002Ftd><\u002Ftr>\n        <tr><td class=\"informal\">Cheers / Bye<\u002Ftd><td class=\"formal\">Kind regards, / Best regards, / Best wishes,<\u002Ftd><\u002Ftr>\n        <tr><td class=\"informal\">ASAP / FYI / BTW<\u002Ftd><td class=\"formal\">As soon as possible / I would like to inform you that / Regarding<\u002Ftd><\u002Ftr>\n        <tr><td class=\"informal\">Sorry for the late reply<\u002Ftd><td class=\"formal\">I apologise for the delay in my response.<\u002Ftd><\u002Ftr>\n        <tr><td class=\"informal\">I saw your job ad online<\u002Ftd><td class=\"formal\">I am writing in response to the position advertised on your website.<\u002Ftd><\u002Ftr>\n      <\u002Ftbody>\n    <\u002Ftable>\n  <\u002Fdiv>\n\n  <div style=\"background:white;border:1px solid var(--gray-200);padding:24px;\">\n    <h2 style=\"font-size:17px;font-weight:700;margin-bottom:6px;color:var(--gray-900);\">Contractions — never use them in formal emails<\u002Fh2>\n    <p style=\"font-size:13.5px;color:var(--gray-600);margin-bottom:16px;\">A contraction joins two words with an apostrophe. For example, <em>I'm = I am<\u002Fem>. In professional emails, always write the full form.<\u002Fp>\n    <div class=\"email-grid\" style=\"gap:8px;\">\n      <div style=\"background:var(--red-light);padding:14px 16px;\">\n        <div style=\"font-size:12px;font-weight:700;color:var(--red);margin-bottom:8px;\">❌ Do not use<\u002Fdiv>\n        <div style=\"font-size:13.5px;color:var(--red);line-height:1.9;\">I'm · I've · I'd · I'll · can't · don't · won't · it's · there's · we're · you're · haven't · wouldn't · couldn't · didn't<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--green-light);padding:14px 16px;\">\n        <div style=\"font-size:12px;font-weight:700;color:var(--green);margin-bottom:8px;\">✅ Always write the full form<\u002Fdiv>\n        <div style=\"font-size:13.5px;color:var(--green);line-height:1.9;\">I am · I have · I would · I will · cannot · do not · will not · it is · there is · we are · you are · have not · would not · could not · did not<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n      <\u002Fdiv>\n\n      <div class=\"view-section hidden\" id=\"view-m-meetings\">\n        <h2 class=\"module-h\">3. Business meetings<\u002Fh2>\n        <p class=\"module-sub\">Taking part, chairing, deciding, and writing it down<\u002Fp>\n        <div class=\"callout\"><strong>From writing to speaking.<\u002Fstrong> A meeting is where the language of Modules 1 and 2 has to work in real time. You cannot redraft a sentence you have already said, so it helps to have ready-made phrases for the moments that come up again and again. With a small set of them, you can open a meeting, interrupt politely, disagree without sounding rude, and close on time — in English, under pressure.<\u002Fdiv>\n        <div class=\"callout\"><strong>How to use:<\u002Fstrong> Work through the eight topics in order — they follow a meeting from the invitation to the minutes. Then try the <strong>Say It Right<\u002Fstrong> exercise.<\u002Fdiv>\n        <p class=\"section-label\">A meeting from start to finish<\u002Fp>\n        <div class=\"topic-grid\">\n          <button class=\"topic-cell\" data-item=\"meetings::Types of meetings\">\n            <span class=\"topic-num\">1<\u002Fspan>\n            <span class=\"topic-title\">Types of meetings<\u002Fspan>\n            \n          <\u002Fbutton>\n          <button class=\"topic-cell\" data-item=\"meetings::Meeting roles\">\n            <span class=\"topic-num\">2<\u002Fspan>\n            <span class=\"topic-title\">Meeting roles<\u002Fspan>\n            \n          <\u002Fbutton>\n          <button class=\"topic-cell\" data-item=\"meetings::Before the meeting\">\n            <span class=\"topic-num\">3<\u002Fspan>\n            <span class=\"topic-title\">Before the meeting<\u002Fspan>\n            \n          <\u002Fbutton>\n          <button class=\"topic-cell\" data-item=\"meetings::Opening a meeting\">\n            <span class=\"topic-num\">4<\u002Fspan>\n            <span class=\"topic-title\">Opening a meeting<\u002Fspan>\n            \n          <\u002Fbutton>\n          <button class=\"topic-cell\" data-item=\"meetings::Taking part\">\n            <span class=\"topic-num\">5<\u002Fspan>\n            <span class=\"topic-title\">Taking part<\u002Fspan>\n            \n          <\u002Fbutton>\n          <button class=\"topic-cell\" data-item=\"meetings::Managing the discussion\">\n            <span class=\"topic-num\">6<\u002Fspan>\n            <span class=\"topic-title\">Managing the discussion<\u002Fspan>\n            \n          <\u002Fbutton>\n          <button class=\"topic-cell\" data-item=\"meetings::Decisions and actions\">\n            <span class=\"topic-num\">7<\u002Fspan>\n            <span class=\"topic-title\">Decisions and actions<\u002Fspan>\n            \n          <\u002Fbutton>\n          <button class=\"topic-cell\" data-item=\"meetings::Closing and follow-up\">\n            <span class=\"topic-num\">8<\u002Fspan>\n            <span class=\"topic-title\">Closing and follow-up<\u002Fspan>\n            \n          <\u002Fbutton>\n        <\u002Fdiv>\n        <p class=\"section-label\">Exercise · Say It Right<\u002Fp>\n        <div class=\"callout\">Read what you might <em>think<\u002Fem>, or say to a friend. Then choose the best way to say it <strong>in a meeting<\u002Fstrong>.<\u002Fdiv>\n        <div class=\"quiz-card\" id=\"reg-meetings\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"view-section hidden\" id=\"view-m-charts\">\n        <h2 class=\"module-h\">4. Charts, graphs and data<\u002Fh2>\n        <p class=\"module-sub\">Choosing the right visual, and describing it in English<\u002Fp>\n        <div class=\"callout\"><strong>Showing information, not just telling it.<\u002Fstrong> Reports, presentations and pitches are full of charts. A reader who would skip a paragraph of figures will look at a chart and understand it in a second — but only if you chose the right one, and only if you say what it means. You will need both skills for your business plan report and your pitch, where one good chart can carry a whole argument.<\u002Fdiv>\n        <div class=\"callout\"><strong>Two skills, not one.<\u002Fstrong> The first half of this module is about choosing: which chart answers which kind of question. The second half is the English: the verbs, adverbs and sentence patterns you need to describe what a chart shows.<\u002Fdiv>\n        <div class=\"callout\"><strong>How to use:<\u002Fstrong> Read the first card, then the seven chart types, then the two cards on choosing and describing. Finish with the exercise at the bottom of the page.<\u002Fdiv>\n        <p class=\"section-label\">Ten things to know about charts<\u002Fp>\n        <div class=\"topic-grid\">\n          <button class=\"topic-cell full\" data-item=\"charts::What charts and diagrams do\">\n            <span class=\"topic-num\">1<\u002Fspan>\n            <span class=\"topic-title\">What charts and diagrams do<\u002Fspan>\n            \n          <\u002Fbutton>\n          <button class=\"topic-cell\" data-item=\"charts::Bar charts\">\n            <span class=\"topic-num\">2<\u002Fspan>\n            <span class=\"topic-title\">Bar charts<\u002Fspan>\n            \n          <\u002Fbutton>\n          <button class=\"topic-cell\" data-item=\"charts::Line graphs\">\n            <span class=\"topic-num\">3<\u002Fspan>\n            <span class=\"topic-title\">Line graphs<\u002Fspan>\n            \n          <\u002Fbutton>\n          <button class=\"topic-cell\" data-item=\"charts::Pie charts\">\n            <span class=\"topic-num\">4<\u002Fspan>\n            <span class=\"topic-title\">Pie charts<\u002Fspan>\n            \n          <\u002Fbutton>\n          <button class=\"topic-cell\" data-item=\"charts::Histograms\">\n            <span class=\"topic-num\">5<\u002Fspan>\n            <span class=\"topic-title\">Histograms<\u002Fspan>\n            \n          <\u002Fbutton>\n          <button class=\"topic-cell\" data-item=\"charts::Scatter plots\">\n            <span class=\"topic-num\">6<\u002Fspan>\n            <span class=\"topic-title\">Scatter plots<\u002Fspan>\n            \n          <\u002Fbutton>\n          <button class=\"topic-cell\" data-item=\"charts::Venn diagrams\">\n            <span class=\"topic-num\">7<\u002Fspan>\n            <span class=\"topic-title\">Venn diagrams<\u002Fspan>\n            \n          <\u002Fbutton>\n          <button class=\"topic-cell\" data-item=\"charts::Flow charts\">\n            <span class=\"topic-num\">8<\u002Fspan>\n            <span class=\"topic-title\">Flow charts<\u002Fspan>\n            \n          <\u002Fbutton>\n          <button class=\"topic-cell\" data-item=\"charts::Choosing the right chart\">\n            <span class=\"topic-num\">9<\u002Fspan>\n            <span class=\"topic-title\">Choosing the right chart<\u002Fspan>\n            \n          <\u002Fbutton>\n          <button class=\"topic-cell\" data-item=\"charts::Describing a chart in English\">\n            <span class=\"topic-num\">10<\u002Fspan>\n            <span class=\"topic-title\">Describing a chart in English<\u002Fspan>\n            \n          <\u002Fbutton>\n        <\u002Fdiv>\n        <p class=\"section-label\">Exercise · Which chart?<\u002Fp>\n        <div class=\"callout\">Read what you need to show. Then choose the chart that shows it best. In every case more than one chart could be drawn — the question is which one answers the reader’s question fastest.<\u002Fdiv>\n        <div class=\"quiz-card\" id=\"reg-charts\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"view-section hidden\" id=\"view-m-canvas\">\n        <h2 class=\"module-h\">5. The Business Model Canvas<\u002Fh2>\n        <p class=\"module-sub\">Describing how a business actually works — on one page<\u002Fp>\n        <div class=\"callout\"><strong>From communication to content.<\u002Fstrong> Modules 1–4 were about <em>how<\u002Fem> to say things and how to show them. Modules 5 and 6 give you something to say. The Business Model Canvas (Alexander Osterwalder and Yves Pigneur) is a one-page tool that describes any business idea in nine blocks. In this course, it is the starting point for your business plan report: seven of the nine blocks become the sections of your report.<\u002Fdiv>\n        <div class=\"callout\"><strong>How to use:<\u002Fstrong> The nine blocks are in three groups. The <strong>customer side<\u002Fstrong> is about who your customers are and how you reach and keep them. The <strong>money<\u002Fstrong> blocks show what comes in and what goes out. The <strong>business side<\u002Fstrong> is about what you need to make it all work. Click each block — together they answer one question: how does this company create value, deliver it, and earn money from it?<\u002Fdiv>\n        <p class=\"section-label\">Customer side<\u002Fp>\n        <div class=\"topic-grid\">\n          <button class=\"topic-cell\" data-item=\"canvas::Value Propositions\">\n            <span class=\"topic-num\">🎁<\u002Fspan>\n            <span class=\"topic-title\">Value Propositions<\u002Fspan>\n            \n          <\u002Fbutton>\n          <button class=\"topic-cell\" data-item=\"canvas::Customer Segments\">\n            <span class=\"topic-num\">👥<\u002Fspan>\n            <span class=\"topic-title\">Customer Segments<\u002Fspan>\n            \n          <\u002Fbutton>\n          <button class=\"topic-cell\" data-item=\"canvas::Channels\">\n            <span class=\"topic-num\">🚚<\u002Fspan>\n            <span class=\"topic-title\">Channels<\u002Fspan>\n            \n          <\u002Fbutton>\n          <button class=\"topic-cell\" data-item=\"canvas::Customer Relationships\">\n            <span class=\"topic-num\">❤️<\u002Fspan>\n            <span class=\"topic-title\">Customer Relationships<\u002Fspan>\n            \n          <\u002Fbutton>\n        <\u002Fdiv>\n        <p class=\"section-label\">Money<\u002Fp>\n        <div class=\"topic-grid\">\n          <button class=\"topic-cell\" data-item=\"canvas::Revenue Streams\">\n            <span class=\"topic-num\">💰<\u002Fspan>\n            <span class=\"topic-title\">Revenue Streams<\u002Fspan>\n            \n          <\u002Fbutton>\n          <button class=\"topic-cell\" data-item=\"canvas::Cost Structure\">\n            <span class=\"topic-num\">📊<\u002Fspan>\n            <span class=\"topic-title\">Cost Structure<\u002Fspan>\n            \n          <\u002Fbutton>\n        <\u002Fdiv>\n        <p class=\"section-label\">Business side<\u002Fp>\n        <div class=\"topic-grid\">\n          <button class=\"topic-cell\" data-item=\"canvas::Key Resources\">\n            <span class=\"topic-num\">🧰<\u002Fspan>\n            <span class=\"topic-title\">Key Resources<\u002Fspan>\n            \n          <\u002Fbutton>\n          <button class=\"topic-cell\" data-item=\"canvas::Key Activities\">\n            <span class=\"topic-num\">⚙️<\u002Fspan>\n            <span class=\"topic-title\">Key Activities<\u002Fspan>\n            \n          <\u002Fbutton>\n          <button class=\"topic-cell\" data-item=\"canvas::Key Partners\">\n            <span class=\"topic-num\">🤝<\u002Fspan>\n            <span class=\"topic-title\">Key Partners<\u002Fspan>\n            \n          <\u002Fbutton>\n        <\u002Fdiv>\n        <p class=\"section-label\">Practice quiz<\u002Fp>\n        <div class=\"callout\">Ten questions on the nine blocks. Which blocks do you mix up?<\u002Fdiv>\n        <div class=\"quiz-card\" id=\"practice-bmc-card\"><div class=\"btn-row\"><button type=\"button\" class=\"btn-primary\" id=\"practice-bmc-start\">Start the Practice quiz<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"view-section hidden\" id=\"view-m-pitch\">\n        <h2 class=\"module-h\">6. Pitching your idea<\u002Fh2>\n        <p class=\"module-sub\">Turning a business model into a three-minute talk<\u002Fp>\n        <div class=\"callout\"><strong>Now say it out loud.<\u002Fstrong> A pitch is a short talk — often three minutes — where you present a business idea to investors, customers or a jury. In this course, you structure your pitch with the <strong>ANSVA model<\u002Fstrong>: Attention, Need, Solution, Visualization, Action. ANSVA is based on Monroe’s Motivated Sequence, a classic five-step plan for persuasive talks (Alan H. Monroe, 1935). The order matters: first you earn attention, then you show a need, and only then do you present your solution — so the audience is ready to hear it.<\u002Fdiv>\n        <div class=\"callout\"><strong>How to use:<\u002Fstrong> Click the five parts in order. Every part includes questions to answer, phrases you can reuse and an example from a student company called Snowbox.<\u002Fdiv>\n        <p class=\"section-label\">The five parts, in the order you say them<\u002Fp>\n        <div class=\"topic-grid\">\n          <button class=\"topic-cell full\" data-item=\"pitch::Attention\">\n            <span class=\"topic-num\">1 💬<\u002Fspan>\n            <span class=\"topic-title\">Attention<\u002Fspan>\n            <span class=\"topic-sub\">Make them want to listen<\u002Fspan>\n          <\u002Fbutton>\n          <button class=\"topic-cell\" data-item=\"pitch::Need\">\n            <span class=\"topic-num\">2 🎭<\u002Fspan>\n            <span class=\"topic-title\">Need<\u002Fspan>\n            <span class=\"topic-sub\">Show the problem is real<\u002Fspan>\n          <\u002Fbutton>\n          <button class=\"topic-cell\" data-item=\"pitch::Solution\">\n            <span class=\"topic-num\">3 💡<\u002Fspan>\n            <span class=\"topic-title\">Solution<\u002Fspan>\n            <span class=\"topic-sub\">Present your idea and show it<\u002Fspan>\n          <\u002Fbutton>\n          <button class=\"topic-cell\" data-item=\"pitch::Visualization\">\n            <span class=\"topic-num\">4 🖼️<\u002Fspan>\n            <span class=\"topic-title\">Visualization<\u002Fspan>\n            <span class=\"topic-sub\">Help them see the future<\u002Fspan>\n          <\u002Fbutton>\n          <button class=\"topic-cell\" data-item=\"pitch::Action\">\n            <span class=\"topic-num\">5 👉<\u002Fspan>\n            <span class=\"topic-title\">Action<\u002Fspan>\n            <span class=\"topic-sub\">Tell them what to do next<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"view-section hidden\" id=\"view-m-situations\">\n        <h2 class=
