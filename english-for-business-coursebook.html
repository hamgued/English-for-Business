\"module-h\">7. Getting a job and working with others<\u002Fh2>\n        <p class=\"module-sub\">Applications, skills, interviews, business fairs, and feedback<\u002Fp>\n        <div class=\"callout\"><strong>Putting it together.<\u002Fstrong> This module follows the order you will meet these things: writing an application, working out what your skills actually are, describing them so an employer believes you, the interview itself, meeting people at a fair, and giving or receiving feedback once you are working. Everything here builds on the earlier modules — the same polite, clear English, now used to talk about yourself.<\u002Fdiv>\n        <div class=\"callout\"><strong>The part most applicants get wrong.<\u002Fstrong> Almost everyone lists their hard skills and then claims their soft skills. Topics 2 and 3 are about the difference, and about how to make a claim believable by attaching it to something you actually did.<\u002Fdiv>\n        <div class=\"callout\"><strong>How to use:<\u002Fstrong> Read the six topics in order, then try the exercise at the bottom of the page.<\u002Fdiv>\n        <p class=\"section-label\">Three situations you will meet<\u002Fp>\n        <div class=\"topic-grid\">\n          <button class=\"topic-cell\" data-item=\"situations::Job applications\">\n            <span class=\"topic-num\">1<\u002Fspan>\n            <span class=\"topic-title\">Job applications<\u002Fspan>\n            \n          <\u002Fbutton>\n          <button class=\"topic-cell\" data-item=\"situations::Hard and soft skills\">\n            <span class=\"topic-num\">2<\u002Fspan>\n            <span class=\"topic-title\">Hard and soft skills<\u002Fspan>\n            \n          <\u002Fbutton>\n          <button class=\"topic-cell\" data-item=\"situations::Talking about your skills\">\n            <span class=\"topic-num\">3<\u002Fspan>\n            <span class=\"topic-title\">Talking about your skills<\u002Fspan>\n            \n          <\u002Fbutton>\n          <button class=\"topic-cell\" data-item=\"situations::Job interviews\">\n            <span class=\"topic-num\">4<\u002Fspan>\n            <span class=\"topic-title\">Job interviews<\u002Fspan>\n            \n          <\u002Fbutton>\n          <button class=\"topic-cell\" data-item=\"situations::Business fairs and networking\">\n            <span class=\"topic-num\">5<\u002Fspan>\n            <span class=\"topic-title\">Business fairs and networking<\u002Fspan>\n            \n          <\u002Fbutton>\n          <button class=\"topic-cell\" data-item=\"situations::Giving and receiving feedback\">\n            <span class=\"topic-num\">6<\u002Fspan>\n            <span class=\"topic-title\">Giving and receiving feedback<\u002Fspan>\n            \n          <\u002Fbutton>\n        <\u002Fdiv>\n        <p class=\"section-label\">Exercise · Say It Better<\u002Fp>\n        <div class=\"callout\">Read the weak or blunt version. Then choose the wording that would actually work in an application, an interview, at a fair, or in feedback.<\u002Fdiv>\n        <div class=\"quiz-card\" id=\"reg-situations\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"view-section hidden\" id=\"view-keywords\">\n        <h2 class=\"module-h\">Keywords: English – Finnish<\u002Fh2>\n        <p class=\"module-sub\">Every term in the coursebook, with a Finnish equivalent<\u002Fp>\n        <div class=\"callout\">Type in the box to search in English or Finnish. Use the list to check a meaning — not as the only possible translation.<\u002Fdiv>\n        <div class=\"kw-controls\">\n          <input type=\"text\" id=\"kw-search\" placeholder=\"Search a word…\" aria-label=\"Search keywords\">\n          <select id=\"kw-filter\" aria-label=\"Filter by module\">\n            <option value=\"all\">All modules<\u002Foption>\n            <option value=\"basics\">1. Business English basics<\u002Foption>\n            <option value=\"emails\">2. Professional emails<\u002Foption>\n            <option value=\"meetings\">3. Business meetings<\u002Foption>\n            <option value=\"charts\">4. Charts, graphs and data<\u002Foption>\n            <option value=\"canvas\">5. The Business Model Canvas<\u002Foption>\n            <option value=\"pitch\">6. Pitching your idea<\u002Foption>\n            <option value=\"situations\">7. Getting a job and working with others<\u002Foption>\n          <\u002Fselect>\n        <\u002Fdiv>\n        <p class=\"kw-count\" id=\"kw-count\"><\u002Fp>\n        <div id=\"kw-body\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"view-section hidden\" id=\"view-quiz\">\n        <h2 class=\"module-h\">Practice quiz<\u002Fh2>\n        <p class=\"module-sub\">Check what you remember<\u002Fp>\n        <div class=\"callout\">Choose a module, or take all the questions together. You will see an explanation after every answer.<\u002Fdiv>\n        <div class=\"kw-controls\">\n          <select id=\"quiz-pick\" aria-label=\"Choose a quiz\">\n            <option value=\"all\">All modules (113 questions)<\u002Foption>\n            <option value=\"basics\">1. Business English basics (15)<\u002Foption>\n            <option value=\"emails\">2. Professional emails (18)<\u002Foption>\n            <option value=\"meetings\">3. Business meetings (22)<\u002Foption>\n            <option value=\"charts\">4. Charts, graphs and data (14)<\u002Foption>\n            <option value=\"canvas\">5. The Business Model Canvas (13)<\u002Foption>\n            <option value=\"pitch\">6. Pitching your idea (13)<\u002Foption>\n            <option value=\"situations\">7. Getting a job and working with others (18)<\u002Foption>\n          <\u002Fselect>\n          <button class=\"btn-primary\" id=\"quiz-start\">Start<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"quiz-card\" id=\"quiz-card\"><\u002Fdiv>\n      <\u002Fdiv>\n<\u002Fmain>\n\n<div id=\"print-book\" aria-hidden=\"true\"><\u002Fdiv>\n\n<div id=\"item-modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"modal-name\">\n  <div class=\"modal-panel\">\n    <div class=\"modal-head\">\n      <h2 id=\"modal-name\"><span class=\"order\" id=\"modal-order\"><\u002Fspan><span id=\"modal-title\"><\u002Fspan><\u002Fh2>\n      <button class=\"modal-close\" id=\"modal-close-x\" aria-label=\"Close\">✕<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"modal-body\" id=\"modal-body\"><\u002Fdiv>\n    <div class=\"modal-foot\">\n      <button class=\"btn-ghost\" id=\"modal-prev\">← Previous<\u002Fbutton>\n      <div style=\"display:flex;gap:8px;\">\n        <button class=\"btn-ghost\" id=\"modal-next\">Next →<\u002Fbutton>\n        <button class=\"btn-primary\" id=\"modal-close\">Close<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<footer>\n  <div class=\"footer-inner\">\n    <p><a href=\"index.html\">Main page<\u002Fa> · <a href=\"videos.html\">Course videos<\u002Fa><\u002Fp>\n    <p>Designed by <a href=\"https://www.linkedin.com/in/hagu1/\" target=\"_blank\" rel=\"noopener\">Hamid Guedra<\u002Fa> (Language Centre, <a href=\"https://lab.fi/en\" target=\"_blank\" rel=\"noopener\">LAB University of Applied Sciences<\u002Fa>). Credits and sources are on the <a href=\"index.html\">main page<\u002Fa>.<\u002Fp>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<script>\nvar DATA = {\"MODULES\": [{\"id\": \"basics\",\"num\": 1,\"title\": \"Business English basics\",\"sub\": \"What it is, where it is used, and why the way you say things matters\",\"intro\": [\"<strong>Start here.<\u002Fstrong> Business English is not a different language. It is ordinary English used in work situations, with some special vocabulary and — more importantly — a different level of politeness and formality. You already know most of the words; the new skill is choosing the right ones for the reader in front of you. This module is about noticing that difference, because you will use it in every email, meeting and pitch on this course.\",\"<strong>How to use:<\u002Fstrong> Click any topic to see key points, vocabulary and an example. Then try the <strong>Friends vs. Work<\u002Fstrong> exercise at the bottom of this page.\"],\"sections\": [{\"label\": \"Six things to understand first\",\"items\": [{\"name\": \"Where do we use it?\",\"icon\": \"\",\"sub\": \"\",\"num\": 1,\"full\": false,\"img\": null,\"description\": \"Business English appears in many work situations. People in international companies often use English as their common language, even when nobody is a native speaker.\",\"points\": [\"Emails — writing to colleagues, customers, and partners\",\"Meetings — sharing ideas, asking questions, making decisions\",\"Presentations — explaining a product, a plan, or your results\",\"Phone and video calls — talking with people you cannot see face to face\",\"Documents — reports, job applications, CVs, and contracts\",\"Small talk — friendly conversation before or after work topics\"],\"when\": null,\"questions\": null,\"phrases\": null,\"example\": \"In many Finnish companies, a project team might include people from Finland, India, and Spain — and the working language is English.\",\"vocab\": [\"colleague\",\"client\",\"small talk\",\"job application\",\"report\",\"minutes\",\"conference call\",\"memo\",\"correspondence\"]},{\"name\": \"How is it different?\",\"icon\": \"\",\"sub\": \"\",\"num\": 2,\"full\": false,\"img\": null,\"description\": \"Business English is usually more polite, more formal, and more careful than the English you use with friends. The words are softer, and requests sound like questions.\",\"points\": [\"“I want this by Friday” becomes “Could you send this by Friday, please?”\",\"“That's a bad idea” becomes “I see some problems with that idea.”\",\"“What?” becomes “Sorry, could you repeat that?”\",\"In business, how you say something is often as important as what you say\"],\"when\": null,\"questions\": null,\"phrases\": null,\"example\": \"Compare: “Send me the file.” vs. “Could you send me the file when you have a moment?” Both ask for the same thing, but the second one keeps the relationship friendly.\",\"vocab\": [\"formal\",\"informal\",\"polite\",\"request\",\"tone\",\"register\",\"hedge\",\"diplomatic\",\"straightforward\"]},{\"name\": \"Special vocabulary\",\"icon\": \"\",\"sub\": \"\",\"num\": 3,\"full\": false,\"img\": null,\"description\": \"Business English has words and phrases that you do not often hear outside work. Different jobs also have their own vocabulary — a nurse, an engineer, and a salesperson all need English, but they need different words.\",\"points\": [\"Some words are common in all workplaces (deadline, meeting, invoice)\",\"Other words belong to one field only (medical, technical, financial terms)\",\"You learn the vocabulary of your own field step by step\",\"You do not need to know every business word — start with the most common ones\"],\"when\": null,\"questions\": null,\"phrases\": null,\"example\": \"If a colleague says, “Check the agenda before the meeting and remember the Friday deadline,” they are using two very common Business English words: agenda and deadline.\",\"vocab\": [\"invoice\",\"deadline\",\"agenda\",\"stakeholder\",\"follow up\",\"quotation\",\"procurement\",\"turnover\",\"negotiate\"]},{\"name\": \"Politeness and culture\",\"icon\": \"\",\"sub\": \"\",\"num\": 4,\"full\": false,\"img\": null,\"description\": \"In international business, you work with people from many cultures. What is polite in one country can seem strange in another. Business English has many “safe” polite phrases that work almost everywhere.\",\"points\": [\"“Would it be possible to…?” — a soft way to ask for something\",\"“I'm afraid I can't make it on Tuesday.” — a polite way to say no\",\"“Thank you for your patience.” — a kind phrase when there is a delay\",\"These phrases keep communication friendly, even when there is a problem\"],\"when\": null,\"questions\": null,\"phrases\": null,\"example\": \"Instead of “No, I'm busy on Tuesday,” you can say, “I'm afraid I can't make it on Tuesday. Would Wednesday work for you?” — polite, clear, and helpful.\",\"vocab\": [\"culture\",\"i'm afraid…\",\"apologise\",\"appreciate\",\"make it\",\"courtesy\",\"etiquette\",\"tactful\",\"reschedule\"]},{\"name\": \"Spoken and written skills\",\"icon\": \"\",\"sub\": \"\",\"num\": 5,\"full\": false,\"img\": null,\"description\": \"Business English includes both speaking and writing, and they are different skills. Speaking needs to be clear and quick. Writing can be slower and more careful, but readers expect good structure.\",\"points\": [\"Speaking skills: introducing yourself, asking for clarification, summarising\",\"A useful summary phrase: “So, we agreed that…”\",\"A clear email has a subject line, a greeting, a short message, and a closing\",\"In writing you have time to check; in speaking you need ready phrases\"],\"when\": null,\"questions\": null,\"phrases\": null,\"example\": \"A simple work email: Subject: Meeting on Friday → Greeting: Hi Anna, → Message: Could we move our meeting to 2 p.m.? → Closing: Best regards, Sam.\",\"vocab\": [\"clarification\",\"summarise\",\"subject line\",\"greeting\",\"closing\",\"paraphrase\",\"concise\",\"attachment\",\"proofread\"]},{\"name\": \"Why is it useful?\",\"icon\": \"\",\"sub\": \"\",\"num\": 6,\"full\": false,\"img\": null,\"description\": \"Good Business English helps you get a job, work in international teams, and grow in your career. It also gives you confidence: you know what to say, and how to say it politely.\",\"points\": [\"Many companies in Finland and around the world use English every day\",\"English is often the shared language of international teams\",\"Good communication skills help you in job interviews and at work\",\"Confidence grows when you have ready phrases for common situations\"],\"when\": null,\"questions\": null,\"phrases\": null,\"example\": \"A LAB graduate working in an export company might use English every day: morning emails to customers, a video call with a partner in the afternoon, and a short report before going home.\",\"vocab\": [\"career\",\"confidence\",\"job interview\",\"international team\",\"skill\",\"asset\",\"proficiency\",\"networking\",\"lingua franca\"]}]}],\"exercise\": {\"kind\": \"register\",\"title\": \"Friends vs. Work\",\"intro\": \"Read the sentence you might say to a friend. Then choose the best <strong>work version<\u002Fstrong>. In business, <em>how<\u002Fem> you say something is often as important as <em>what<\u002Fem> you say.\",\"lead\": \"You might say to a friend:\",\"ask\": \"Which is the best work version?\",\"items\": [{\"casual\": \"I want this by Friday.\",\"options\": [\"You must give me this on Friday.\",\"Could you send this by Friday, please?\",\"Friday. Don't forget.\"],\"answer\": \"Could you send this by Friday, please?\",\"rationale\": \"“Could you… please?” turns an order into a polite request. The other options sound demanding.\"},{\"casual\": \"That's a bad idea.\",\"options\": [\"I see some problems with that idea.\",\"No. Bad idea.\",\"Are you serious? That won't work.\"],\"answer\": \"I see some problems with that idea.\",\"rationale\": \"This version disagrees politely. It criticises the idea, not the person, and opens the door to discussion.\"},{\"casual\": \"What?\",\"options\": [\"Huh?\",\"Say that again.\",\"Sorry, could you repeat that?\"],\"answer\": \"Sorry, could you repeat that?\",\"rationale\": \"“Sorry, could you…?” is the standard polite way to ask someone to repeat something at work.\"},{\"casual\": \"I can't come on Tuesday.\",\"options\": [\"Tuesday is impossible for me.\",\"I'm afraid I can't make it on Tuesday. Would Wednesday work?\",\"Don't put meetings on Tuesday.\"],\"answer\": \"I'm afraid I can't make it on Tuesday. Would Wednesday work?\",\"rationale\": \"“I'm afraid…” softens the refusal, and offering another day shows you still want to meet.\"},{\"casual\": \"You're late with the payment.\",\"options\": [\"Pay us now.\",\"We are still waiting for your money.\",\"This is a friendly reminder that invoice #142 is now due.\"],\"answer\": \"This is a friendly reminder that invoice #142 is now due.\",\"rationale\": \"A “friendly reminder” asks for payment without blaming the customer. It keeps the business relationship good.\"},{\"casual\": \"Wait, I'm busy.\",\"options\": [\"Thank you for your patience — I will get back to you shortly.\",\"Not now.\",\"I have no time for this.\"],\"answer\": \"Thank you for your patience — I will get back to you shortly.\",\"rationale\": \"This phrase thanks the other person and promises an answer. It buys you time politely.\"}]},\"quiz\": [{\"q\": \"What is Business English?\",\"options\": [\"A completely different language\",\"Normal English used in professional situations\",\"English only for native speakers\",\"A type of computer code\"],\"answer\": \"Normal English used in professional situations\",\"rationale\": \"Business English is not a separate language — it is everyday English used at work, usually in a more polite and formal way.\"},{\"q\": \"Which of these is NOT a typical Business English situation?\",\"options\": [\"Writing an email to a client\",\"Giving a presentation\",\"Chatting with friends at a party\",\"Speaking in a meeting\"],\"answer\": \"Chatting with friends at a party\",\"rationale\": \"Business English is used at work. Chatting with friends is everyday, informal English.\"},{\"q\": \"What is an 'invoice'?\",\"options\": [\"A list of meeting topics\",\"A document asking for payment\",\"A type of presentation\",\"A job application\"],\"answer\": \"A document asking for payment\",\"rationale\": \"An invoice is a document a company sends to ask for payment for products or services.\"},{\"q\": \"What is a 'deadline'?\",\"options\": [\"A dangerous phone line\",\"The first day of a project\",\"The last day or time to finish something\",\"A type of contract\"],\"answer\": \"The last day or time to finish something\",\"rationale\": \"A deadline is the time limit — the last moment when something must be ready.\"},{\"q\": \"Which sentence is the most polite work version of 'I want this by Friday'?\",\"options\": [\"Give me this by Friday.\",\"Could you send this by Friday, please?\",\"Friday or never.\",\"You will send this by Friday.\"],\"answer\": \"Could you send this by Friday, please?\",\"rationale\": \"“Could you… please?” makes a request polite. Direct orders can sound rude in Business English.\"},{\"q\": \"What is 'small talk'?\",\"options\": [\"Speaking very quietly\",\"Light, friendly conversation about everyday topics\",\"A short business contract\",\"Talking to small groups\"],\"answer\": \"Light, friendly conversation about everyday topics\",\"rationale\": \"Small talk is friendly chat — for example about travel or the weather — often before or after the main work topics.\"},{\"q\": \"What does the phrase 'I'm afraid…' usually introduce in Business English?\",\"options\": [\"Bad news or a polite refusal\",\"A request the writer expects you to accept\",\"An apology for a mistake you made\",\"A reminder that a deadline has passed\"],\"answer\": \"Bad news or a polite refusal\",\"rationale\": \"“I'm afraid” warns the reader that a no is coming, and softens it. It is not an apology for your own mistake — that would be “I am sorry that…”\"},{\"q\": \"What is an 'agenda'?\",\"options\": [\"A list of topics for a meeting\",\"A yearly holiday plan\",\"A document asking for payment\",\"An email greeting\"],\"answer\": \"A list of topics for a meeting\",\"rationale\": \"An agenda lists what a meeting will cover, usually in order.\"},{\"q\": \"What does 'follow up' mean?\",\"options\": [\"To walk behind someone\",\"To contact someone again about something\",\"To finish a project\",\"To climb stairs\"],\"answer\": \"To contact someone again about something\",\"rationale\": \"To follow up means to check back later — for example, “I will follow up with the client next week.”\"},{\"q\": \"Which parts make a clear work email?\",\"options\": [\"Only a long message\",\"Subject line, greeting, short message, closing\",\"Pictures and emojis\",\"A title page and chapters\"],\"answer\": \"Subject line, greeting, short message, closing\",\"rationale\": \"A clear business email has a subject line, a greeting, a short clear message, and a closing like “Best regards”.\"},{\"q\": \"Why is politeness extra important in international business?\",\"options\": [\"Because English grammar requires it\",\"Because polite phrases are 'safe' across many cultures\",\"Because managers check every email\",\"Because it makes emails longer\"],\"answer\": \"Because polite phrases are 'safe' across many cultures\",\"rationale\": \"What is polite in one country can seem strange in another. Standard polite phrases work well almost everywhere.\"},{\"q\": \"What is a 'stakeholder'?\",\"options\": [\"A person who cooks steaks\",\"A person or group with an interest in a project\",\"A type of invoice\",\"A meeting room\"],\"answer\": \"A person or group with an interest in a project\",\"rationale\": \"Stakeholders are the people or groups affected by, or interested in, a project — for example customers, employees, or partners.\"},{\"q\": \"A colleague writes: “Could you possibly send me the figures when you have a moment?” She needs them today. Why does she write it this way?\",\"options\": [\"Softening a request is normal, even an urgent one\",\"She does not actually need the figures today at all\",\"She is quietly complaining about how long it has taken\",\"She would rather not say which meeting they are for\"],\"answer\": \"Softening a request is normal, even an urgent one\",\"rationale\": \"In Business English the politeness formula and the urgency are separate. “Could you possibly” is how a request is phrased at work; if the deadline matters, it is named elsewhere in the message.\"},{\"q\": \"Which sentence is too informal for an email to a company you have never contacted?\",\"options\": [\"Just wondering if you have any openings at the moment.\",\"I am writing to enquire about openings in your company.\",\"I would like to ask whether you have any current vacancies.\",\"Could you tell me whether you are recruiting at the moment?\"],\"answer\": \"Just wondering if you have any openings at the moment.\",\"rationale\": \"“Just wondering” is spoken register. The other three are all acceptable, and differ only in how direct they are — which is a matter of taste, not correctness.\"},{\"q\": \"Your manager says your report is “quite good”. In a workplace where praise is rare, what is the most likely meaning?\",\"options\": [\"It is good, and nothing further needs to be said\",\"It is only just acceptable and should be rewritten\",\"She has not actually read the report properly yet\",\"She is waiting for you to ask her for the details\"],\"answer\": \"It is good, and nothing further needs to be said\",\"rationale\": \"Understatement is common in English at work. Where comment is reserved for problems, the absence of criticism is itself the message. If you need more, ask a question that cannot be answered in one word.\"}]},{\"id\": \"emails\",\"num\": 2,\"title\": \"Professional emails\",\"sub\": \"The most common written task in any workplace\",\"intro\": [\"<strong>Why email first?<\u002Fstrong> Email is where most people are judged on their English at work. A clear, polite email gets an answer; an unclear one does not. Everything in Module 1 about formality applies here in a very practical way. On this course, you also practise email in a real exchange with a partner — so the phrases in this module are ones you will actually send.\",\"<strong>How to use:<\u002Fstrong> Explore the email types and the parts of an email, then read the <strong>annotated model email<\u002Fstrong> and the <strong>formal vs informal<\u002Fstrong> table further down this page.\"],\"sections\": [{\"label\": \"Common email types\",\"items\": [{\"name\": \"Enquiry email\",\"icon\": \"🔎\",\"sub\": \"\",\"num\": 1,\"full\": false,\"img\": null,\"description\": \"An enquiry email asks for information, help, or clarification. It should be polite, clear, and specific. Say why you need the information and give any relevant context.\",\"points\": null,\"when\": [\"You want to know more about a product, service, or job opportunity\",\"You need to confirm details before a meeting or event\",\"You are asking for advice or guidance from a professional\"],\"questions\": null,\"phrases\": [\"\\\"I am writing to enquire about…\\\"\",\"\\\"Could you please provide me with information about…?\\\"\",\"\\\"I would be grateful if you could clarify…\\\"\",\"\\\"I look forward to your response.\\\"\",\"\\\"Please do not hesitate to contact me if you need further details.\\\"\"],\"example\": \"Subject: Enquiry about internship opportunities — Aleksi Virtanen\\n\\nDear Ms Korhonen,\\n\\nI am writing to enquire about possible internship opportunities at your company this summer. I am a second-year business student at LAB University of Applied Sciences and I am particularly interested in the field of digital marketing.\\n\\nCould you please let me know whether you are currently accepting applications?\\n\\nKind regards,\\nAleksi Virtanen\",\"vocab\": [\"enquire about\",\"request information\",\"clarify\",\"confirm\",\"availability\",\"at your earliest convenience\"]},{\"name\": \"Cover letter email\",\"icon\": \"📄\",\"sub\": \"\",\"num\": 2,\"full\": false,\"img\": null,\"description\": \"A cover letter email accompanies your job application. It introduces you, explains why you want the job, and describes 2–3 relevant skills with short examples. It is formal and should be 100–150 words.\",\"points\": null,\"when\": [\"You are applying for a job you saw advertised\",\"You are sending your CV to a company\",\"You are responding to a job advertisement after the Business Fair\"],\"questions\": null,\"phrases\": [\"\\\"I am writing to apply for the position of…\\\"\",\"\\\"I am currently studying… at LAB University of Applied Sciences.\\\"\",\"\\\"I have experience in… which has helped me develop…\\\"\",\"\\\"Please find my CV attached.\\\"\",\"\\\"I would welcome the opportunity to discuss my application further.\\\"\"],\"example\": \"Subject: Application for Customer Service Assistant — Maria Lehtinen\\n\\nDear Hiring Manager,\\n\\nI am writing to apply for the Customer Service Assistant position at your company. I am a first-year business student at LAB University of Applied Sciences.\\n\\nI have experience working in a team environment from a summer job in retail, where I developed my communication and problem-solving skills. I have also practised professional writing in English during my Business English course.\\n\\nI look forward to hearing from you. Please find my CV attached.\\n\\nKind regards,\\nMaria Lehtinen\",\"vocab\": [\"apply for\",\"position\",\"vacancy\",\"relevant experience\",\"enclose\",\"i look forward to hearing from you\",\"at your convenience\"]},{\"name\": \"Follow-up email\",\"icon\": \"🔁\",\"sub\": \"\",\"num\": 3,\"full\": false,\"img\": null,\"description\": \"A follow-up email is sent after an event (such as an interview or meeting) or when you have not received a reply. It shows professionalism and genuine interest.\",\"points\": null,\"when\": [\"You want to thank someone after a job interview\",\"You sent an application and have not heard back after one week\",\"You met someone at an event and want to continue the conversation\"],\"questions\": null,\"phrases\": [\"\\\"I am writing to follow up on my application submitted on [date].\\\"\",\"\\\"I wanted to take the opportunity to thank you for the interview on [date].\\\"\",\"\\\"As discussed in our meeting, I am sending…\\\"\",\"\\\"I remain very interested in the position and would be happy to provide any further information.\\\"\",\"\\\"Could you please let me know if there are any updates regarding my application?\\\"\"],\"example\": \"Subject: Follow-up — Sales Assistant application — Pekka Mäkinen\\n\\nDear Ms Virtanen,\\n\\nI am writing to follow up on my application for the Sales Assistant position, which I submitted on 15 March. I remain very interested in the role and would be happy to provide any further information you may need.\\n\\nThank you for your time and consideration.\\n\\nKind regards,\\nPekka Mäkinen\",\"vocab\": [\"follow up\",\"reiterate interest\",\"i wanted to check\",\"as discussed\",\"further to our conversation\",\"confirm\"]},{\"name\": \"Complaint email\",\"icon\": \"⚠️\",\"sub\": \"\",\"num\": 4,\"full\": false,\"img\": null,\"description\": \"A complaint email reports a problem and asks for it to be resolved. Even when you are unhappy, your tone must remain professional and polite. Describe the problem clearly, explain the impact, and say what you would like to happen.\",\"points\": null,\"when\": [\"A product or service has not met your expectations\",\"Something was promised but not delivered\",\"You received incorrect or poor-quality work\"],\"questions\": null,\"phrases\": [\"\\\"I am writing to express my concern about…\\\"\",\"\\\"I would like to bring to your attention that…\\\"\",\"\\\"I ordered [product/service] on [date], but unfortunately…\\\"\",\"\\\"This has caused significant inconvenience because…\\\"\",\"\\\"I would appreciate it if you could resolve this matter by [date].\\\"\"],\"example\": \"Subject: Complaint regarding order #45892 — Incorrect item received\\n\\nDear Customer Service Team,\\n\\nI am writing to express my concern about an order I received on 20 March. I ordered a blue jacket (size M), but I received a red one in the wrong size. This has caused inconvenience as I need the item for an event next week.\\n\\nI would appreciate it if you could arrange an exchange at the earliest opportunity.\\n\\nKind regards,\\nJoanna Kowalski\",\"vocab\": [\"i am writing to express my concern about\",\"i would like to bring to your attention\",\"resolve\",\"compensation\",\"i would appreciate\",\"at the earliest opportunity\"]},{\"name\": \"Thank-you email\",\"icon\": \"🙏\",\"sub\": \"\",\"num\": 5,\"full\": false,\"img\": null,\"description\": \"A thank-you email is sent after an interview, meeting, or when someone has helped you. It should be short, specific, and genuine. Send it within 24 hours.\",\"points\": null,\"when\": [\"After a job interview\",\"After someone helped you or gave you advice\",\"After a meeting or presentation\"],\"questions\": null,\"phrases\": [\"\\\"Thank you very much for taking the time to meet with me.\\\"\",\"\\\"I really appreciated the opportunity to discuss…\\\"\",\"\\\"Our conversation confirmed my interest in the role.\\\"\",\"\\\"I found it particularly interesting when you mentioned…\\\"\",\"\\\"I look forward to the next steps in the process.\\\"\"],\"example\": \"Subject: Thank you — Interview on 22 March — Erika Salo\\n\\nDear Mr Laine,\\n\\nThank you very much for the opportunity to interview for the Marketing Trainee position yesterday. I really enjoyed our conversation and found it particularly interesting when you discussed your company's approach to sustainable packaging.\\n\\nThe interview confirmed my strong interest in the role, and I look forward to hearing from you regarding the next steps.\\n\\nKind regards,\\nErika Salo\",\"vocab\": [\"express gratitude\",\"i appreciate\",\"i am grateful for\",\"valuable\",\"it was a pleasure\",\"i look forward to\"]},{\"name\": \"Request email\",\"icon\": \"📋\",\"sub\": \"\",\"num\": 6,\"full\": false,\"img\": null,\"description\": \"A request email politely asks someone to do something — provide a document, arrange a meeting, or take an action. Always explain why you need it and give a clear deadline if relevant.\",\"points\": null,\"when\": [\"You need a document, reference, or piece of information from someone\",\"You would like to arrange a meeting\",\"You are asking a colleague or instructor for something\"],\"questions\": null,\"phrases\": [\"\\\"I am writing to request…\\\"\",\"\\\"Could you please send me…?\\\"\",\"\\\"I would be grateful if you could…\\\"\",\"\\\"If possible, I would need this by [date].\\\"\",\"\\\"Please let me know if you need any further information from me.\\\"\"],\"example\": \"Subject: Request for reference letter — Tuomas Heikkinen\\n\\nDear Professor Järvinen,\\n\\nI am writing to request a reference letter for a summer internship application. The deadline for the application is 10 April.\\n\\nI would be very grateful if you could confirm whether you would be willing to write a reference. I am happy to provide any additional information you may need.\\n\\nThank you very much for your time.\\n\\nKind regards,\\nTuomas Heikkinen\",\"vocab\": [\"i would be grateful if\",\"could you please\",\"at your earliest convenience\",\"by [date]\",\"i would appreciate\",\"arrange\"]}]},{\"label\": \"Parts of every professional email\",\"items\": [{\"name\": \"Subject line\",\"icon\": \"📌\",\"sub\": \"\",\"num\": 1,\"full\": false,\"img\": null,\"description\": \"The subject line is the first thing the reader sees. A good subject line is clear, specific, and informative. It tells the reader what the email is about before they open it.\",\"points\": null,\"when\": [\"Every professional email must have a subject line\",\"A clear subject line helps the reader prioritise and find your email\",\"A vague or missing subject line looks unprofessional\"],\"questions\": null,\"phrases\": [\"\\\"Application for [job title] — [Your name]\\\"\",\"\\\"Enquiry about internship opportunities\\\"\",\"\\\"Follow-up: meeting on [date]\\\"\",\"\\\"Request for reference — [Your name]\\\"\",\"\\\"Re: [previous email subject]\\\" (when replying)\"],\"example\": \"Good: \\\"Application for Sales Assistant — Sofia Mäkinen\\\"\\nGood: \\\"Enquiry about summer internship 2026\\\"\\nGood: \\\"Follow-up: interview on 15 March\\\"\\n\\nPoor: \\\"Hello\\\" / \\\"Hi\\\" / \\\"Job\\\" / \\\"Question\\\" — these are too vague.\",\"vocab\": [\"re:\",\"application for\",\"enquiry about\",\"follow-up\",\"request for\",\"regarding\"]},{\"name\": \"Greeting\",\"icon\": \"👋\",\"sub\": \"\",\"num\": 2,\"full\": false,\"img\": null,\"description\": \"The greeting opens the email. In formal emails, always use \\\"Dear\\\" followed by a title and surname, or a general title if you do not know the person's name. If you know the name but are unsure of the person's gender — for example because the name is unfamiliar or from another culture — simply use their full name. Never guess the title.\",\"points\": null,\"when\": [\"Use a formal greeting in all professional and business emails\",\"Use the full name (e.g. Dear Alex Kim) when you know the name but are unsure of the title\",\"Use Dear Hiring Manager or Dear Hiring Team when you do not know the name at all\",\"Never use \\\"Hey\\\" or \\\"Hi\\\" in a formal email\"],\"questions\": null,\"phrases\": [\"\\\"Dear Ms Korhonen,\\\" (you know she uses Ms)\",\"\\\"Dear Mr Virtanen,\\\" (you know he uses Mr)\",\"\\\"Dear Alex Kim,\\\" (full name — when title is unclear)\",\"\\\"Dear Hiring Manager,\\\" (you do not know the name)\",\"\\\"Dear Hiring Team,\\\" (addressing a team)\",\"\\\"Dear Dr Laine,\\\" (when writing to someone with a doctorate)\"],\"example\": \"Use \\\"Dear Ms / Mr [Last name]\\\" when you know the person's name and title.\\nNot sure about the title? Use the full name — Dear Jordan Lee or Dear Priya Sharma. This is always safe and professional.\\nUse \\\"Dear Hiring Team\\\" or \\\"Dear Hiring Manager\\\" when you do not know the name.\\nAvoid: \\\"To Whom It May Concern\\\" — old-fashioned and impersonal.\",\"vocab\": [\"dear\",\"mr\",\"ms\",\"mx\",\"dr\",\"hiring manager\",\"hiring team\",\"whom it may concern (avoid this)\"]},{\"name\": \"Opening sentence\",\"icon\": \"▶️\",\"sub\": \"\",\"num\": 3,\"full\": false,\"img\": null,\"description\": \"The opening sentence tells the reader immediately why you are writing. It should be direct and clear. Do not waste the reader's time with empty phrases.\",\"points\": null,\"when\": [\"Always start with a clear statement of purpose\",\"The opening sentence is the most important sentence in the email\",\"Avoid opening with \\\"I hope this email finds you well\\\" — it is overused\"],\"questions\": null,\"phrases\": [\"\\\"I am writing to apply for the position of…\\\"\",\"\\\"I am writing to enquire about…\\\"\",\"\\\"I am writing to follow up on my application submitted on [date].\\\"\",\"\\\"I am writing in response to your advertisement for…\\\"\",\"\\\"I would like to request…\\\"\"],\"example\": \"Good: \\\"I am writing to apply for the Sales Assistant position at GreenLoop.\\\"\\n\\nAvoid: \\\"I hope this email finds you well.\\\" — it adds nothing and is overused.\\nAvoid: \\\"My name is Sofia and I would like to tell you about myself.\\\" — start with your purpose, not your name.\",\"vocab\": [\"i am writing to\",\"i would like to\",\"i am contacting you regarding\",\"further to\",\"i am writing in response to\"]},{\"name\": \"Closing\",\"icon\": \"🤝\",\"sub\": \"\",\"num\": 4,\"full\": false,\"img\": null,\"description\": \"The closing ends the email professionally. It includes a forward-looking sentence, a sign-off phrase, and your name and contact information. In modern business email, Kind regards, Best regards, and Best wishes are the standard sign-offs in almost all situations.\",\"points\": null,\"when\": [\"Every professional email needs a clear and polite closing\",\"Use Kind regards, Best regards, or Best wishes in almost all professional emails\",\"Always include your full name below the sign-off\"],\"questions\": null,\"phrases\": [\"\\\"I look forward to hearing from you.\\\"\",\"\\\"Thank you for your time and consideration.\\\"\",\"\\\"Please do not hesitate to contact me if you need further information.\\\"\",\"\\\"Kind regards, [Full name]\\\" — standard in modern professional email\",\"\\\"Best regards, [Full name]\\\" — equally common and appropriate\",\"\\\"Best wishes, [Full name]\\\" — friendly and professional; good for ongoing relationships\",\"\\\"Yours sincerely, [Full name]\\\" — very formal; still correct but old-fashioned for email\"],\"example\": \"Modern practice: Use Kind regards, Best regards, or Best wishes in almost all professional emails.\\n\\nBest wishes is slightly warmer — suitable when you have an existing relationship or want a friendly but professional tone.\\n\\nYours sincerely and Yours faithfully are still technically correct but most professionals use the options above.\",\"vocab\": [\"kind regards\",\"best regards\",\"yours sincerely\",\"yours faithfully\",\"i look forward to\",\"please do not hesitate to contact me\"]}]}],\"exercise\": {\"kind\": \"html\",\"title\": \"Annotated model email and register\",\"html\": \"<div class=\\\"info-strip\\\"><strong>How to read this:<\u002Fstrong> Below is a model cover letter email, broken into parts. Click any part to see an explanation, tips, and alternative phrases you can use.<\u002Fdiv>\\n\\n  <div style=\\\"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--gray-600);margin:0 0 12px;\\\">Model email — Cover letter email (job application)<\u002Fdiv>\\n\\n  <div class=\\\"annotated-email\\\">\\n    <div class=\\\"email-header-bar\\\">\\n      <span><strong>To:<\u002Fstrong> hiring@greenloop.fi<\u002Fspan>\\n      <span><strong>From:<\u002Fstrong> sofia.makinen@student.lab.fi<\u002Fspan>\\n    <\u002Fdiv>\\n    <div class=\\\"email-body-parts\\\">\\n      <div class=\\\"email-part\\\" onclick=\\\"toggleAnnotation(&#39;ann-subject&#39;)\\\">\\n        <div class=\\\"part-label\\\">Subject line<\u002Fdiv>\\n        <div class=\\\"part-text\\\">Application for Sales Assistant position — Sofia Mäkinen\\n          <div class=\\\"part-note\\\">Click to see tips and alternatives →<\u002Fdiv>\\n        <\u002Fdiv>\\n      <\u002Fdiv>\\n      <div class=\\\"annotation-panel\\\" id=\\\"ann-subject\\\">\\n        <h4>📌 Subject line<\u002Fh4>\\n        <p>A good subject line tells the reader exactly what the email is about before they open it. Include the job title and your name so it is easy to identify.<\u002Fp>\\n        <div class=\\\"alts\\\">\\n          <div class=\\\"alt-item\\\">\\\"Application — Marketing Trainee — Aleksi Virtanen\\\"<\u002Fdiv>\\n          <div class=\\\"alt-item\\\">\\\"Job application: Customer Service role — Maria Korhonen\\\"<\u002Fdiv>\\n          <div class=\\\"alt-item\\\">\\\"Re: Sales Assistant vacancy — cover letter enclosed\\\"<\u002Fdiv>\\n        <\u002Fdiv>\\n      <\u002Fdiv>\\n\\n      <div class=\\\"email-part\\\" onclick=\\\"toggleAnnotation(&#39;ann-greeting&#39;)\\\">\\n        <div class=\\\"part-label\\\">Greeting<\u002Fdiv>\\n        <div class=\\\"part-text\\\">Dear Hiring Team,\\n          <div class=\\\"part-note\\\">Click to see tips and alternatives →<\u002Fdiv>\\n        <\u002Fdiv>\\n      <\u002Fdiv>\\n      <div class=\\\"annotation-panel\\\" id=\\\"ann-greeting\\\">\\n        <h4>👋 Greeting<\u002Fh4>\\n        <p>Use <em>Dear<\u002Fem> + a name or title. If you do not know the person's name, <em>Dear Hiring Team<\u002Fem> or <em>Dear Hiring Manager<\u002Fem> is correct. Avoid <em>To Whom It May Concern<\u002Fem> — it sounds old-fashioned.<\u002Fp>\\n        <p style=\\\"margin-top:8px;\\\"><strong>Not sure of the person's gender?<\u002Fstrong> If the name is unfamiliar or from another culture and you cannot tell whether the person uses Mr or Ms, avoid guessing. Use their full name instead — <em>Dear Alex Kim,<\u002Fem> — or use a neutral title such as <em>Dear Hiring Manager<\u002Fem>. This is always safe and professional.<\u002Fp>\\n        <div class=\\\"alts\\\">\\n          <div class=\\\"alt-item\\\">\\\"Dear Ms Leinonen,\\\" (you know she uses Ms)<\u002Fdiv>\\n          <div class=\\\"alt-item\\\">\\\"Dear Alex Kim,\\\" (full name — safe when gender is unclear)<\u002Fdiv>\\n          <div class=\\\"alt-item\\\">\\\"Dear Hiring Manager,\\\" (no name known)<\u002Fdiv>\\n          <div class=\\\"alt-item\\\">\\\"Dear GreenLoop Recruitment Team,\\\" (addressing a team)<\u002Fdiv>\\n        <\u002Fdiv>\\n      <\u002Fdiv>\\n\\n      <div class=\\\"email-part\\\" onclick=\\\"toggleAnnotation(&#39;ann-opening&#39;)\\\">\\n        <div class=\\\"part-label\\\">Opening paragraph<\u002Fdiv>\\n        <div class=\\\"part-text\\\">I am writing to apply for the Sales Assistant position at GreenLoop, advertised on your website. I am a first-year business student at LAB University of Applied Sciences with a strong interest in sustainable retail.\\n          <div class=\\\"part-note\\\">Click to see tips and alternatives →<\u002Fdiv>\\n        <\u002Fdiv>\\n      <\u002Fdiv>\\n      <div class=\\\"annotation-panel\\\" id=\\\"ann-opening\\\">\\n        <h4>▶️ Opening paragraph<\u002Fh4>\\n        <p>Your first sentence should say who you are and why you are writing. Mention where you saw the job advertisement if possible. Keep it to 2–3 sentences.<\u002Fp>\\n        <div class=\\\"alts\\\">\\n          <div class=\\\"alt-item\\\">\\\"I am writing to express my interest in the Customer Service Trainee role at GreenLoop.\\\"<\u002Fdiv>\\n          <div class=\\\"alt-item\\\">\\\"I would like to apply for the position of Marketing Assistant, as advertised on LinkedIn.\\\"<\u002Fdiv>\\n        <\u002Fdiv>\\n      <\u002Fdiv>\\n\\n      <div class=\\\"email-part\\\" onclick=\\\"toggleAnnotation(&#39;ann-skills&#39;)\\\">\\n        <div class=\\\"part-label\\\">Skills paragraph<\u002Fdiv>\\n        <div class=\\\"part-text\\\">I have experience working in a customer-facing role at a local café, where I developed my communication and teamwork skills. In my studies, I have also practised professional writing in English and completed a business plan project that included market research and customer segmentation.\\n          <div class=\\\"part-note\\\">Click to see tips and alternatives →<\u002Fdiv>\\n        <\u002Fdiv>\\n      <\u002Fdiv>\\n      <div class=\\\"annotation-panel\\\" id=\\\"ann-skills\\\">\\n        <h4>💼 Skills paragraph<\u002Fh4>\\n        <p>Describe 2–3 relevant skills. For each one, give a short example — do not just list skills. Use this structure: skill + example + result or learning.<\u002Fp>\\n        <div class=\\\"alts\\\">\\n          <div class=\\\"alt-item\\\">\\\"I am a reliable team player. During a group project, I coordinated communication and made sure we met our deadline.\\\"<\u002Fdiv>\\n          <div class=\\\"alt-item\\\">\\\"My written English skills are strong, and I have practised writing formal reports and emails during my Business English course.\\\"<\u002Fdiv>\\n        <\u002Fdiv>\\n      <\u002Fdiv>\\n\\n      <div class=\\\"email-part\\\" onclick=\\\"toggleAnnotation(&#39;ann-closing&#39;)\\\">\\n        <div class=\\\"part-label\\\">Closing paragraph<\u002Fdiv>\\n        <div class=\\\"part-text\\\">I would welcome the opportunity to discuss my application further. Please find my CV attached. I look forward to hearing from you.\\n          <div class=\\\"part-note\\\">Click to see tips and alternatives →<\u002Fdiv>\\n        <\u002Fdiv>\\n      <\u002Fdiv>\\n      <div class=\\\"annotation-panel\\\" id=\\\"ann-closing\\\">\\n        <h4>🤝 Closing paragraph<\u002Fh4>\\n        <p>End by expressing interest in the next step. Mention any attachments. Keep it short — 2–3 sentences maximum.<\u002Fp>\\n        <div class=\\\"alts\\\">\\n          <div class=\\\"alt-item\\\">\\\"I am available for an interview at your convenience and look forward to hearing from you.\\\"<\u002Fdiv>\\n          <div class=\\\"alt-item\\\">\\\"Thank you for considering my application. I hope to have the opportunity to discuss it with you.\\\"<\u002Fdiv>\\n        <\u002Fdiv>\\n      <\u002Fdiv>\\n\\n      <div class=\\\"email-part\\\" onclick=\\\"toggleAnnotation(&#39;ann-signoff&#39;)\\\">\\n        <div class=\\\"part-label\\\">Sign-off<\u002Fdiv>\\n        <div class=\\\"part-text\\\">Kind regards,<br>Sofia Mäkinen<br>LAB University of Applied Sciences<br>sofia.makinen@student.lab.fi\\n          <div class=\\\"part-note\\\">Click to see tips and alternatives →<\u002Fdiv>\\n        <\u002Fdiv>\\n      <\u002Fdiv>\\n      <div class=\\\"annotation-panel\\\" id=\\\"ann-signoff\\\">\\n        <h4>✍️ Sign-off<\u002Fh4>\\n        <p><strong>Kind regards<\u002Fstrong> and <strong>Best regards<\u002Fstrong> are the most common sign-offs in modern professional email — use them in almost all situations. <em>Yours sincerely<\u002Fem> and <em>Yours faithfully<\u002Fem> are still correct in very formal letters, but they are old-fashioned in everyday business email. Always include your full name and contact details below the sign-off.<\u002Fp>\\n        <div class=\\\"alts\\\">\\n          <div class=\\\"alt-item\\\">\\\"Kind regards, [Full name]\\\" — most common in professional email<\u002Fdiv>\\n          <div class=\\\"alt-item\\\">\\\"Best regards, [Full name]\\\" — equally common, slightly warmer<\u002Fdiv>\\n          <div class=\\\"alt-item\\\">\\\"Best wishes, [Full name]\\\" — friendly and professional; good for ongoing relationships<\u002Fdiv>\\n          <div class=\\\"alt-item\\\">\\\"Yours sincerely, [Full name]\\\" — very formal; correct but old-fashioned for email<\u002Fdiv>\\n        <\u002Fdiv>\\n      <\u002Fdiv>\\n    <\u002Fdiv>\\n  <\u002Fdiv>\\n\\n  <div style=\\\"background:white;border:1px solid var(--gray-200);padding:20px;\\\">\\n    <h3 style=\\\"font-size:15px;font-weight:700;margin-bottom:14px;color:var(--gray-900);\\\">✅ Do and ❌ Don't<\u002Fh3>\\n    <div class=\\\"dos-donts\\\">\\n      <div class=\\\"do-list\\\">\\n        <h4>✅ Do<\u002Fh4>\\n        <ul>\\n          <li>Use full sentences — no contractions (write <em>I am<\u002Fem>, not <em>I'm<\u002Fem>)<\u002Fli>\\n          <li>Keep the email between 100–150 words for a cover letter; other emails can be longer<\u002Fli>\\n          <li>Use a clear, specific subject line<\u002Fli>\\n          <li>Start by saying why you are writing<\u002Fli>\\n          <li>Give examples for your skills — not just claims<\u002Fli>\\n          <li>Proofread before sending<\u002Fli>\\n        <\u002Ful>\\n      <\u002Fdiv>\\n      <div class=\\\"dont-list\\\">\\n        <h4>❌ Don't<\u002Fh4>\\n        <ul>\\n          <li>Use slang or informal language (<em>Hey, Thanks a lot, FYI<\u002Fem>)<\u002Fli>\\n          <li>Use contractions (<em>I'm, I've, can't, don't<\u002Fem>)<\u002Fli>\\n          <li>Write very long paragraphs — keep them short<\u002Fli>\\n          <li>Leave the subject line blank or vague (<em>Hello, Hi<\u002Fem>)<\u002Fli>\\n          <li>Forget to include your name and contact details<\u002Fli>\\n          <li>Copy from AI without reading and checking carefully<\u002Fli>\\n          <li>Begin with <em>I hope this email finds you well<\u002Fem> — overused and empty<\u002Fli>\\n        <\u002Ful>\\n      <\u002Fdiv>\\n    <\u002Fdiv>\\n  <\u002Fdiv>\\n<div class=\\\"info-strip\\\"><strong>What is register?<\u002Fstrong> Register means the level of formality in your writing. Professional emails use a formal or semi-formal register. Informal language — like contractions and slang — is not appropriate. Use this page to learn the difference.<\u002Fdiv>\\n\\n  <div style=\\\"background:white;border:1px solid var(--gray-200);padding:24px;margin-bottom:16px;\\\">\\n    <h2 style=\\\"font-size:17px;font-weight:700;margin-bottom:6px;color:var(--gray-900);\\\">Formal vs. informal — key differences<\u002Fh2>\\n    <p style=\\\"font-size:13.5px;color:var(--gray-600);margin-bottom:16px;\\\">The table below shows common informal phrases and the formal alternatives you should use in professional emails.<\u002Fp>\\n    <table class=\\\"register-table\\\">\\n      <thead><tr><th>Instead of (informal)<\u002Fth><th>Use this (formal)<\u002Fth><\u002Ftr><\u002Fthead>\\n      <tbody>\\n        <tr><td class=\\\"informal\\\">Hey / Hi [first name]<\u002Ftd><td class=\\\"formal\\\">Dear Mr/Ms [Last name] / Dear Hiring Team<\u002Ftd><\u002Ftr>\\n        <tr><td class=\\\"informal\\\">I'm writing to...<\u002Ftd><td class=\\\"formal\\\">I am writing to...<\u002Ftd><\u002Ftr>\\n        <tr><td class=\\\"informal\\\">Can you...?<\u002Ftd><td class=\\\"formal\\\">Could you please...? / I would be grateful if you could...<\u002Ftd><\u002Ftr>\\n        <tr><td class=\\\"informal\\\">I want to apply for...<\u002Ftd><td class=\\\"formal\\\">I would like to apply for... / I am writing to apply for...<\u002Ftd><\u002Ftr>\\n        <tr><td class=\\\"informal\\\">Thanks a lot / Thanks!<\u002Ftd><td class=\\\"formal\\\">Thank you for your time. / Thank you for your consideration.<\u002Ftd><\u002Ftr>\\n        <tr><td class=\\\"informal\\\">I've got experience in...<\u002Ftd><td class=\\\"formal\\\">I have experience in...<\u002Ftd><\u002Ftr>\\n        <tr><td class=\\\"informal\\\">I think I'd be great for this job<\u002Ftd><td class=\\\"formal\\\">I believe I have the skills required for this position.<\u002Ftd><\u002Ftr>\\n        <tr><td class=\\\"informal\\\">Let me know if you need anything<\u002Ftd><td class=\\\"formal\\\">Please do not hesitate to contact me if you require further information.<\u002Ftd><\u002Ftr>\\n        <tr><td class=\\\"informal\\\">Cheers / Bye<\u002Ftd><td class=\\\"formal\\\">Kind regards, / Best regards, / Best wishes,<\u002Ftd><\u002Ftr>\\n        <tr><td class=\\\"informal\\\">ASAP / FYI / BTW<\u002Ftd><td class=\\\"formal\\\">As soon as possible / I would like to inform you that / Regarding<\u002Ftd><\u002Ftr>\\n        <tr><td class=\\\"informal\\\">Sorry for the late reply<\u002Ftd><td class=\\\"formal\\\">I apologise for the delay in my response.<\u002Ftd><\u002Ftr>\\n        <tr><td class=\\\"informal\\\">I saw your job ad online<\u002Ftd><td class=\\\"formal\\\">I am writing in response to the position advertised on your website.<\u002Ftd><\u002Ftr>\\n      <\u002Ftbody>\\n    <\u002Ftable>\\n  <\u002Fdiv>\\n\\n  <div style=\\\"background:white;border:1px solid var(--gray-200);padding:24px;\\\">\\n    <h2 style=\\\"font-size:17px;font-weight:700;margin-bottom:6px;color:var(--gray-900);\\\">Contractions — never use them in formal emails<\u002Fh2>\\n    <p style=\\\"font-size:13.5px;color:var(--gray-600);margin-bottom:16px;\\\">A contraction joins two words with an apostrophe. For example, <em>I'm = I am<\u002Fem>. In professional emails, always write the full form.<\u002Fp>\\n    <div class=\\\"email-grid\\\" style=\\\"gap:8px;\\\">\\n      <div style=\\\"background:var(--red-light);padding:14px 16px;\\\">\\n        <div style=\\\"font-size:12px;font-weight:700;color:var(--red);margin-bottom:8px;\\\">❌ Do not use<\u002Fdiv>\\n        <div style=\\\"font-size:13.5px;color:var(--red);line-height:1.9;\\\">I'm · I've · I'd · I'll · can't · don't · won't · it's · there's · we're · you're · haven't · wouldn't · couldn't · didn't<\u002Fdiv>\\n      <\u002Fdiv>\\n      <div style=\\\"background:var(--green-light);padding:14px 16px;\\\">\\n        <div style=\\\"font-size:12px;font-weight:700;color:var(--green);margin-bottom:8px;\\\">✅ Always write the full form<\u002Fdiv>\\n        <div style=\\\"font-size:13.5px;color:var(--green);line-height:1.9;\\\">I am · I have · I would · I will · cannot · do not · will not · it is · there is · we are · you are · have not · would not · could not · did not<\u002Fdiv>\\n      <\u002Fdiv>\\n    <\u002Fdiv>\\n  <\u002Fdiv>\\n\"},\"quiz\": [{\"q\": \"You are writing a job application email. You do not know the name of the person. Which greeting is correct?\",\"options\": [\"Dear Hiring Manager,\",\"To Whom It May Concern,\",\"Dear Sir or Madam,\",\"Dear Recruitment,\"],\"answer\": \"Dear Hiring Manager,\",\"rationale\": \"All four are formal, so formality is not the test. “To Whom It May Concern” and “Dear Sir or Madam” are old-fashioned, and the second also guesses at gender. “Dear Recruitment” names a department, not a person.\"},{\"q\": \"Which subject line is the most professional for a job application?\",\"options\": [\"Application for Sales Assistant — Maria Lehtinen\",\"Job application — Maria Lehtinen\",\"Application for the position advertised on your website\",\"Maria Lehtinen — CV and cover letter attached\"],\"answer\": \"Application for Sales Assistant — Maria Lehtinen\",\"rationale\": \"All four are reasonable. Only the first names both the exact role and the applicant, which is what lets a recruiter sort and find it later. The others miss one or the other.\"},{\"q\": \"You are writing a professional job application email. Which sign-off is the most appropriate in modern business email?\",\"options\": [\"Kind regards\",\"Yours faithfully\",\"Yours sincerely\",\"With best wishes for the future\"],\"answer\": \"Kind regards\",\"rationale\": \"All four are formal. “Yours sincerely” and “Yours faithfully” are correct but now sound old-fashioned in email, and the last is too warm for a first contact. “Kind regards” is the modern default.\"},{\"q\": \"Which of these sentences is appropriate in a formal email?\",\"options\": [\"\\\"I'm really excited about this job!\\\"\",\"\\\"I am writing to apply for the position of Sales Assistant.\\\"\",\"\\\"Hey, I saw your ad and I want to apply.\\\"\",\"\\\"FYI, I sent my CV already.\\\"\"],\"answer\": \"\\\"I am writing to apply for the position of Sales Assistant.\\\"\",\"rationale\": \"\\\"I am writing to apply for...\\\" is formal, uses no contractions, and states the purpose clearly. The others are informal or inappropriate.\"},{\"q\": \"Which is NOT appropriate in a professional email?\",\"options\": [\"\\\"I look forward to hearing from you.\\\"\",\"\\\"Please find my CV attached.\\\"\",\"\\\"I'm happy to provide more info ASAP.\\\"\",\"\\\"I would be grateful if you could confirm the date.\\\"\"],\"answer\": \"\\\"I'm happy to provide more info ASAP.\\\"\",\"rationale\": \"\\\"I'm\\\" is a contraction — not acceptable in formal writing. \\\"ASAP\\\" is an abbreviation that sounds too informal. Always write \\\"I am\\\" and \\\"as soon as possible\\\".\"},{\"q\": \"What is the purpose of the opening sentence in a professional email?\",\"options\": [\"To say hello and introduce yourself by name\",\"To explain clearly why you are writing\",\"To describe your hobbies and interests\",\"To thank the reader for their time\"],\"answer\": \"To explain clearly why you are writing\",\"rationale\": \"The opening sentence should immediately state the reason for the email. Avoid empty phrases like \\\"I hope this email finds you well.\\\"\"},{\"q\": \"Which phrase is the correct formal version of \\\"Can you send me the documents?\\\"\",\"options\": [\"\\\"Send the documents.\\\"\",\"\\\"Could you please send me the documents?\\\"\",\"\\\"I really need the documents as soon as possible.\\\"\",\"\\\"Can you send it ASAP?\\\"\"],\"answer\": \"\\\"Could you please send me the documents?\\\"\",\"rationale\": \"\\\"Could you please...\\\" is polite and formal. Direct commands are rude, and \\\"ASAP\\\" is too informal for professional writing.\"},{\"q\": \"A student writes: \\\"I'm writing to tell you about myself and my experience.\\\" What is wrong with this sentence?\",\"options\": [\"It uses a contraction (I'm)\",\"The purpose is too vague\",\"It does not state the type of email\",\"All of the above\"],\"answer\": \"All of the above\",\"rationale\": \"All three problems are present: \\\"I'm\\\" is a contraction (not formal), the purpose is vague, and a professional email should state its specific purpose in the opening.\"},{\"q\": \"When should you send a follow-up email after a job application?\",\"options\": [\"About a week later, if you have heard nothing at all\",\"The next working day, so that they remember your name\",\"Only once the closing date in the advertisement has passed\",\"On the day the advertisement said a decision would be made\"],\"answer\": \"About a week later, if you have heard nothing at all\",\"rationale\": \"The next day is too soon to be useful. Waiting for the closing date or the decision date means you never follow up at all in most cases. A week is long enough to be reasonable and short enough to be remembered.\"},{\"q\": \"What should a cover letter email include?\",\"options\": [\"Your full work history and all qualifications\",\"An opening saying why you are writing, 2–3 skills with examples, and a professional closing\",\"A long description of your personal life and hobbies\",\"Just your name and CV attachment\"],\"answer\": \"An opening saying why you are writing, 2–3 skills with examples, and a professional closing\",\"rationale\": \"A cover letter email is 100–150 words: why you are writing, 2–3 relevant skills with short examples, and a professional closing. It is not a full CV.\"},{\"q\": \"Which opening sentence is the most effective for a cover letter email?\",\"options\": [\"\\\"I hope this email finds you well.\\\"\",\"\\\"My name is Pekka and I am a student.\\\"\",\"\\\"I am writing to apply for the Customer Service position advertised on your website.\\\"\",\"\\\"I think I would be great for this job because I am very hard-working.\\\"\"],\"answer\": \"\\\"I am writing to apply for the Customer Service position advertised on your website.\\\"\",\"rationale\": \"\\\"I am writing to apply for...\\\" states the purpose immediately and is specific. The others are vague, informal, or simply not appropriate as opening sentences.\"},{\"q\": \"What does \\\"register\\\" mean in the context of writing?\",\"options\": [\"The list of students in a class\",\"The level of formality in your language\",\"The number of words in your email\",\"The font you use in your email\"],\"answer\": \"The level of formality in your language\",\"rationale\": \"Register refers to the level of formality. Professional emails use a formal or semi-formal register — no slang, no contractions, and polite vocabulary.\"},{\"q\": \"A student ends their email with \\\"Cheers, Mikko\\\". What should they write instead?\",\"options\": [\"\\\"Thanks a lot, Mikko\\\"\",\"\\\"Kind regards, Mikko Virtanen\\\"\",\"\\\"Bye for now, Mikko\\\"\",\"\\\"Later, Mikko\\\"\"],\"answer\": \"\\\"Kind regards, Mikko Virtanen\\\"\",\"rationale\": \"\\\"Cheers\\\", \\\"Thanks a lot\\\", and \\\"Later\\\" are all informal. In a professional email, use \\\"Kind regards\\\", \\\"Best regards\\\", or \\\"Best wishes\\\" followed by your full name.\"},{\"q\": \"Which of the following is a contraction?\",\"options\": [\"I've\",\"I have\",\"I am\",\"I would\"],\"answer\": \"I've\",\"rationale\": \"A contraction is a shortened form with an apostrophe. The other three are the full forms — which is what you use in formal writing.\"},{\"q\": \"You want to ask your professor for a reference letter. Which email is the most appropriate?\",\"options\": [\"\\\"Hey, can you write me a reference? I need it soon.\\\"\",\"\\\"I am writing to request a reference letter for my job application. The deadline is 10 April.\\\"\",\"\\\"Reference letter needed — please write one for me.\\\"\",\"\\\"Could you do me a favour and write a reference?\\\"\"],\"answer\": \"\\\"I am writing to request a reference letter for my job application. The deadline is 10 April.\\\"\",\"rationale\": \"A formal request states the purpose clearly, gives the relevant deadline, and is polite. \\\"Hey\\\" and \\\"do me a favour\\\" are too informal for a professional email.\"},{\"q\": \"You sent a complaint two weeks ago and received no reply. What should change in your second email?\",\"options\": [\"Give the date of the first email and repeat the request\",\"Use a much stronger tone so that they take it seriously\",\"Send it to several people in the company at the same time\",\"Cut it to a single line so that it is quicker to read\"],\"answer\": \"Give the date of the first email and repeat the request\",\"rationale\": \"The reader may never have seen the first email. Giving the date and restating the request makes the message complete on its own. Anger and mass-copying make a reply less likely, not more.\"},{\"q\": \"Which opening sentence is wrong for a complaint email?\",\"options\": [\"I hope this email finds you well.\",\"I am writing to express my concern about an order placed on 3 May.\",\"I am writing about a problem with order number 45892.\",\"I would like to bring a delivery problem to your attention.\"],\"answer\": \"I hope this email finds you well.\",\"rationale\": \"The other three all state the purpose in the first line, which is what a complaint needs. The first delays the point and reads as filler when you are reporting a problem.\"},{\"q\": \"You are replying to an email that began “Hi Anna, thanks for getting in touch!”. How should you open your reply?\",\"options\": [\"At about the same level of formality as her message\",\"Rather more formally than the sender, just to be safe\",\"With no greeting at all, since this is only a reply\",\"Exactly as you would open a first contact with a stranger\"],\"answer\": \"At about the same level of formality as her message\",\"rationale\": \"The other person has set the register. Matching it is the normal signal that you have read the room. Replying much more formally can read as distance or disapproval.\"}]},{\"id\": \"meetings\",\"num\": 3,\"title\": \"Business meetings\",\"sub\": \"Taking part, chairing, deciding, and writing it down\",\"intro\": [\"<strong>From writing to speaking.<\u002Fstrong> A meeting is where the language of Modules 1 and 2 has to work in real time. You cannot redraft a sentence you have already said, so it helps to have ready-made phrases for the moments that come up again and again. With a small set of them, you can open a meeting, interrupt politely, disagree without sounding rude, and close on time — in English, under pressure.\",\"<strong>How to use:<\u002Fstrong> Work through the eight topics in order — they follow a meeting from the invitation to the minutes. Then try the <strong>Say It Right<\u002Fstrong> exercise.\"],\"sections\": [{\"label\": \"A meeting from start to finish\",\"items\": [{\"name\": \"Types of meetings\",\"icon\": \"\",\"sub\": \"\",\"num\": 1,\"full\": false,\"img\": null,\"description\": \"Meetings have different purposes. Before you go to a meeting, ask yourself: what kind of meeting is this? The type tells you what to prepare, how long it will probably take, and what people expect you to do there.\",\"points\": [\"Status update meeting — the team reports on progress: what is done, what is late, and what happens next\",\"Information-sharing meeting — one person tells many people something, and answers everyone's questions at the same time\",\"Decision-making meeting — the group discusses the options and chooses one; much faster than a long chain of emails\",\"Problem-solving meeting — the group looks at a problem that has appeared and agrees the steps to solve it\",\"Innovation meeting — people brainstorm new ideas and challenge each other's thinking\",\"Team-building meeting — people get to know each other better, so that everyone feels part of the team\"],\"when\": null,\"questions\": null,\"phrases\": null,\"example\": \"Monday's meeting is a status update, so please prepare a two-minute summary of your progress. On Thursday, we have a decision-making meeting about the new supplier. Please read the two offers in advance.\",\"vocab\": [\"status update\",\"catch-up\",\"share information\",\"brainstorm\",\"debrief\",\"overcome\",\"team building\",\"host\",\"recurring\"]},{\"name\": \"Meeting roles\",\"icon\": \"\",\"sub\": \"\",\"num\": 2,\"full\": false,\"img\": null,\"description\": \"In a well-run meeting, people have jobs. Some roles are given before the meeting starts; some are agreed in the first minute. Knowing the roles helps you understand who to speak to, and what is expected of you.\",\"points\": [\"Chair (leader) — opens and closes the meeting, gives people the turn to speak, and keeps the group to the agenda\",\"Facilitator — helps the discussion work: makes sure everyone is heard and that the group reaches a result\",\"Minute taker (note taker) — writes the record of the meeting: decisions, action points, and who attended\",\"Timekeeper — watches the clock and warns the group when an item is running over\",\"Participant (attendee) — prepares in advance, listens, contributes, and does the action points afterwards\",\"In small teams, one person often has two roles: the chair may also facilitate, or a participant may take the minutes\"],\"when\": null,\"questions\": null,\"phrases\": null,\"example\": \"Before we begin: I'll chair, Mika takes the minutes, and Jonas is our timekeeper. Everyone else is a participant — please contribute, and note down any action points that are yours.\",\"vocab\": [\"accountable\",\"facilitator\",\"timekeeper\",\"participant\",\"delegate\",\"impartial\",\"contribute\",\"keep track of\",\"stand in for\"]},{\"name\": \"Before the meeting\",\"icon\": \"\",\"sub\": \"\",\"num\": 3,\"full\": false,\"img\": null,\"description\": \"A good meeting starts before anyone enters the room. The organiser sends an invitation and an agenda. Everyone reads the agenda, prepares what they need to say, and confirms that they will attend.\",\"points\": [\"Invitation — who is invited, when and where, how long, online or in person\",\"Agenda — the list of topics, in order, with a time allocated to each one\",\"A fuller agenda may also list the attendees, the date and place, and the action points from last time\",\"Many organisations have their own agenda template, so ask before you write one from scratch\",\"Confirming — reply to the invitation: accept, decline, or suggest another time\",\"Preparation — read the documents, note your questions, check the numbers\",\"Practical things — test the video link, find the room, arrive a few minutes early\"],\"when\": null,\"questions\": null,\"phrases\": null,\"example\": \"Hi all, please find attached the agenda for Tuesday's meeting. There are four items. Could you read the sales figures in advance? Please confirm by Monday. Thanks, Anna\",\"vocab\": [\"agenda\",\"item\",\"invitation\",\"attend\",\"confirm\",\"decline\",\"attach\",\"in advance\",\"brief\",\"allocate\",\"template\"]},{\"name\": \"Opening a meeting\",\"icon\": \"\",\"sub\": \"\",\"num\": 4,\"full\": false,\"img\": null,\"description\": \"The chair opens the meeting. In the first two minutes, they welcome everyone, say why the meeting is happening, and explain how it will run. A clear opening saves time later.\",\"points\": [\"Welcome — thank people for coming and introduce anyone new\",\"Purpose — say what the meeting is for, in one sentence\",\"Agenda — go through the topics and the timing\",\"Roles — say who is chairing, who is taking the minutes, and who is keeping time\",\"Link to the previous meeting — if needed, remind the group what was decided last time\",\"Ground rules — one person speaks at a time, keep to time, phones away\",\"Apologies — mention who cannot attend today\"],\"when\": null,\"questions\": null,\"phrases\": null,\"example\": \"Good morning, everyone. Thanks for coming. The purpose of today's meeting is to decide the launch date. We have three items and 45 minutes. Mika will take the minutes. We have apologies from Sara. Let's kick off with item one.\",\"vocab\": [\"chair\",\"purpose\",\"objective\",\"minutes-taker\",\"apologies\",\"ground rules\",\"go through\",\"kick off\",\"on time\"]},{\"name\": \"Taking part\",\"icon\": \"\",\"sub\": \"\",\"num\": 5,\"full\": false,\"img\": null,\"description\": \"In a meeting, you need to say what you think, agree or disagree politely, and sometimes interrupt. English speakers often use soft language for this. A direct 'no' can sound rude; 'I'm not sure about that' is safer.\",\"points\": [\"Giving your opinion — “In my view, …”, “I think we should …”\",\"Agreeing — “I agree with Sara.”, “That's a good point.”\",\"Disagreeing politely — “I see your point, but …”, “I'm not sure that would work, because …”\",\"Interrupting — “Sorry to interrupt, but …”, “Could I just add something?”\",\"Asking for clarification — “Could you explain what you mean by …?”\",\"Checking understanding — “So, if I understand correctly, …”\"],\"when\": null,\"questions\": null,\"phrases\": null,\"example\": \"I see your point, Jonas, but I'm not sure the timing works. Could we look at the numbers first? — Sorry to interrupt, could I just add one thing? From my point of view, the risk is the cost, not the timing.\",\"vocab\": [\"point of view\",\"raise a point\",\"interrupt\",\"clarify\",\"back up\",\"object to\",\"suggestion\",\"go along with\",\"hesitate\"]},{\"name\": \"Managing the discussion\",\"icon\": \"\",\"sub\": \"\",\"num\": 6,\"full\": false,\"img\": null,\"description\": \"The chair keeps the meeting on track. That means giving everyone a chance to speak, stopping side conversations, watching the time, and moving from one item to the next. Chairing is a skill, and you can learn it.\",\"points\": [\"Inviting people to speak — “Elina, what do you think?”\",\"Keeping to the topic — “That's important, but let's stay on item two.”\",\"Keeping to time — “We have five minutes left on this.”\",\"Moving on — “Shall we move on to the next item?”\",\"Summarising — “So far, we have agreed that …”\",\"Parking — “Let's park that and come back to it at the end.”\"],\"when\": null,\"questions\": null,\"phrases\": null,\"example\": \"Thanks, Elina. That's a good point, but let's park it and come back to it at the end. We are running a little over, so shall we move on to item three? Mika, I'll hand over to you.\",\"vocab\": [\"keep to\",\"on track\",\"move on\",\"wrap up\",\"park\",\"sum up\",\"run over\",\"digress\",\"hand over to\"]},{\"name\": \"Decisions and actions\",\"icon\": \"\",\"sub\": \"\",\"num\": 7,\"full\": false,\"img\": null,\"description\": \"Most meetings need a result. A proposal is a suggestion for a decision. The group discusses it and then agrees, votes, or rejects it. Every decision should become an action point: who does what, and by when.\",\"points\": [\"Making a proposal — “I propose that we …”, “My suggestion is …”\",\"Reaching agreement — “Are we all agreed?”, “Can we take that as a decision?”\",\"Voting — “All those in favour?”, “Anyone against?”\",\"Action points — a task, a person, and a deadline\",\"Checking — the chair repeats each action point before the meeting ends\",\"Follow-up — every action point appears in the minutes, usually as a list at the end\",\"Carry over — items you did not have time for become agenda items for the next meeting\"],\"when\": null,\"questions\": null,\"phrases\": null,\"example\": \"So the decision is: we launch on 15 May. Action point: Sara contacts the printer by Friday. Jonas updates the website by 10 May. Are we all agreed? Good, let's note that in the minutes.\",\"vocab\": [\"proposal\",\"propose\",\"in favour\",\"abstain\",\"consensus\",\"action point\",\"assign\",\"deadline\",\"postpone\"]},{\"name\": \"Closing and follow-up\",\"icon\": \"\",\"sub\": \"\",\"num\": 8,\"full\": false,\"img\": null,\"description\": \"A meeting should end on time and with a clear summary. The chair repeats the decisions and the action points, thanks everyone, and fixes the next meeting. After the meeting, the minutes are sent to everyone, usually within a day or two.\",\"points\": [\"The chair reviews the action points, so that everyone knows what they must do\",\"Any other business (AOB) — a short chance to raise something small\",\"Questions — the chair asks if anyone has a question or a comment\",\"Reminders — any last-minute practical points, such as signing the attendance sheet\",\"Thanks — thank people for their time and their ideas\",\"Next meeting — the date and time, when the minutes will be available, and who to contact with questions\",\"Follow-up — check that the action points are done before the next meeting\"],\"when\": null,\"questions\": null,\"phrases\": null,\"example\": \"To sum up: we have agreed the launch date and three action points. Any other business? No? Then let's close. Thank you all for your time. Mika will circulate the minutes tomorrow, and we meet again on 8 May.\",\"vocab\": [\"any other business (aob)\",\"minutes\",\"close\",\"adjourn\",\"next steps\",\"circulate\",\"follow up\",\"recap\",\"attendee\",\"attendance sheet\",\"resolve\"]}]}],\"exercise\": {\"kind\": \"register\",\"title\": \"Say It Right\",\"intro\": \"Read what you might <em>think<\u002Fem>, or say to a friend. Then choose the best way to say it <strong>in a meeting<\u002Fstrong>.\",\"lead\": \"You might think, or say to a friend:\",\"ask\": \"Which is the best way to say it in a meeting?\",\"items\": [{\"casual\": \"I don't agree.\",\"options\": [\"I'm afraid I see it a little differently.\",\"No, you're wrong.\",\"That's not true.\"],\"answer\": \"I'm afraid I see it a little differently.\",\"rationale\": \"“I'm afraid” and “a little differently” soften the disagreement. The other two attack the person or the idea directly.\"},{\"casual\": \"Be quiet, I'm talking.\",\"options\": [\"Sorry, could I just finish my point?\",\"Stop interrupting me.\",\"Let me talk!\"],\"answer\": \"Sorry, could I just finish my point?\",\"rationale\": \"This is a polite request that keeps your turn without sounding angry. The other options sound like a fight.\"},{\"casual\": \"What?\",\"options\": [\"Sorry, could you say that again?\",\"What did you say?\",\"Huh?\"],\"answer\": \"Sorry, could you say that again?\",\"rationale\": \"“Could you …?” plus “sorry” is the standard way to ask someone to repeat. “What?” can sound rude in a meeting.\"},{\"casual\": \"Let's stop talking about this.\",\"options\": [\"Shall we move on to the next item?\",\"This is boring. Next.\",\"Enough about this.\"],\"answer\": \"Shall we move on to the next item?\",\"rationale\": \"“Shall we …?” asks the group instead of giving an order. It is the normal way to change topic in a meeting.\"},{\"casual\": \"Do it by Friday.\",\"options\": [\"Could you have it ready by Friday?\",\"Friday. Do it.\",\"I need it on Friday, OK?\"],\"answer\": \"Could you have it ready by Friday?\",\"rationale\": \"A question with “could you” turns an order into a request. The deadline is still clear.\"},{\"casual\": \"Your idea won't work.\",\"options\": [\"I'm not sure that would work, because of the cost.\",\"That's a terrible idea.\",\"No way that works.\"],\"answer\": \"I'm not sure that would work, because of the cost.\",\"rationale\": \"This version criticises the idea, not the person, and gives a reason. The other two give no reason and sound aggressive.\"},{\"casual\": \"I want to say something.\",\"options\": [\"Sorry to interrupt, but could I add something?\",\"Hey, listen to me.\",\"Me now.\"],\"answer\": \"Sorry to interrupt, but could I add something?\",\"rationale\": \"“Sorry to interrupt” shows that you know you are breaking in, and “could I” asks for permission.\"},{\"casual\": \"We're finished. Bye.\",\"options\": [\"I think that covers everything. Thank you all for your time.\",\"OK, done. Bye.\",\"That's it. Go.\"],\"answer\": \"I think that covers everything. Thank you all for your time.\",\"rationale\": \"A meeting should close with a short summary and thanks. The other two are too abrupt for a work setting.\"}]},\"quiz\": [{\"q\": \"Your manager asks everyone to report what they finished this week and what is late. What type of meeting is this?\",\"options\": [\"Status update meeting\",\"Team-building meeting\",\"Innovation meeting\",\"Information-sharing meeting\"],\"answer\": \"Status update meeting\",\"rationale\": \"In a status update meeting, each person reports on progress: what is done, what is late, and what happens next.\"},{\"q\": \"A meeting where people create new ideas by brainstorming is a(n) …\",\"options\": [\"decision-making meeting\",\"innovation meeting\",\"status update meeting\",\"problem-solving meeting\"],\"answer\": \"innovation meeting\",\"rationale\": \"An innovation meeting is for brainstorming and challenging the usual way of thinking. Decisions and problems come later.\"},{\"q\": \"What is the main purpose of a team-building meeting?\",\"options\": [\"To decide the budget\",\"To share information with many people\",\"To strengthen the relationships in the team\",\"To fix a technical problem\"],\"answer\": \"To strengthen the relationships in the team\",\"rationale\": \"Team building is about people, not tasks: it helps people know and trust each other, so they work better together.\"},{\"q\": \"Who opens the meeting, gives people the turn to speak, and keeps the group to the agenda?\",\"options\": [\"The timekeeper\",\"The chair\",\"The minute taker\",\"The facilitator\"],\"answer\": \"The chair\",\"rationale\": \"The chair leads the meeting from beginning to end. In small teams the chair often does the facilitator's job as well.\"},{\"q\": \"What does a facilitator mainly do?\",\"options\": [\"Writes the record of the meeting\",\"Watches the clock\",\"Helps the discussion work, so the group reaches a result\",\"Books the meeting room\"],\"answer\": \"Helps the discussion work, so the group reaches a result\",\"rationale\": \"A facilitator makes sure everyone is heard and that the discussion leads somewhere. A good facilitator stays impartial.\"},{\"q\": \"What does 'impartial' mean?\",\"options\": [\"Not arguing for one side while running the meeting\",\"Having no opinion of your own about the subject\",\"Staying silent and not taking part in the discussion\",\"Accepting whatever the majority of the group decides\"],\"answer\": \"Not arguing for one side while running the meeting\",\"rationale\": \"An impartial chair or facilitator may well have an opinion, and does take part. What they do not do is argue for one side while running the discussion.\"},{\"q\": \"Which of these is NOT usual
